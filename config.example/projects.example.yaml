# Kandu project registry — example.
# /kandu-add writes entries to local/projects.yaml (gitignored) by asking you questions.
# A project that is not in local/projects.yaml is never touched.

projects:
  # A project Kandu may clone and run in its own work folder on the brain's machine.
  - name: website
    description: Public website of Acme
    family: acme                       # one board per family
    repos: [acme-org/website]
    board:
      owner: acme-org
      number: 1
      columns: { Ready: "To do" }      # only for a column named differently on this board
    run: clone                         # clone | in-place — always set by you, never inferred
    machine: server
    path: ~/kandu-work/website
    test: npm test
    allowed_tools: ["Bash(npm install)"]   # extra tools for this project's workers, when kandu.yaml limits them (permissions)
    # To let workers check a page or a demo in a headless browser (kandu/look.py, it changes nothing),
    # add a Python that has Playwright, for example:
    #   "Bash(/path/to/venv/bin/python /path/to/kandu/kandu/look.py *)"
    # and say so in repo_rules, so the worker knows it may.
    run_local: npm run dev
    deploy:
      mode: direct                     # direct | preview
      command: npx wrangler deploy
      live_url: https://www.example.com
    secrets_from: ~/projects/website/.env   # location only; values are never copied or logged
    task_tokens:                       # the only values a task labelled uses-tokens gets, and what each is for
      IMAGE_API_KEY: "generating images"
    forbidden: ["migrations/", "src/payments/"]
    repo_rules: "CI must be green before merge"
    auto_merge: false                  # overrides supervisor.auto_merge for this project
    frozen: false                      # true: nothing merges by itself, for example before a release
    split_approval: user               # user | queen: who accepts a split proposal; the dashboard's switch wins.
                                       # Today every proposal waits for the user's yes either way
    queen_answers_one_way: false       # true: the queen's yes to a merge answers its one-way door and the review's
                                       # questions for the user; off, those wait for the user's yes. The dashboard's switch wins
    priority: 1                        # 1 = highest
    max_parallel_workers: 2
    daily_token_limit: 2000000         # no new task starts past this; cache reads do not count
    queen_rules: "Fixes for the checkout come before anything else"   # how the queen paces this project
    reports: [docs/LESSONS.md]         # the project's own reports for Kandu, on its machine; Didban reads their newest
                                       # lines with its brief, read-only (relative paths start at `path`)
    inspect:                           # optional; Bazras's daily read-only look, for a live project (DESIGN §5)
      enabled: false                   # off by default; turn it on here or in the dashboard's Bazras tab
      at: "07:00"                      # its hour on the brain's clock; default bazras.at in kandu.yaml
      tests: true                      # run `test` on the default branch
      units:                           # systemd units on the project's machine; `user:` for a user unit
        - website.service
        - user:website-backup.timer
      cron: [website-report]           # text that must stay in the crontab of the project's machine
      logs: [logs/app.log]             # log files on its machine (relative to `path`); new error lines are findings
      checks:                          # the project's own checks, run in a fresh checkout; non-zero exit = finding
        - make check-links
      ignore: [CHANGELOG.md, "docs/*"] # files whose change after a Kandu commit is not rework
    paused: false

  # A project that must run on a specific machine (in a separate git worktree there).
  - name: internal-tool
    description: Internal tool that needs a local database on the laptop
    family: acme
    repos: [acme-org/internal-tool]
    board:
      owner: acme-org
      number: 1
      columns: { Ready: "To do" }
    run: in-place
    machine: laptop                    # if the laptop is off, its tasks wait for the next cycle
    path: ~/code/internal-tool
    test: make test
    deploy:
      mode: preview
      command: make deploy-preview     # a live checkout that pulls: ~/kandu/.venv/bin/python -I ~/kandu/kandu/pull.py ~/projects/app
      live_url: https://preview.example.com
    priority: 2
    max_parallel_workers: 1
    daily_token_limit: 1000000
    paused: false
