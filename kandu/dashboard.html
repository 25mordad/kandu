  $("modalbody").innerHTML = `<div class="log" dir="ltr">${actions.map(a => `<div>${esc(a.tool)} <span class="muted">${esc(a.detail)}</span></div>`).join("") || `<div class="muted">${t("nothing_yet")}</div>`}</div>`;
  const log = $("modalbody").querySelector(".log");
  log.scrollTop = atEnd ? log.scrollHeight : (box?.scrollTop || 0);
}

function roundBox(round, open) {
  return `<details class="round"${open ? " open" : ""}><summary>${t("round")} ${num(round.round)}: ${esc(tr(round.recommendation))}</summary><div class="round-body">
    <div dir="auto">${esc(lang === "fa" && round.user_brief || round.brief)}</div>
    <div class="chips"><span class="chip">${esc(tr(round.door))}</span><span class="chip" dir="auto">${esc(round.blast_radius)}</span></div>
    ${(round.wait_for_user || []).map(q => `<div class="finding blocker" dir="auto">${esc(q)}</div>`).join("")}
    ${round.open.map(f => `<div class="finding${f.blocker ? " blocker" : ""}"><div class="finding-head">${t(f.blocker ? "blocker" : "note")} · <bdi class="mono">${esc(f.path)}</bdi></div><div dir="auto">${esc(f.body)}</div></div>`).join("")}
  </div></details>`;
}

function queued(task) {
  return Object.values(lastQueue?.projects || {}).flatMap(columns => Object.entries(columns).flatMap(([column, tasks]) => tasks.map(item => ({...item, column})))).find(item => item.task === task);
}

// Why a merge waited, from the local log, and the open tasks it waits for, from the copy: one line each.
function heldLines(mark, blockers) {
  const column = name => tr(name || "no column");
  const named = b => `${numberOf(b.task)} ${column(b.column)}${b.slices.length ? ` (${t("slices")}: ${b.slices.map(s => `${numberOf(s.task)} ${column(s.column)}`).join(", ")})` : ""}`;
  const lines = [];
  if (blockers?.length) lines.push(`${t("waits_for_task")}: ${blockers.map(named).join(" · ")}`);
  if (mark?.waited?.length) lines.push(`${t("merge_waited")}: ${mark.waited.map(tr).join(" · ")}`);
  return lines;
}

// What stayed after the task's merge, and why: a folder or branch with work that is not in the PR.
function keptLines(kept) {
  return (kept || []).map(k => `${t("kept_after_merge")}: ${tr(k.what)} ${k.target} · ${tr(k.reason)}`);
}

// After a yes, the merge is promised only when nothing else still holds it.
function approval(task, pr, holds = []) {
  if (pr.approved) return `<p class="muted">${holds.length ? `${t("approved_held")} ${esc(holds.map(tr).join(" · "))}` : t("approved_waits")}</p>`;
  if (!pr.can_approve) return pr.state === "OPEN" ? `<p class="muted">${esc(tr(pr.why_not))}</p>` : "";
  if (!confirming) return `<button class="btn primary" data-sure>${t("approve")}</button>`;
  return `<div class="confirm"><div>${t("approve_sure")}</div><div class="actions"><button class="btn primary" data-approve="${esc(task)}" data-head="${esc(pr.head_sha)}">${t("approve")}</button><button class="btn" data-unsure>${t("cancel")}</button></div></div>`;
}

// A stopped task the user sends back to work. Nothing here merges.
function sendBack(task, item) {
  if (!item || item.by_hand || !["Blocked", "Needs info"].includes(item.column)) return "";
  if (!sendingBack) return `<button class="btn primary" data-back-sure>${t("send_back")}</button>`;
  return `<div class="confirm"><div>${t("send_back_sure")}</div><div class="actions"><button class="btn primary" data-back="${esc(task)}">${t("send_back")}</button><button class="btn" data-unsure>${t("cancel")}</button></div></div>`;
}

// A task's status in one plain sentence, with its reason.
function statusText(status) {
  const detail = !status.detail ? null : status.why === "review_blockers" ? num(Number(status.detail))
    : status.detail.split("; ").map(tr).join(lang === "fa" ? "؛ " : "; ");
  const sentence = t(`status_${status.why || status.state}`);
  return sentence.includes("{detail}") ? sentence.replace("{detail}", detail || t("status_no_detail")) : detail ? `${sentence} (${detail})` : sentence;
}

// What a waiting task waits on, where the problem is and the next step, from the wait the server worked out. Links
// are drawn only for GitHub and the checks' https pages, as the server keeps them.
function waitLines(wait) {
  if (!wait) return [];
  const checks = wait.checks || [], first = checks[0], blockers = wait.blockers || [];
  const issue = key => { const [repo, number] = key.split("#"); return `https://github.com/${repo}/issues/${number}`; };
  let what, step, where = [];
  if (wait.on === "check") {
    what = first ? fillIn("wait_check", {name: checks.map(c => c.name).join(", ")}) : t("wait_checks");
    where = checks.filter(c => c.url).map(c => [c.name, c.url]);
    step = first ? fillIn(first.url ? "step_log" : "step_check", {name: first.name}) : t("step_checks");
  } else if (wait.on === "blocker") {
    what = fillIn("wait_blocker", {name: blockers.join(", ")});
    where = blockers.map(b => [b, issue(b)]);
    step = fillIn("step_blocker", {name: blockers[0]});
  } else if (wait.on === "decision" && (wait.detail || []).length) {
    what = fillIn("wait_decision_on", {detail: wait.detail.map(tr).join(lang === "fa" ? "؛ " : "; ")});
    step = t("step_ask");
  } else {
    what = t(`wait_${wait.on}`);
    step = t(wait.on === "yes" ? "step_yes" : "step_ask");
  }
  return [esc(fillIn("wait_on", {what})),
          ...where.map(([name, url]) => `${esc(t("wait_where"))}: <a class="textlink" href="${esc(url)}" target="_blank" rel="noopener" dir="ltr">${esc(name)} ↗</a>`),
          esc(fillIn("wait_step", {step})), ...(wait.held ? [esc(t("wait_held"))] : [])];
}

async function toQueen(button) {
  const [repo, number] = button.dataset.toQueen.split("#");
  if (await act(button, `/tasks/${repo}/${number}/to-queen`)) { toast(t("to_queen_done")); await refreshQueue(lastState, true).catch(() => {}); }
  showTask(button.dataset.toQueen);
}


// What a by-hand task is and how the user does it, with its goal and criteria from the copy, read-only.
function byHandBox(item) {
  if (!item?.by_hand) return "";
  const part = (label, text) => text ? `<div><div class="muted">${label}</div><div class="slice-body" dir="auto">${esc(text)}</div></div>` : "";
  return `<div class="card pad"><p>${t("by_hand_what")}</p><p>${t("by_hand_how")}</p><p>${t("by_hand_done")}</p></div>
    ${part(t("issue_goal"), item.goal)}${part(t("issue_criteria"), item.criteria)}`;
}

// The user's yes to the slices, asked first.
function splitAccept(task, proposal) {
  return confirming
    ? `<div class="confirm"><div>${t("approve_split_sure")}</div><div class="actions"><button class="btn primary" data-split="${esc(task)}" data-fingerprint="${esc(proposal.fingerprint)}">${t("approve_split")}</button><button class="btn" data-unsure>${t("cancel")}</button></div></div>`
    : `<button class="btn primary" data-sure>${t("approve_split")}</button>`;
}

async function approveSplit(button) {
  const task = button.dataset.split;
  const [repo, number] = task.split("#");
  const path = `/splits/${repo}/${number}/approve?proposal=${encodeURIComponent(button.dataset.fingerprint)}`;
  if (await act(button, path, t("split_creating"))) toast(t("split_approved"));
  confirming = false;
  showTask(task);
}

// A task's sheet: from the bottom on a phone, centred on a wide screen. It tells the task's story, its phases, links,
// what it does, the queen's question, the proposed slices and its steps so far, and its footer says what waits and
// offers the actions Kandu has for its state. Every place that opens a task opens this sheet.
const PHASES = ["sizing", "implement", "review", "merge", "deploy", "live check"];
const QUIET_STEPS = ["notification_sent", "notification_failed"];  // they tell the user, not the task's story

// The phases a task walked, then those still to come; the one it is in now is marked: a worker's phase, the merge
// while its PR waits or was approved, its last review while in review. A stuck task stays at the phase it stopped
// in. A task waiting its turn is in none yet, and a done one has walked them all.
function taskPhases(item, worker, steps) {
  const kind = phase => /^(review round|fix round|update$|queen's|sizing notes$)/.test(phase) ? "review" : phase;
  const walked = [];
  for (const step of steps) if (step.type === "phase_changed" && step.phase && walked.at(-1) !== step.phase) walked.push(step.phase);
  const column = item?.column, last = walked.at(-1) || null;
  if (column === "Done") return (walked.length ? walked : PHASES).map(name => ({name, label: tr(name), at: "done"}));
  const now = worker?.phase || (["Your approval", "Approved"].includes(column) ? "merge"
    : column === "In review" ? (kind(last || "") === "review" ? last : "review")
    : ["In progress", "Blocked", "Stuck"].includes(column) ? last || (column === "In progress" ? "implement" : null) : null);
  const list = now && walked.at(-1) !== now ? [...walked, now] : walked;
  const furthest = Math.max(-1, ...list.map(name => PHASES.indexOf(kind(name))));
  return [...list.map((name, i) => ({name, at: now && i === list.length - 1 ? "now" : "done"})),
          ...PHASES.slice(furthest + 1).map(name => ({name, at: "next"}))].map(p => ({...p, label: tr(p.name)}));
}

// One step of the task's story: what happened, when, and its detail.
function stepOf(e) {
  const named = text => lang === "en" ? text.replace(/_/g, " ").replace(/^./, c => c.toUpperCase()) : tr(text);
  const title = e.type === "phase_changed" && e.phase ? (lang === "en" ? named(e.phase) : tr(e.phase)) : named(e.type);
  const detail = [e.round ? fillIn("step_round", {n: num(e.round)}) : null, typeof e.blockers === "number" ? fillIn("step_blockers", {n: num(e.blockers)}) : null,
                  e.size ? tr(e.size) : null, e.door ? tr(e.door) : null, e.role ? tr(e.role) : null,
                  e.duration_ms ? fillIn("so_far_min", {n: num(Math.max(1, Math.round(e.duration_ms / 60000)))}) : null,
                  ...[e.action, e.decision, e.reason, e.outcome].filter(Boolean).map(tr)].filter(Boolean);
  return {title, time: when(e.ts), text: detail.join(" · ")};
}

// What the sheet shows of a task, from the state, the queue and what the API says of it: its PR and reviews, its
// issue and steps, and the split proposed for it.
function sheetView(task, s, queue, {review, info, proposal}) {
  const item = fields(s, queue).flatMap(patch => patch.tasks.map(entry => ({...entry, project: patch.name}))).find(entry => entry.task === task);
  const wait = waitItems(s, queue).find(entry => entry.task === task);
  const worker = (s.workers || []).find(w => w.task === task) || null;
  const steps = (info?.steps || []).filter(e => !QUIET_STEPS.includes(e.type));
  const body = info?.issue?.body || "";
  const goal = body.match(/^##\s*Goal\s*\n([\s\S]*?)(?=\n##\s|$)/m)?.[1].trim() || body.split(/\n\s*\n/)[0].trim();
  const status = s.flowers?.[task]?.status || null;
  const stuck = item && (["Stuck", "Blocked"].includes(item.column) || status?.state === "stuck") && !worker;
  const [repo, number] = task.split("#");
  return {task, item: item || null, worker, status, review: review || null, proposal: proposal || null, info: info || null,
          number: numberOf(task), project: item?.project || repoOf(task), title: item?.title || review?.pr?.title || repoOf(task),
          meta: [item?.project || repoOf(task), ...(item ? taskMarks(item) : [])].join(" · "),
          state: wait && !wait.stuck ? wait.kind : item ? (item.column === "waiting" ? t("waiting_machine") : stateText(item)) : "",
          tone: stuck ? "red" : wait ? "amber" : "honey",
          phases: taskPhases(item, worker, steps),
          links: {pr: review?.pr?.url || null, issue: item?.url || `https://github.com/${repo}/issues/${number}`,
                  run: worker?.run_id || steps.filter(e => e.run_id).at(-1)?.run_id || null},
          what: goal, question: (s.queen?.questions || []).find(q => q.task === task)?.question || null,
          drop: (s.queen?.drops || []).find(d => d.task === task) || null,
          steps: steps.map(stepOf), wait: wait || null, language: s.language};
}

function sheetBody(v) {
  const link = (url, label) => url ? `<a class="textlink" href="${esc(url)}" target="_blank" rel="noopener">${label} ↗</a>` : "";
  const phases = v.phases.map(p => `<div class="phase ${p.at}"><i class="hex"></i><span>${esc(p.label)}</span></div>`).join("");
  const status = v.status ? `<div class="status-line ${esc(v.status.state)}"><span class="badge">${esc(t(`state_${v.status.state}`))}</span><span dir="auto">${esc(statusText(v.status)
    + (v.status.tries ? " " + fillIn("status_tries", {this: num(v.status.tries.this), of: num(v.status.tries.of)}) : ""))}</span></div>
    ${v.status.cleaned ? `<p class="muted" dir="auto">${esc(t("cleaned_folder"))}: ${esc(tr(v.status.cleaned))}</p>` : ""}` : "";
  // The user's language, also one the page has no text for. The English is what reaches the issue.
  const own = v.proposal && (lang === "en" && TEXT[v.language] ? null : v.proposal.user_text);
  const slices = v.proposal ? `<div class="sheet-box"><div class="sheet-box-head">${t("proposed_slices")}</div><div dir="auto">${esc(own?.reason || v.proposal.reason)}</div>
    ${v.proposal.slices.map((slice, i) => `<details class="round"><summary>${num(i + 1)}. <span dir="auto">${esc(own?.slices[i].title || slice.title)}</span></summary><div class="round-body">
    <div class="chips"><span class="chip">${esc(tr(slice.size))}</span><span class="chip">${num(slice.files)} ${t("files_touched")}</span><span class="chip">${esc(tr(slice.door))}</span></div>
    <div class="slice-body" dir="auto">${esc(own?.slices[i].body || slice.body)}</div></div></details>`).join("")}<p class="muted">${t("split_decline_hint")}</p></div>` : "";
  const counted = tokens => tokens.total - tokens.cache_read;  // as the daily limit counts them
  const cost = v.item?.column === "Done" && v.info?.cost ? `<div class="chips">${v.info.outcome ? `<span class="chip">${esc(tr(v.info.outcome))}</span>` : ""}<span class="chip">${t("cost_tokens")}: ${num(counted(v.info.cost.total))}</span></div>` : "";
  const r = v.review;
  const lines = [...(r ? heldLines({waited: r.waited}, r.blockers) : heldLines(v.item?.mark, v.item?.blockers)), ...keptLines(r?.kept)];
  const steps = v.steps.map((step, i) => `<div class="step${i === v.steps.length - 1 ? " last" : ""}"><i class="hex"></i><div><div class="step-head"><b dir="auto">${esc(step.title)}</b><time>${esc(step.time)}</time></div>
    ${step.text ? `<div class="step-text" dir="auto">${esc(step.text)}</div>` : ""}</div></div>`).join("");
  return `<div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head"><div class="sheet-hex ${v.tone}">${v.number}</div><div class="sheet-who"><div class="muted" dir="auto">${esc(v.meta)}</div><h2 dir="auto">${esc(v.title)}</h2></div>
    <button class="sheet-close" data-close-sheet aria-label="${esc(t("close"))}">✕</button></div>
    <div class="phases" style="--n:${v.phases.length}">${phases}</div>
    <div class="sheet-state"><b class="tone-${v.tone === "honey" ? "ink" : v.tone}">${esc(v.state)}</b><span class="spacer"></span>${link(v.links.pr, t("task_pr"))}${link(v.links.issue, t("task_issue"))}
    ${v.links.run ? `<button class="textlink" data-run="${esc(v.links.run)}">${t("task_run_log")}</button>` : ""}</div>
    ${status}${v.what ? `<div class="sheet-what slice-body" dir="auto">${esc(v.what)}</div>` : ""}
    ${v.question ? `<div class="sheet-box"><div class="sheet-box-head tone-amber">${t("kind_queen")}</div><div class="sheet-question" dir="auto">${esc(v.question)}</div></div>` : ""}
    ${slices}${byHandBox(v.item)}${cost}${lines.map(line => `<p class="muted" dir="auto">${esc(line)}</p>`).join("")}
    <div class="sheet-section"><b>${t("task_steps")}</b><div class="steps">${steps || `<div class="muted">${t("no_steps")}</div>`}</div></div>
    ${r?.rounds?.length ? `<div class="sheet-section">${r.rounds.slice().reverse().map((round, i) => roundBox(round, i === 0)).join("")}</div>` : ""}`;
}

// The footer: what waits, if anything, and the actions Kandu has for the task's state; with none, its page on GitHub.
function sheetFoot(v) {
  const notes = v.status?.wait ? waitLines(v.status.wait) : v.wait ? [esc(v.wait.line)] : [];
  const tone = v.tone === "honey" ? "amber" : v.tone;
  const project = v.item?.project || repoOf(v.task);
  const actions = [
    v.review?.pr ? approval(v.task, v.review.pr, v.review.holds) : "",
    v.proposal ? splitAccept(v.task, v.proposal) : "",
    sendBack(v.task, v.item),
    v.status?.why === "internal_error" ? `<button class="btn" data-to-queen="${esc(v.task)}" title="${esc(t("to_queen_hint"))}">${t("to_queen")}</button>` : "",
    v.drop ? `<button class="btn primary" data-drop="${esc(v.task)}" data-blocker="${esc(v.drop.blocker)}">${t("drop_yes")}</button>` : "",
    v.question ? `<button class="btn" data-fly="didban" data-focus="${esc(project)}">${t("ask_didban")}</button>` : "",
    v.item?.by_hand ? `<span id="taskflight" class="flightbox">${flightControls(flights.open.find(f => f.task === v.task), v.task, t("open_flight"))}</span>` : "",
    v.worker?.run_id ? `<button class="btn danger" data-stop="${esc(v.worker.run_id)}">${t("stop_bee")}</button>` : "",
  ].filter(Boolean);
  const github = v.links.pr || v.links.issue;
  if (!actions.length || actions.every(a => a.startsWith("<p"))) actions.push(`<a class="btn" href="${esc(github)}" target="_blank" rel="noopener">${t("open_github")} ↗</a>`);
  return `${notes.length ? `<div class="sheet-note tone-${tone}">${notes.map(line => `<div dir="auto">${line}</div>`).join("")}</div>` : ""}<div class="actions">${actions.join("")}</div>`;
}

async function showTask(task) {
  shownTask = task;
  const [repo, number] = task.split("#");
  const item = queued(task);
  const [review, proposal, info] = await Promise.all([get(`/reviews/${repo}/${number}`).catch(() => null),
    item?.column === "Needs split" ? get(`/splits/${repo}/${number}`).then(s => s.split).catch(() => null) : null,
    get(`/tasks/${repo}/${number}`).catch(() => null)]);
  if (shownTask !== task) return;
  const view = sheetView(task, lastState || {}, lastQueue, {review, info, proposal});
  $("sheetbody").innerHTML = sheetBody(view);
  $("sheetfoot").innerHTML = sheetFoot(view);
  if (!$("sheet").open) { $("sheet").showModal(); $("sheetbody").scrollTop = 0; }
}

document.addEventListener("click", e => {
  const hit = name => e.target.closest(`[data-${name}]`);
  { const tg = hit("tg-send") || hit("tg-use") || hit("tg-find") || hit("tg-test"); if (tg) { tgConnect(tg); return; } }
  const yes = hit("approve"), run = hit("run"), stop = hit("stop"), tabButton = hit("tab"), pause = hit("pause"), acceptSplit = hit("split");
  if (hit("close")) { $("modal").close(); return; }
  if (hit("close-sheet")) { $("sheet").close(); return; }
  if (hit("menu")) { chooseMore(hit("menu")); return; }
  if (hit("choose-look")) { pickLook(hit("choose-look")); return; }
  if (e.target === $("lookmenu")) { $("lookmenu").close(); return; }
  if (e.target === $("moremenu") || e.target.closest("#moremenu a")) { $("moremenu").close(); return; }
  if (hit("fly")) { openFlight(hit("fly")); return; }
  if (hit("inspect")) { saveInspect(hit("inspect")); return; }
  if (hit("remove")) { removeProject(hit("remove")); return; }
  if (hit("settings-open")) { openSettings(hit("settings-open").dataset.settingsOpen); return; }
  if (hit("draft") && hit("draft").tagName === "BUTTON") { changeDraft(hit("draft")); return; }
  if (hit("set-save") || hit("set-yes")) { saveSettings(hit("set-save") || hit("set-yes")); return; }
  if (hit("set-no")) { setEdit.asking = false; drawSettings(); return; }
  if (hit("set-cancel")) { $("setsheet").close(); return; }
  if (hit("set-land")) { landForRename(hit("set-land")); return; }
  if (hit("switch")) { flipSwitch(hit("switch")); return; }
  if (hit("add-machine")) { openAdd(""); return; }
  if (hit("step")) { changeStep(hit("step")); return; }
  if (hit("land")) { act(hit("land"), `/flights/${encodeURIComponent(hit("land").dataset.land)}/close`).then(() => refreshFlights()).catch(() => {}); return; }
  if (hit("limits")) { changeLimits(hit("limits")); return; }
  if (hit("parallel")) { changeParallel(hit("parallel")); return; }
  if (hit("backup")) { changeBackup(hit("backup")); return; }
  if (hit("upstream-check")) { act(hit("upstream-check"), "/upstream/check").then(() => refreshState()).catch(() => {}); return; }
  if (hit("upstream-bring")) { act(hit("upstream-bring"), "/upstream/bring-in").then(answer => { if (answer) toast(t(answer.created ? "upstream_task_made" : "upstream_task_there")); return refreshState(); }).catch(() => {}); return; }
  if (hit("requests")) { act(hit("requests"), `/requests?enabled=${hit("requests").dataset.requests}`).then(() => refreshState()).catch(() => {}); return; }
  if (hit("drops")) { act(hit("drops"), `/drop-blockers?enabled=${hit("drops").dataset.drops}`).then(() => refreshState()).catch(() => {}); return; }
  if (hit("drop")) { dropBlocker(hit("drop")); return; }
  if (hit("sure") || hit("unsure")) { confirming = Boolean(hit("sure")); sendingBack = false; showTask(shownTask); return; }
  if (hit("back-sure")) { sendingBack = true; confirming = false; showTask(shownTask); return; }
  if (hit("back")) { doSendBack(hit("back")); return; }
  if (hit("wait-to")) { waitKey = hit("wait-to").dataset.waitTo; renderToday(); return; }
  if (hit("approve-open")) { confirming = true; sendingBack = false; showTask(hit("approve-open").dataset.approveOpen); return; }
  if (hit("back-open")) { sendingBack = true; confirming = false; showTask(hit("back-open").dataset.backOpen); return; }
  if (hit("to-queen")) { toQueen(hit("to-queen")); return; }
  if (pause) {  // the meadow's switch
    e.preventDefault();
    act(pause, `/projects/${encodeURIComponent(pause.dataset.pause)}/${pause.dataset.paused === "true" ? "resume" : "pause"}`);
    return;
  }
  if (yes) { approve(yes); return; }
  if (acceptSplit) { approveSplit(acceptSplit); return; }
  if (tabButton) { $("moremenu").close(); showTab(tabButton.dataset.tab); return; }
  if (stop) { act(stop, `/workers/${encodeURIComponent(stop.dataset.stop)}/stop`); return; }
  if (run) { showRun(run.dataset.run); return; }
  const review = hit("review");
  if (review) { confirming = false; sendingBack = false; showTask(review.dataset.review); }
  if (e.target === $("modal")) $("modal").close();
  if (e.target === $("sheet")) $("sheet").close();
  if (e.target === $("setsheet")) $("setsheet").close();
});
document.addEventListener("input", e => {
  if (setEdit && e.target.matches?.("input[data-draft]")) changeDraft(e.target);
});
document.addEventListener("toggle", e => {
  if (e.target.id === "meadowbox") { sceneKey = null; if (lastState) renderScene(lastState, lastQueue); return; }
  const asked = e.target.dataset?.request;
  if (asked !== undefined) { if (e.target.open) openRequests.add(asked); else openRequests.delete(asked); return; }
  const name = e.target.dataset?.project;
  // A group drawn open says so too: only the user's own fold or open is kept, and not while searching opens them all.
  if (name === undefined || $("search").value.trim() || String(e.target.open) === e.target.dataset.open) return;
  e.target.dataset.open = e.target.open;
  folded[name] = !e.target.open;
  save(FOLDED_KEY, JSON.stringify(folded));
}, true);
$("modal").addEventListener("close", () => { shownRun = null; });
$("sheet").addEventListener("close", () => { shownTask = null; confirming = sendingBack = false; });
$("setsheet").addEventListener("close", () => { setEdit = null; });
$("stop").onclick = askStop;
$("stopnow").onclick = e => confirmed(e.currentTarget, "/stop", "stopbox");
$("resume").onclick = e => act(e.currentTarget, "/resume");
$("restartnow").onclick = e => confirmed(e.currentTarget, "/restart", "restartbox");
$("more").onclick = $("morenav").onclick = openMore;
$("look").onclick = openLooks;

// Adding a project: a few facts from the user, the rest read from the copy and shown before anything is written.
const fillIn = (key, values) => Object.entries(values).reduce((text, [k, v]) => text.replaceAll(`{${k}}`, v), t(key));

function machineOptions(chosen) {
  const machines = lastState?.machines || [];
  $("addmachine").innerHTML = machines.map(m => `<option value="${esc(m.name)}">${esc(m.name)}</option>`).join("")
    + `<option value="">${esc(t("new_machine"))}</option>`;
  if (chosen !== undefined) $("addmachine").value = chosen;
  $("newmachine").hidden = $("addmachine").value !== "";
}

// `machine` chooses the machine; "" opens it at a new one.
function openAdd(machine) {
  machineOptions(machine);
  $("proposal").hidden = true;
  $("addresult").innerHTML = "";
  $("addbox").showModal();
}

async function addMachine(button) {
  const query = new URLSearchParams({name: $("mname").value, ssh: $("mssh").value, always_on: $("malways").checked});
  const result = await act(button, `/machines?${query}`);
  if (!result) return;
  toast(t(result.reachable ? "machine_reachable" : "machine_unreachable"));
  await refreshState();
  machineOptions(result.machine);
}

async function detectProject(button) {
  const query = new URLSearchParams({machine: $("addmachine").value, path: $("addpath").value, repo: $("addrepo").value});
  const found = await act(button, `/projects/detect?${query}`);
  if (!found) return;
  const p = found.proposal;
  for (const input of $("proposal").querySelectorAll("[data-f]")) {
    if (input.type === "checkbox") input.checked = Boolean(p[input.dataset.f]);
    else input.value = p[input.dataset.f] ?? "";
  }
  $("addrepo").value = p.repo;
  $("addpath").value = p.path;
  $("proposalnote").textContent = fillIn("proposal_note", {repo: p.repo, copy: tr(found.copy), board: tr(found.board)});
  $("proposalwarnings").innerHTML = (found.warnings || []).map(w => `<li class="warn" dir="ltr">${esc(w)}</li>`).join("");
  $("proposal").hidden = false;
  $("addresult").innerHTML = "";
}

async function addProject(button) {
  const query = new URLSearchParams({machine: $("addmachine").value, path: $("addpath").value, repo: $("addrepo").value});
  for (const input of $("proposal").querySelectorAll("[data-f]")) query.set(input.dataset.f, input.type === "checkbox" ? input.checked : input.value);
  const result = await act(button, `/projects?${query}`);
  if (!result) return;
  const made = (url, key) => !url ? "" : url.startsWith("http")
    ? `<p><a class="textlink" href="${esc(url)}" target="_blank" rel="noopener">${esc(t(key))} ↗</a></p>`
    : `<p class="muted" dir="ltr">${esc(url)}</p>`;
  $("proposal").hidden = true;
  $("addresult").innerHTML = `<p>${esc(fillIn("project_added_msg", {name: result.project, board: result.board.number}))}</p>`
    + made(result.test_task, "test_task_made") + made(result.deploy_task, "deploy_task_made")
    + `<ul class="add-checks">${result.checks.map(c => `<li class="${esc(c.level)}" dir="ltr">${esc(c.level)} · ${esc(c.text)}</li>`).join("")}</ul>`;
}

$("addopen").onclick = () => openAdd();
$("addmachine").onchange = () => machineOptions($("addmachine").value);
$("maddbtn").onclick = e => addMachine(e.currentTarget);
$("detectbtn").onclick = e => detectProject(e.currentTarget);
$("addbtn").onclick = e => addProject(e.currentTarget);
$("addform").onsubmit = e => e.preventDefault();
document.querySelector("[data-addclose]").onclick = () => $("addbox").close();
$("wake").onclick = e => act(e.currentTarget, "/wake");
$("day").onchange = refreshDays;
$("usagerange").onchange = () => refreshUsage().catch(() => {});
$("usagefrom").onchange = $("usageto").onchange = () => refreshUsage().catch(() => {});
$("search").oninput = renderProjects;
$("lang").onclick = () => setLanguage(lang === "fa" ? "en" : "fa");
addEventListener("resize", () => { if (lastState) renderScene(lastState, lastQueue); });

// The reads a tab needs of its own, only while it shows; it reads them again when it is opened.
async function refreshShown() {
  if (tab === "days") await refreshDays();
  if (tab === "bazras") await refreshBazras();
}

async function refresh() {
  try { const s = await refreshState(); await refreshQueue(s); await refreshFlights(); await refreshShown(); }
  catch { toast(t("api_unreachable")); }
}
// A burst of stream events reads the state at most once every STATE_GAP: the first at once, the rest together once
// the gap has passed. The stream's own lines show at once.
const STATE_GAP = 5000, LIVE_EVERY = 30000, CALM_EVERY = 60000;
let stream = null, stateSoon = null;
function stateLater() {
  if (stateSoon) return;
  stateSoon = setTimeout(() => { stateSoon = null; refreshState().catch(() => {}); }, Math.max(0, stateReadAt + STATE_GAP - Date.now()));
}
function follow() {  // A page nobody is looking at asks for nothing, and catches up when it is seen again. A calm one never streams.
  if (document.hidden || calm) {
    stream?.close();
    stream = null;
  } else if (!stream) {
    stream = new EventSource("/api/v1/stream");
    stream.onmessage = m => {
      live = [JSON.parse(m.data), ...live].slice(0, LIVE_LINES);
      renderLive();
      stateLater();
    };
    loadLive().catch(() => {});
    refresh();
  }
}
function tick() {  // everything again every 30 seconds, or once a minute while calm
  clearTimeout(tick.timer);
  tick.timer = setTimeout(() => { if (!document.hidden) refresh(); tick(); }, calm ? CALM_EVERY : LIVE_EVERY);
}
function applyCalm() {
  document.documentElement.dataset.calm = calm ? "on" : "off";
  $("calm").setAttribute("aria-pressed", calm);
}
// Calm on: nothing moves, the stream closes and the state is read once a minute. Off brings both back.
function setCalm(on) {
  calm = on;
  save(CALM_KEY, on ? "on" : "off");
  applyCalm();
  sceneKey = null;
  if (lastState) { renderStats(lastState); drawTab(); }
  follow();
  tick();
}
$("calm").onclick = () => setCalm(!calm);
applyLanguage();
applyCalm();
showTab(tab);
renderLive();
document.addEventListener("visibilitychange", () => { follow(); if (calm && !document.hidden) refresh(); });
follow();
if (calm) refresh();
tick();
setInterval(() => { if (shownRun && !document.hidden && !calm) showRun(shownRun).catch(() => {}); }, 5000);
</script>
</body>
</html>
