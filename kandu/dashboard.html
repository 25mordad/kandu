<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kandu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 28'%3E%3Cpath fill='%23f5b301' d='M8 0h16l8 14-8 14H8L0 14z'/%3E%3C/svg%3E">
<style>
@font-face { font-family:Vazirmatn; src:url("/vazirmatn.woff2") format("woff2"); font-weight:100 900; font-display:swap; }
:root { color-scheme:light dark; --bg:#f6f5f2; --surface:#fff; --sunken:#f1efea; --ink:#1d1b18; --muted:#6c675e; --line:#e6e3dc; --accent:#9a6400; --honey:#f5b301; --on-honey:#2a1d00; --bad:#c43d2f; --good:#2f8a4e; --shadow:0 1px 2px #0000000d, 0 8px 24px #0000000a; --sky-top:#cfe9f5; --sky-low:#fdf2cf; --grass:#a9cf6b; --grass-deep:#7fb24d; --soil:#b98b4e; --hive:#e9a820; --hive-dark:#b87b0f; --sans:Vazirmatn, system-ui, sans-serif; --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root { --bg:#131210; --surface:#1b1a17; --sunken:#23211d; --ink:#eeece6; --muted:#a29d92; --line:#2f2c27; --accent:#f5b301; --bad:#f0806f; --good:#6fce8e; --shadow:0 1px 2px #0000004d; --sky-top:#141b33; --sky-low:#3a2a2c; --grass:#3f5a2b; --grass-deep:#2e4620; --soil:#5e4221; --hive:#d39516; --hive-dark:#8d5e0b; } }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:400 15px/1.65 var(--sans); }
h1, h2, h3, p { margin:0; }
a { color:var(--accent); text-underline-offset:2px; }
bdi { unicode-bidi:isolate; }
[dir="auto"] { unicode-bidi:plaintext; }
.muted { color:var(--muted); }
.mono { font-family:var(--mono); font-size:.86em; }
:focus-visible { outline:2px solid var(--honey); outline-offset:2px; }

.btn { font:500 14px/1.4 var(--sans); display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:36px; padding:6px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); cursor:pointer; text-decoration:none; white-space:nowrap; transition:background .12s, border-color .12s; }
.btn:hover { background:var(--sunken); }
.btn.primary { background:var(--honey); border-color:var(--honey); color:var(--on-honey); font-weight:600; }
.btn.primary:hover { filter:brightness(1.06); }
.btn.danger { color:var(--bad); }
.btn.danger:hover { background:color-mix(in srgb, var(--bad) 12%, transparent); border-color:var(--bad); }
.btn.small { min-height:30px; padding:3px 10px; font-size:13px; border-radius:8px; }
.btn.plain { border-color:transparent; background:none; }
.btn.plain:hover { background:var(--sunken); }
.btn:disabled { opacity:.5; cursor:default; }
input, select { font:400 14px/1.4 var(--sans); min-height:36px; padding:6px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); max-width:100%; min-width:0; }

.top { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.bar { display:flex; align-items:center; gap:10px; max-width:1240px; margin:auto; padding:10px 16px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:9px; font-size:18px; font-weight:700; }
.brand::before { content:""; width:20px; height:18px; background:var(--honey); clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); }
.pulse { display:inline-flex; align-items:center; gap:7px; min-width:0; font-size:13px; color:var(--muted); }
.pulse i { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
.pulse.awake i { background:var(--good); box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
.pulse.stopped i { background:var(--bad); }
.spacer { flex:1; }
.tabs { display:flex; gap:2px; max-width:1240px; margin:auto; padding:0 12px; overflow-x:auto; scrollbar-width:none; }
.tab { font:500 14px/1.4 var(--sans); padding:8px 12px 10px; border:0; border-bottom:2px solid transparent; background:none; color:var(--muted); cursor:pointer; white-space:nowrap; }
.tab:hover { color:var(--ink); }
.tab[aria-selected="true"] { color:var(--ink); border-color:var(--honey); }

main { max-width:1240px; margin:auto; padding:16px; display:grid; gap:14px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); min-width:0; }
.pad { padding:14px 16px; }
.card-title { font-size:14px; font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:8px; }

.stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
.stat { padding:12px 16px; }
.stat-label { font-size:13px; color:var(--muted); }
.stat-value { font-size:24px; font-weight:600; line-height:1.4; }
.stat-value.over { color:var(--bad); }
.stat-small { font-size:15px; line-height:2.2; font-weight:500; }
.meter { position:relative; height:6px; margin-top:6px; border-radius:3px; background:var(--sunken); }
.meter i { position:absolute; inset-block:0; inset-inline-start:0; border-radius:3px; background:var(--honey); transition:width .6s ease; }
.meter.over i { background:var(--bad); }
.meter b { position:absolute; inset-block:-3px; width:2px; background:var(--ink); opacity:.65; }
.stat small { display:block; margin-top:5px; font-size:12px; color:var(--muted); }

.ask { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; padding:12px 16px; background:color-mix(in srgb, #f2a65a 14%, var(--surface)); border:1px solid color-mix(in srgb, #f2a65a 45%, var(--line)); border-radius:14px; }
.ask-text { flex:1 1 320px; min-width:0; overflow-wrap:anywhere; }
.ask-who { font-size:13px; font-weight:600; color:var(--muted); }

.layout { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:14px; align-items:start; }
.side { display:grid; gap:14px; min-width:0; }
.tools { display:flex; gap:10px; align-items:center; }
.tools input { flex:1; }
.list { display:grid; gap:10px; }

.project summary { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:11px 16px; cursor:pointer; list-style:none; border-radius:14px; }
.project summary::-webkit-details-marker { display:none; }
.project-pause { margin-inline-start:auto; }
.slice-body { white-space:pre-wrap; overflow-wrap:anywhere; }
.project summary::before { content:""; width:7px; height:7px; border-inline-end:2px solid var(--muted); border-block-end:2px solid var(--muted); transform:rotate(-45deg); transition:transform .15s; flex:none; }
[dir="rtl"] .project summary::before { transform:rotate(45deg); }
.project[open] summary::before { transform:rotate(45deg); }
.project-name { font-weight:600; overflow-wrap:anywhere; min-width:0; }
.counts { display:flex; flex-wrap:wrap; gap:4px; margin-inline-start:auto; }

.badge { --c:#a8a297; display:inline-flex; align-items:center; gap:6px; padding:1px 9px; border-radius:999px; font-size:12px; font-weight:500; line-height:1.8; white-space:nowrap; background:color-mix(in srgb, var(--c) 16%, transparent); }
.badge::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--c); }

table { border-collapse:collapse; width:100%; }
th { font-size:12px; font-weight:500; color:var(--muted); text-align:start; padding:7px 16px; border-block:1px solid var(--line); white-space:nowrap; }
td { padding:9px 16px; border-bottom:1px solid var(--line); vertical-align:middle; overflow-wrap:anywhere; }
tr:last-child td { border-bottom:0; }
.rows tbody tr { cursor:pointer; }
.rows tbody tr:hover td { background:var(--sunken); }
.fit { width:1%; white-space:nowrap; }
.end { text-align:end; }
.number { color:var(--muted); font-variant-numeric:tabular-nums; }
.textlink { all:unset; cursor:pointer; overflow-wrap:anywhere; }
.textlink:focus-visible { outline:2px solid var(--honey); outline-offset:2px; }
.tokenbar { display:block; height:4px; min-width:2px; margin-top:4px; border-radius:2px; background:var(--honey); }

.bee-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 0; border-bottom:1px solid var(--line); }
.bee-row:last-child { border-bottom:0; padding-bottom:0; }
.bee-row:first-of-type { padding-top:0; }
.bee-who { flex:1 1 150px; min-width:0; }
.bee-who div { font-size:13px; color:var(--muted); }
.brief { white-space:pre-line; overflow-wrap:anywhere; }
.brief.clamp { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:7; overflow:hidden; }
.meta { font-size:12px; color:var(--muted); margin-bottom:6px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { padding:2px 10px; border-radius:8px; background:var(--sunken); font-size:13px; }
.toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
.empty { padding:26px 16px; text-align:center; color:var(--muted); }

.feed td { font-size:13px; padding-block:7px; }
.feed-scroll { max-height:68vh; overflow:auto; }

dialog { width:min(760px, calc(100vw - 24px)); max-height:calc(100dvh - 24px); padding:0; border:1px solid var(--line); border-radius:16px; background:var(--surface); color:var(--ink); box-shadow:0 20px 60px #00000040; }
dialog.small { width:min(420px, calc(100vw - 24px)); }
dialog::backdrop { background:#0000006b; backdrop-filter:blur(2px); }
.dialog-head { position:sticky; top:0; z-index:1; display:flex; align-items:flex-start; gap:10px; padding:14px 16px; background:var(--surface); border-bottom:1px solid var(--line); }
.dialog-head h2 { flex:1; min-width:0; font-size:16px; font-weight:600; overflow-wrap:anywhere; }
.dialog-body { padding:16px; display:grid; gap:12px; min-width:0; }
.actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.confirm { display:grid; gap:10px; padding:12px; border-radius:10px; background:var(--sunken); }
.round { border:1px solid var(--line); border-radius:12px; }
.round summary { padding:9px 12px; cursor:pointer; font-weight:500; }
.round-body { padding:0 12px 12px; display:grid; gap:9px; min-width:0; }
.finding { padding:9px 12px; border-radius:10px; background:var(--sunken); overflow-wrap:anywhere; }
.finding.blocker { background:color-mix(in srgb, var(--bad) 12%, transparent); }
.finding-head { font-size:12px; color:var(--muted); margin-bottom:2px; }
.log { font:12px/1.7 var(--mono); max-height:60vh; overflow:auto; overflow-wrap:anywhere; }
.toast { position:fixed; inset-inline:16px; bottom:16px; z-index:20; width:fit-content; max-width:calc(100vw - 32px); margin-inline:auto; padding:9px 16px; border-radius:10px; background:var(--ink); color:var(--bg); font-size:14px; }

.meadow { overflow:hidden; line-height:0; }
.meadow svg { display:block; width:100%; height:auto; }
.legend { display:flex; flex-wrap:wrap; gap:6px 14px; padding:10px 16px; line-height:1.5; font-size:13px; border-top:1px solid var(--line); }
.legend span { display:inline-flex; align-items:center; gap:6px; }
.legend i { width:10px; height:10px; border-radius:50%; background:var(--swatch); flex:none; }
.clickable { cursor:pointer; }
.sky-top { stop-color:var(--sky-top); } .sky-low { stop-color:var(--sky-low); }
.hill { fill:var(--grass); } .hill.far { fill:var(--grass-deep); opacity:.7; }
.soil { fill:var(--soil); opacity:.45; }
.patch-name { fill:var(--ink); font:600 15px var(--sans); text-anchor:middle; }
.flower-number { fill:var(--ink); font:600 13px var(--sans); text-anchor:middle; }
.meadow-note { fill:var(--ink); font:15px var(--sans); text-anchor:middle; }
.band { fill:var(--hive); stroke:var(--hive-dark); stroke-width:2; }
.door { fill:#3a2608; }
.asleep .band { filter:saturate(.55) brightness(.75); }
.zzz { fill:var(--ink); font:700 20px var(--sans); animation:rise 3.5s ease-in-out infinite; }
.zzz.two { animation-delay:1.2s; } .zzz.three { animation-delay:2.4s; }
@keyframes rise { 0% { opacity:0; transform:translateY(8px); } 30% { opacity:.9; } 100% { opacity:0; transform:translateY(-26px); } }
.sway { transform-box:fill-box; transform-origin:50% 100%; animation:sway 5s ease-in-out infinite; }
.sway.alt { animation-delay:-2.4s; }
@keyframes sway { 0%,100% { transform:rotate(-2.5deg); } 50% { transform:rotate(2.5deg); } }
.wing { fill:#fff; opacity:.75; stroke:#7c6238; stroke-width:.6; transform-box:fill-box; transform-origin:50% 100%; animation:flap .16s ease-in-out infinite alternate; }
.wing.low { transform-origin:50% 0; }
@keyframes flap { from { transform:scaleY(1); } to { transform:scaleY(.45); } }
.body { fill:#f5b301; stroke:#3a2608; stroke-width:1; } .stripe { fill:#3a2608; } .head { fill:#3a2608; }
.reviewer .body { fill:#9f7be0; } .scout .body { fill:#4fb6c9; } .splitter .body { fill:#62c48d; }
.lens { fill:#ffffff88; stroke:#3a2608; stroke-width:2; }
.halo { fill:none; stroke:#f5b301; stroke-width:4; transform-box:fill-box; transform-origin:center; animation:halo 1.8s ease-out infinite; }
@keyframes halo { from { opacity:.9; transform:scale(.6); } to { opacity:0; transform:scale(1.5); } }
.speech rect, .speech path { fill:#fffdf5; stroke:#3a2608; stroke-width:1.2; }
.speech text { fill:#3a2608; font:600 13px var(--sans); text-anchor:middle; unicode-bidi:plaintext; }
.speech.back rect, .speech.back path { fill:#fde2c4; stroke:#b4580f; }
.paused * { animation-play-state:paused !important; }
@media (prefers-reduced-motion: reduce) { .sway, .wing, .zzz, .halo { animation:none; } .btn, .meter i { transition:none; } }

@media (max-width: 980px) { .layout { grid-template-columns:minmax(0,1fr); } .stats { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width: 640px) {
  th, td { padding-inline:12px; }
  .hide-narrow { display:none; }
  .counts { margin-inline-start:0; width:100%; }
  .stat-value { font-size:21px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <span class="brand" data-t="brand"></span>
    <span id="pulse" class="pulse"><i></i><span id="state" dir="auto" data-t="loading"></span></span>
    <span class="spacer"></span>
    <button id="stop" class="btn danger" data-t="stop"></button>
    <button id="resume" class="btn primary" data-t="resume" hidden></button>
    <button id="lang" class="btn plain" lang="" data-t="other_language"></button>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="work" data-t="tab_work"></button>
    <button class="tab" role="tab" data-tab="meadow" data-t="queue"></button>
    <button class="tab" role="tab" data-tab="days" data-t="by_day"></button>
    <button class="tab" role="tab" data-tab="activity" data-t="live_stream"></button>
  </nav>
</header>
<main>
  <div id="asks" class="list" hidden></div>
  <div id="stats" class="stats"></div>
  <section data-panel="work" class="layout">
    <div class="list">
      <div class="tools"><input id="search" type="search" data-t-attr="placeholder aria-label" data-t="search"></div>
      <div id="projects" class="list"></div>
    </div>
    <div class="side">
      <div class="card pad"><h2 class="card-title" data-t="active_workers"></h2><div id="workers"></div></div>
      <div class="card pad" id="queenbox" hidden><h2 class="card-title" data-t="queen"></h2><div id="queen"></div></div>
    </div>
  </section>
  <section data-panel="meadow" class="card meadow" hidden><div id="scene"></div><div id="legend" class="legend"></div></section>
  <section data-panel="days" class="list" hidden>
    <div class="toolbar"><select id="day" data-t-attr="aria-label" data-t="day"></select><div id="daytotals" class="chips"></div></div>
    <div id="byday" class="card"></div>
  </section>
  <section data-panel="activity" class="card" hidden><div id="live" class="feed-scroll"></div></section>
</main>
<dialog id="modal"><div class="dialog-head"><h2 id="modaltitle"></h2><button class="btn plain small" data-close data-t-attr="aria-label" data-t="close">×</button></div><div id="modalbody" class="dialog-body"></div></dialog>
<dialog id="tokenbox" class="small"><form method="dialog" class="dialog-body" id="tokenform">
  <h2 data-t="control_token"></h2><p class="muted" data-t="token_why"></p>
  <input id="token" type="password" autocomplete="off" data-t-attr="aria-label" data-t="control_token">
  <div class="actions"><button class="btn primary" value="yes" data-t="continue"></button><button class="btn" value="no" data-t="cancel"></button></div>
</form></dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const $ = id => document.getElementById(id);
const esc = text => String(text ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const get = path => fetch("/api/v1" + path).then(r => r.ok ? r.json() : Promise.reject(r.status));
const LANGUAGE_KEY = "kandu-language", TAB_KEY = "kandu-tab", CLOSED_KEY = "kandu-closed-projects";
const TEXT = JSON.parse($("text").textContent);
const LIVE_LINES = 200;
const STILL = matchMedia("(prefers-reduced-motion: reduce)").matches;
// What needs the user comes first.
const COLUMN_ORDER = ["Needs info", "Needs split", "In review", "In progress", "waiting", "Ready", "Blocked", "Backlog"];
let lang = "en", tab = "work", shownRun = null, shownTask = null, confirming = false, live = [], token = "";
let lastState = null, lastQueue = null, sceneKey = null, listKey = null, briefOpen = false, closed = new Set();
const saved = key => { try { return localStorage.getItem(key); } catch { return null; } };
const save = (key, value) => { try { localStorage.setItem(key, value); } catch {} };
if (saved(LANGUAGE_KEY) === "fa") lang = "fa";
if (saved(TAB_KEY)) tab = saved(TAB_KEY);
try { closed = new Set(JSON.parse(saved(CLOSED_KEY)) || []); } catch {}

const locale = () => lang === "fa" ? "fa-IR" : "en-GB";
const t = key => TEXT[lang][key];
const num = value => value.toLocaleString(lang === "fa" ? "fa-IR" : "en-US");
const pct = value => lang === "fa" ? num(value) + "٪" : value + "%";
const faDigits = text => text.replace(/\d/g, d => num(Number(d)));
const short = value => new Intl.NumberFormat(locale(), {notation: "compact", maximumFractionDigits: 1}).format(value);
const when = iso => new Date(iso).toLocaleString(locale(), {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"});
const clock = iso => new Date(iso).toLocaleTimeString(locale(), {hour: "2-digit", minute: "2-digit"});
const dayName = day => new Date(day + "T12:00").toLocaleDateString(locale(), {year: "numeric", month: "long", day: "numeric"});
const bdi = text => `<bdi>${esc(text)}</bdi>`;
// Isolated, so `#` stays before its number inside right-to-left text.
const numberOf = task => `\u2066#${num(Number(task.split("#")[1]))}\u2069`;
const repoOf = task => task.split("#")[0].split("/").pop();
const badge = (column, label) => `<span class="badge" style="--c:${FLOWERS[column]?.swatch || "#a8a297"}">${esc(tr(label || column))}</span>`;

// What the API says stays in English; the page translates the values it knows.
function tr(value) {
  if (lang === "en" || !value) return value;
  const known = TEXT.values_fa[value];
  if (known) return known;
  for (const [pattern, replacement] of TEXT.patterns_fa) {
    const regex = new RegExp(pattern);
    if (regex.test(value)) return faDigits(value.replace(regex, replacement));
  }
  return value;
}

function applyLanguage() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
  document.title = t("brand");
  $("lang").lang = lang === "fa" ? "en" : "fa";
  for (const el of document.querySelectorAll("[data-t]")) {
    const attrs = el.dataset.tAttr;
    if (attrs) attrs.split(" ").forEach(attr => el.setAttribute(attr, t(el.dataset.t)));
    else el.textContent = t(el.dataset.t);
  }
  renderLegend();
}

function setLanguage(chosen) {
  lang = chosen;
  save(LANGUAGE_KEY, lang);
  listKey = null;
  applyLanguage();
  renderLive();
  if (shownRun) showRun(shownRun);
  if (shownTask) showReviews(shownTask);
  refresh();
}

function showTab(chosen) {
  tab = document.querySelector(`[data-panel="${chosen}"]`) ? chosen : "work";
  save(TAB_KEY, tab);
  for (const el of document.querySelectorAll("[data-tab]")) el.setAttribute("aria-selected", el.dataset.tab === tab);
  for (const el of document.querySelectorAll("[data-panel]")) el.hidden = el.dataset.panel !== tab;
  sceneKey = null;
  if (lastState) renderScene(lastState, lastQueue);
}

function toast(text) {
  $("toast").textContent = text;
  $("toast").hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { $("toast").hidden = true; }, 6000);
}

// The token stays in memory only, and is asked for when a control first needs it.
function askToken() {
  return new Promise(resolve => {
    const box = $("tokenbox");
    $("token").value = "";
    box.returnValue = "no";
    box.addEventListener("close", () => {
      if (box.returnValue === "yes") token = $("token").value;
      resolve(Boolean(box.returnValue === "yes" && token));
    }, {once: true});
    box.showModal();
  });
}

async function post(path) {
  if (!token && !await askToken()) return false;
  const r = await fetch("/api/v1" + path, {method: "POST", headers: {Authorization: "Bearer " + token}});
  if (r.status === 403) token = "";
  if (!r.ok) toast(r.status === 403 ? t("token_required") : (await r.json().catch(() => ({}))).error || t("request_failed"));
  refresh();
  return r.ok;
}

async function approve(button) {
  const [repo, number] = button.dataset.approve.split("#");
  await post(`/reviews/${repo}/${number}/approve?head=${encodeURIComponent(button.dataset.head)}`);
  confirming = false;
  showReviews(button.dataset.approve);
}

// The meadow. Everything on it comes from real state: a bee flies only while a real agent runs.

const FLOWERS = {
  "Backlog": {swatch: "#a8a297"},
  "Ready": {swatch: "#8fc46a"},
  "In progress": {swatch: "#5b9bf0", petal: "#5b9bf0"},
  "In review": {swatch: "#b394ea", petal: "#b394ea"},
  "Needs info": {swatch: "#f2a65a", petal: "#f2a65a"},
  "Needs split": {swatch: "#e0689a", petal: "#e0689a"},
  "Blocked": {swatch: "#d9604f"},
  "waiting": {swatch: "#a8a297"},
};
const PETALS = [0, 60, 120, 180, 240, 300];
const CELL_W = 72, CELL_H = 94;

function flower(column, index) {
  const sway = `sway${index % 2 ? " alt" : ""}`;
  if (column === "Blocked") {
    return `<g><path d="M0 34 Q2 10 -13 6" fill="none" stroke="#8a7f66" stroke-width="3"/>
      <circle cx="-15" cy="9" r="6" fill="#9a8f80"/><circle cx="-5" cy="33" r="3" fill="#9a8f80"/><circle cx="7" cy="34" r="3" fill="#9a8f80"/></g>`;
  }
  if (column === "Ready" || column === "waiting" || column === "Backlog") {
    const tip = column === "Ready" ? "#8fc46a" : "#c9c4b6";
    return `<g class="${sway}"><path d="M0 34 V2" stroke="#4f8a3a" stroke-width="3"/><ellipse cx="7" cy="20" rx="7" ry="3" fill="#6da84f"/>
      <ellipse cy="-5" rx="7" ry="11" fill="#6da84f"/><ellipse cy="-11" rx="4" ry="6" fill="${tip}"/></g>`;
  }
  const petals = PETALS.map(a => `<ellipse cy="-11" rx="6" ry="9" fill="${FLOWERS[column].petal}" transform="rotate(${a})"/>`).join("");
  const mark = column === "Needs info" || column === "Needs split" ? '<text y="5" text-anchor="middle" font-weight="700" font-size="14" fill="#3a2608">?</text>' : "";
  return `<g class="${sway}"><path d="M0 34 V4" stroke="#4f8a3a" stroke-width="3"/><ellipse cx="7" cy="22" rx="7" ry="3" fill="#6da84f"/>${petals}<circle r="7" fill="#f5b301"/>${mark}</g>`;
}

function bee(kind, size = 1) {
  return `<g class="${kind}" transform="scale(${size})">
    <ellipse class="wing" cx="-2" cy="-8" rx="6" ry="8"/><ellipse class="wing low" cx="-2" cy="8" rx="6" ry="8"/>
    <ellipse class="body" rx="12" ry="7"/><rect class="stripe" x="-6" y="-6.6" width="3.4" height="13.2"/><rect class="stripe" x="0" y="-7" width="3.4" height="14"/>
    <circle class="head" cx="11" r="4.5"/>${kind === "reviewer" ? '<path class="lens" d="M21 5 l6 7"/><circle class="lens" cx="18" cy="1" r="6"/>' : ""}</g>`;
}

// A small speech bubble that does not move with the bee, so it can be read.
function speech(x, y, text, back = false) {
  const width = text.length * 7.4 + 20;
  return `<g class="speech${back ? " back" : ""}" transform="translate(${x} ${y})"><rect x="${-width / 2}" y="-24" width="${width}" height="24" rx="8"/>
    <path d="M-6 0 l6 8 l6 -8z"/><text y="-7">${esc(text)}</text></g>`;
}

function isFix(phase) { return /^fix round/.test(phase || ""); }

function beeKind(phase) {
  if (/^review/.test(phase)) return "reviewer";
  if (phase === "sizing") return "splitter";
  return phase === "live check" ? "scout" : "worker";
}

function flight(worker, kind, spot, hive, index) {
  const label = `<title>${esc(worker.task)} · ${esc(tr(worker.phase))}</title>`;
  const run = worker.run_id ? ` class="clickable" data-run="${esc(worker.run_id)}"` : "";
  if (STILL) return `<g${run} transform="translate(${spot.x} ${spot.y - 26})">${label}${bee(kind)}</g>`;
  if (kind !== "worker") {
    const circle = `M${spot.x - 26} ${spot.y} a26 26 0 1 1 52 0 a26 26 0 1 1 -52 0`;
    return `<g${run}>${label}${bee(kind)}<animateMotion dur="${5 + index}s" repeatCount="indefinite" rotate="auto" path="${circle}"/></g>`;
  }
  const midY = Math.min(hive.y, spot.y) - 70;
  const midX = (hive.x + spot.x) / 2;
  const path = `M${hive.x} ${hive.y} Q${midX} ${midY} ${spot.x} ${spot.y - 18} Q${midX} ${midY + 150} ${hive.x} ${hive.y}`;
  return `<g${run}>${label}${bee(kind)}<animateMotion dur="${9 + index * 2}s" repeatCount="indefinite" rotate="auto" calcMode="linear"
    keyTimes="0;0.4;0.65;1" keyPoints="0;0.5;0.5;1" path="${path}"/></g>`;
}

function hive(x, y, asleep, queenRun) {
  const widths = [52, 88, 112, 124, 124];
  const bands = widths.map((w, i) => `<rect class="band" x="${-w / 2}" y="${-96 + i * 25}" width="${w}" height="27" rx="13"/>`).join("");
  const naps = asleep ? `<text class="zzz" x="56" y="-92">z</text><text class="zzz two" x="70" y="-108">z</text><text class="zzz three" x="84" y="-124">z</text>` : "";
  return `<g class="${asleep ? "asleep" : ""}" transform="translate(${x} ${y})"><title>${t("hive")}</title>${bands}<path class="door" d="M-16 29 a16 16 0 0 1 32 0z"/>
    <g${queenRun ? ` class="clickable" data-run="${esc(queenRun)}"` : ""} transform="translate(0 -44) rotate(-90)">${queenRun ? '<circle class="halo" r="38"/><circle class="halo" r="38" style="animation-delay:.9s"/>' : ""}${bee("queen", 1.5)}</g>
    <path d="M-10 -80 l5 8 5 -8 5 8 5 -8 v12 h-20z" fill="#f5b301" stroke="#3a2608"/>${naps}${queenRun ? speech(0, -112, t("queen_deciding")) : ""}</g>`;
}

function fields(state, queue) {
  const projects = Object.entries(queue?.projects || {}).map(([name, columns]) => ({name, tasks:
    Object.entries(columns).flatMap(([column, tasks]) => tasks.map(task => ({task: task.task, title: task.title, url: task.url, column})))}));
  const seen = new Set(projects.flatMap(p => p.tasks.map(item => item.task)));
  const strays = [...(state.workers || []).filter(w => !seen.has(w.task)).map(w => ({task: w.task, title: "", column: "In progress", project: w.project})),
                  ...(state.waiting_for_machine || []).filter(task => !seen.has(task)).map(task => ({task, title: "", column: "waiting"}))];
  for (const stray of strays) {
    let patch = projects.find(p => p.name === stray.project) || projects[0];
    if (!patch) projects.push(patch = {name: stray.project || "", tasks: []});
    patch.tasks.push(stray);
  }
  for (const task of state.waiting_for_machine || []) {
    const found = projects.flatMap(p => p.tasks).find(item => item.task === task);
    if (found) found.column = "waiting";
  }
  return projects;
}

function placePatches(projects, narrow) {
  const width = narrow ? 380 : 450, perRow = Math.floor(width / CELL_W);
  const columns = narrow ? [{x: 20, y: 290}] : [{x: 30, y: 150}, {x: 720, y: 150}];
  for (const patch of projects) {
    const rows = Math.max(1, Math.ceil(patch.tasks.length / perRow));
    const column = columns.reduce((a, b) => b.y < a.y ? b : a);
    patch.x = column.x; patch.y = column.y; patch.width = width; patch.height = rows * CELL_H + 44; patch.perRow = perRow;
    column.y += patch.height + 16;
  }
  return Math.max(...columns.map(c => c.y));
}

function renderScene(state, queue) {
  if (tab !== "meadow") return;
  const box = $("scene");
  const narrow = box.clientWidth < 760;
  const projects = fields(state, queue);
  const stopped = state.stop_requested;
  const asleep = stopped || state.supervisor !== "awake";
  const key = JSON.stringify([narrow, lang, stopped, asleep, projects, state.workers, state.queen_run]);
  if (key === sceneKey) return;
  sceneKey = key;
  const width = narrow ? 420 : 1200;
  const height = Math.max(placePatches(projects, narrow) + 34, narrow ? 300 : 420);
  const home = narrow ? {x: 210, y: 140} : {x: 600, y: Math.round(height * .5)};
  const spots = {};
  const patches = projects.map(patch => {
    const flowers = patch.tasks.map((item, i) => {
      const x = patch.x + (i % patch.perRow) * CELL_W + CELL_W / 2 + (patch.width - patch.perRow * CELL_W) / 2;
      const y = patch.y + Math.floor(i / patch.perRow) * CELL_H + 46;
      spots[item.task] = {x, y};
      const title = `${item.task} · ${item.title} · ${tr(item.column === "waiting" ? "waiting for machine" : item.column)}`;
      return `<g class="clickable" data-review="${esc(item.task)}" transform="translate(${x} ${y})"><title>${esc(title)}</title>${flower(item.column, i)}
        <text class="flower-number" y="52">${numberOf(item.task)}</text></g>`;
    }).join("");
    const middle = patch.x + patch.width / 2;
    return `<ellipse class="soil" cx="${middle}" cy="${patch.y + patch.height / 2 + 8}" rx="${patch.width / 2}" ry="${patch.height / 2}"/>
      <text class="patch-name" x="${middle}" y="${patch.y + patch.height - 8}">${esc(patch.name)}</text>${flowers}`;
  }).join("");
  const bees = (state.workers || []).map((worker, i) => spots[worker.task] ? flight(worker, beeKind(worker.phase), spots[worker.task], {x: home.x, y: home.y + 20}, i) : "").join("");
  // Neighbouring flowers take turns on two rows, so their labels do not cover each other.
  const talking = (state.workers || []).filter(worker => spots[worker.task] && worker.phase)
    .sort((a, b) => spots[a.task].x - spots[b.task].x);
  const talk = talking.map((worker, i) => {
    const spot = spots[worker.task];
    return speech(spot.x, spot.y - 38 - (i % 2) * 28, `${isFix(worker.phase) ? "↩ " : ""}${tr(worker.phase)}`, isFix(worker.phase));
  }).join("");
  const note = projects.some(p => p.tasks.length) ? "" : `<text class="meadow-note" x="${width / 2}" y="${height - 30}">${t("empty_meadow")}</text>`;
  box.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${t("hive")}" class="${stopped ? "paused" : ""}">
    <defs><linearGradient id="sky" x2="0" y2="1"><stop class="sky-top" offset="0"/><stop class="sky-low" offset="1"/></linearGradient></defs>
    <rect width="${width}" height="${height}" fill="url(#sky)"/>
    <path class="hill far" d="M0 90 Q${width * .3} 40 ${width * .6} 85 T${width} 70 V${height} H0z"/>
    <path class="hill" d="M0 125 Q${width * .4} 75 ${width} 120 V${height} H0z"/>
    ${hive(home.x, home.y, asleep, state.queen_run)}${patches}${bees}${talk}${note}</svg>`;
  if (stopped) box.firstElementChild.pauseAnimations();
}

function renderLegend() {
  const kinds = [["Backlog", "Backlog"], ["Ready", "Ready"], ["In progress", "In progress"], ["In review", "In review"], ["Needs info", "Needs info"], ["Needs split", "Needs split"], ["Blocked", "Blocked"], ["waiting", "waiting for machine"]];
  const bees = [["#d98a00", "bee_queen"], ["#f5b301", "bee_worker"], ["#9f7be0", "bee_reviewer"], ["#4fb6c9", "bee_scout"], ["#62c48d", "bee_splitter"], ["#fde2c4", "sent_back"]];
  $("legend").innerHTML = kinds.map(([kind, label]) => `<span style="--swatch:${FLOWERS[kind].swatch}"><i></i>${esc(tr(label))}</span>`).join("") +
    bees.map(([color, key]) => `<span style="--swatch:${color}"><i></i>${t(key)}</span>`).join("");
}

function meter(label, value, limit) {
  if (value === undefined || value === null) return `<div class="card stat"><div class="stat-label">${label}</div><div class="stat-value muted">—</div><small>${t("not_read_yet")}</small></div>`;
  const over = value >= limit ? " over" : "";
  return `<div class="card stat"><div class="stat-label">${label}</div><div class="stat-value${over}">${pct(value)}</div>
    <div class="meter${over}"><i style="width:${Math.min(value, 100)}%"></i><b style="inset-inline-start:${limit}%"></b></div><small>${t("limit")} ${pct(limit)}</small></div>`;
}

function renderStats(s) {
  const workers = s.workers || [];
  const bees = `<div class="card stat"><div class="stat-label">${t("active_workers")}</div><div class="stat-value">${num(workers.length)}</div></div>`;
  const wake = `<div class="card stat"><div class="stat-label">${t("next_wake")}</div><div class="stat-value stat-small">${s.next_wake ? esc(when(s.next_wake)) : "—"}</div></div>`;
  $("stats").innerHTML = meter(t("session"), s.usage?.session, s.limits.session) + meter(t("week"), s.usage?.week, s.limits.week) + bees + wake;
}

function renderBees(s) {
  const workers = s.workers || [];
  $("workers").innerHTML = workers.map(w => `<div class="bee-row"><div class="bee-who"><button class="textlink" data-review="${esc(w.task)}">${bdi(repoOf(w.task))} ${numberOf(w.task)}</button>
      <div>${esc(tr(w.phase))} · ${bdi(w.machine)} · ${esc(clock(w.started))}</div></div>
      ${w.run_id ? `<button class="btn small" data-run="${esc(w.run_id)}">${t("watch")}</button><button class="btn small danger" data-stop="${esc(w.run_id)}">${t("stop")}</button>` : ""}</div>`).join("")
    || `<div class="muted">${t("none")}</div>`;
}

function renderQueen(s) {
  $("queenbox").hidden = !s.queen;
  $("asks").hidden = !s.queen?.questions.length;
  if (!s.queen) return;
  const cost = [s.queen.tokens, s.queen.today, s.queen.limit].map(short).join(" / ");
  const long = s.queen.brief.length > 420;
  $("queen").innerHTML = `<div class="meta">${esc(when(s.queen.ts))} · ${t("queen_cost")}: ${esc(cost)}</div>
    <div dir="auto" class="brief${long && !briefOpen ? " clamp" : ""}">${esc(s.queen.brief)}</div>
    ${long ? `<button class="btn plain small" data-brief>${t(briefOpen ? "show_less" : "show_more")}</button>` : ""}`;
  $("asks").innerHTML = s.queen.questions.map(q => `<div class="ask"><div class="ask-text"><div class="ask-who">${t("queen_asks")} · ${bdi(repoOf(q.task))} ${numberOf(q.task)}</div><div dir="auto">${esc(q.question)}</div></div>
    <button class="btn small" data-review="${esc(q.task)}">${t("open")}</button></div>`).join("");
}

async function refreshState() {
  const s = await get("/state");
  lastState = s;
  if (!saved(LANGUAGE_KEY) && TEXT[s.language] && s.language !== lang) setLanguage(s.language);  // The browser's choice wins.
  const name = s.stop_requested ? "stopped" : (s.supervisor || "never ran");
  $("pulse").className = `pulse ${s.stop_requested ? "stopped" : s.supervisor === "awake" ? "awake" : ""}`;
  $("state").textContent = tr(name) + (s.last_reason ? " · " + tr(s.last_reason) : "");
  $("stop").hidden = s.stop_requested;
  $("resume").hidden = !s.stop_requested;
  renderStats(s);
  renderBees(s);
  renderQueen(s);
  renderScene(s, lastQueue);
  renderProjects();
  return s;
}

function matches(project, item, words) {
  const text = `${project} ${item.task} ${item.title} ${tr(item.column)}`.toLowerCase();
  return words.every(word => text.includes(word));
}

function projectCard(project, shown, total, searching) {
  const sorted = [...shown].sort((a, b) => COLUMN_ORDER.indexOf(a.column) - COLUMN_ORDER.indexOf(b.column));
  const counts = COLUMN_ORDER.map(column => [column, sorted.filter(item => item.column === column).length]).filter(([, count]) => count);
  const rows = sorted.map(item => {
    const label = item.column === "waiting" ? "waiting for machine" : item.column;
    return `<tr data-review="${esc(item.task)}"><td class="fit number">${numberOf(item.task)}</td><td dir="auto"><button class="textlink">${esc(item.title || item.task)}</button></td>
      <td class="fit">${badge(item.column, label)}</td></tr>`;
  }).join("");
  const table = rows ? `<table class="rows"><thead><tr><th class="fit">${t("number")}</th><th>${t("title")}</th><th class="fit">${t("status")}</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">${t("empty")}</div>`;
  const open = searching || !closed.has(project.name);
  const paused = lastState.paused_projects.includes(project.name);
  const inConfig = lastState.paused_in_config.includes(project.name);  // Only a change of config resumes this one.
  const pause = `${paused ? `<span class="badge" style="--c:#d9604f">${t("project_on_pause")}</span>` : ""}${inConfig ? "" : `<button class="btn small project-pause" data-pause="${esc(project.name)}" data-paused="${paused}">${t(paused ? "resume_project" : "pause_project")}</button>`}`;
  return `<details class="card project" data-project="${esc(project.name)}"${open ? " open" : ""}><summary><span class="project-name">${bdi(project.name)}</span><span class="number">${num(total)}</span>
    <span class="counts">${counts.map(([column, count]) => `<span class="badge" style="--c:${FLOWERS[column].swatch}" title="${esc(tr(column === "waiting" ? "waiting for machine" : column))}">${num(count)}</span>`).join("")}</span>${pause}</summary>${table}</details>`;
}

function renderProjects() {
  if (!lastState) return;
  const words = $("search").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const projects = fields(lastState, lastQueue);
  const key = JSON.stringify([lang, words, projects, lastState.paused_projects]);
  if (key === listKey) return;
  listKey = key;
  const cards = projects.map(project => ({project, total: project.tasks.length, shown: project.tasks.filter(item => matches(project.name, item, words))}))
    .filter(card => card.shown.length || !words.length)
    .sort((a, b) => Boolean(b.shown.length) - Boolean(a.shown.length));
  $("projects").innerHTML = cards.map(card => projectCard(card.project, card.shown, card.total, words.length)).join("")
    || `<div class="card empty">${t(words.length ? "no_match" : "empty_meadow")}</div>`;
}

async function refreshQueue(state) {
  try {
    lastQueue = await get("/queue");
    renderProjects();
    renderScene(state, lastQueue);
  } catch { toast(t("github_unreadable")); }
}

async function refreshDays() {
  const {days} = await get("/days");
  const select = $("day"), chosen = select.value;
  select.innerHTML = days.slice().reverse().map(d => `<option value="${esc(d)}">${esc(dayName(d))}</option>`).join("");
  if (days.includes(chosen)) select.value = chosen;
  if (!days.length) { $("byday").innerHTML = `<div class="empty">${t("no_activity")}</div>`; return; }
  const day = await get("/days/" + select.value);
  const finished = Object.fromEntries(day.finished.map(f => [f.task, f.outcome]));
  const spent = Object.entries(day.tasks).sort(([, a], [, b]) => b.total - a.total);
  const most = Math.max(1, ...spent.map(([, used]) => used.total));
  const rows = spent.map(([task, used]) => `<tr data-review="${esc(task)}"><td class="fit number">${numberOf(task)}</td><td>${bdi(repoOf(task))}</td>
    <td class="fit hide-narrow">${finished[task] ? esc(tr(finished[task])) : "—"}</td>
    <td class="fit end" title="${esc(num(used.total))}">${esc(short(used.total))}<span class="tokenbar" style="width:${(100 * used.total / most).toFixed(1)}%"></span></td></tr>`).join("");
  $("byday").innerHTML = rows ? `<table class="rows"><thead><tr><th class="fit">${t("number")}</th><th>${t("project")}</th><th class="fit hide-narrow">${t("outcome")}</th><th class="fit end">${t("tokens")}</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">${t("no_activity")}</div>`;
  const parts = obj => Object.entries(obj).map(([name, used]) => `<span class="chip">${bdi(tr(name))}: ${esc(short(used.total))}</span>`);
  $("daytotals").innerHTML = [`<span class="chip">${t("total")}: ${esc(short(day.total.total))}</span>`, ...parts(day.roles), ...parts(day.models)].join("");
}

function renderLive() {
  const rows = live.map(e => `<tr${e.task ? ` data-review="${esc(e.task)}"` : ""}><td class="fit number">${esc(clock(e.ts))}</td><td class="fit">${esc(tr(e.type))}</td>
    <td class="fit">${e.task ? numberOf(e.task) : ""}</td><td dir="auto">${esc([e.phase, e.decision, e.reason, e.outcome].filter(Boolean).map(tr).join(" · "))}</td></tr>`).join("");
  $("live").innerHTML = rows ? `<table class="rows feed"><tbody>${rows}</tbody></table>` : `<div class="empty">${t("nothing_yet")}</div>`;
}

async function loadLive() {
  const seen = [];
  for (let after = 0; ; ) {
    const page = await get(`/events?after=${after}`);
    seen.push(...page.events);
    if (!page.events.length || page.next === after) break;
    after = page.next;
  }
  live = [...seen.reverse(), ...live].slice(0, LIVE_LINES);
  renderLive();
}

function openModal(title) {
  $("modaltitle").innerHTML = title;
  if (!$("modal").open) $("modal").showModal();
}

async function showRun(runId) {
  shownRun = runId;
  shownTask = null;
  const {actions} = await get("/runs/" + encodeURIComponent(runId));
  if (shownRun !== runId) return;
  openModal(`${t("run")} ${bdi(runId)}`);
  const box = $("modalbody").querySelector(".log");
  const atEnd = !box || box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  $("modalbody").innerHTML = `<div class="log" dir="ltr">${actions.map(a => `<div>${esc(a.tool)} <span class="muted">${esc(a.detail)}</span></div>`).join("") || `<div class="muted">${t("nothing_yet")}</div>`}</div>`;
  const log = $("modalbody").querySelector(".log");
  log.scrollTop = atEnd ? log.scrollHeight : (box?.scrollTop || 0);
}

function roundBox(round, open) {
  return `<details class="round"${open ? " open" : ""}><summary>${t("round")} ${num(round.round)}: ${esc(tr(round.recommendation))}</summary><div class="round-body">
    <div dir="auto">${esc(lang === "fa" && round.user_brief || round.brief)}</div>
    <div class="chips"><span class="chip">${esc(tr(round.door))}</span><span class="chip" dir="auto">${esc(round.blast_radius)}</span></div>
    ${(round.wait_for_user || []).map(q => `<div class="finding blocker" dir="auto">${esc(q)}</div>`).join("")}
    ${round.open.map(f => `<div class="finding${f.blocker ? " blocker" : ""}"><div class="finding-head">${t(f.blocker ? "blocker" : "note")} · <bdi class="mono">${esc(f.path)}</bdi></div><div dir="auto">${esc(f.body)}</div></div>`).join("")}
  </div></details>`;
}

function queued(task) {
  return Object.values(lastQueue?.projects || {}).flatMap(columns => Object.entries(columns).flatMap(([column, tasks]) => tasks.map(item => ({...item, column})))).find(item => item.task === task);
}

function approval(task, pr) {
  if (pr.approved) return `<p class="muted">${t("approved_waits")}</p>`;
  if (!pr.can_approve) return "";
  if (!confirming) return `<button class="btn primary" data-sure>${t("approve")}</button>`;
  return `<div class="confirm"><div>${t("approve_sure")}</div><div class="actions"><button class="btn primary" data-approve="${esc(task)}" data-head="${esc(pr.head_sha)}">${t("approve")}</button><button class="btn" data-unsure>${t("cancel")}</button></div></div>`;
}

function splitBox(task, proposal) {
  // The user's language, also one the page has no text for. The English is what reaches the issue.
  const own = lang === "en" && TEXT[lastState.language] ? null : proposal.user_text;
  const original = slice => own ? `<details><summary class="muted">${t("english_text")}</summary><div class="slice-body" dir="auto">${esc(slice.body)}</div></details>` : "";
  const slices = proposal.slices.map((slice, i) => `<details class="round"${i === 0 ? " open" : ""}><summary>${num(i + 1)}. <span dir="auto">${esc(own?.slices[i].title || slice.title)}</span></summary><div class="round-body">
    <div class="chips"><span class="chip">${esc(tr(slice.size))}</span><span class="chip">${num(slice.files)} ${t("files_touched")}</span><span class="chip">${esc(tr(slice.door))}</span></div>
    <div class="slice-body" dir="auto">${esc(own?.slices[i].body || slice.body)}</div>${original(slice)}
  </div></details>`).join("");
  const accept = confirming
    ? `<div class="confirm"><div>${t("approve_split_sure")}</div><div class="actions"><button class="btn primary" data-split="${esc(task)}" data-fingerprint="${esc(proposal.fingerprint)}">${t("approve_split")}</button><button class="btn" data-unsure>${t("cancel")}</button></div></div>`
    : `<button class="btn primary" data-sure>${t("approve_split")}</button>`;
  return `<div dir="auto">${esc(own?.reason || proposal.reason)}</div>${slices}<div class="actions">${accept}</div><p class="muted">${t("split_decline_hint")}</p>`;
}

async function approveSplit(button) {
  button.disabled = true;
  const task = button.dataset.split;
  const [repo, number] = task.split("#");
  const done = await post(`/splits/${repo}/${number}/approve?proposal=${encodeURIComponent(button.dataset.fingerprint)}`);
  confirming = false;
  if (done) toast(t("split_approved"));
  showReviews(task);
}

async function showReviews(task) {
  shownTask = task;
  shownRun = null;
  const [repo, number] = task.split("#");
  const item = queued(task);
  const [r, proposal] = await Promise.all([get(`/reviews/${repo}/${number}`),
    item?.column === "Needs split" ? get(`/splits/${repo}/${number}`).then(s => s.split) : null]);
  if (shownTask !== task) return;
  const link = (url, label) => `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${label} ↗</a>`;
  if (!r.pr) {
    openModal(`${numberOf(task)} ${bdi(item?.title || repoOf(task))}`);
    $("modalbody").innerHTML = `<div class="actions">${item ? badge(item.column) : ""}<span class="muted">${t("no_pr")}</span></div>${proposal ? splitBox(task, proposal) : ""}${item ? `<div class="actions">${link(item.url, t("open_github"))}</div>` : ""}`;
    return;
  }
  openModal(`${numberOf(task)} ${bdi(r.pr.title)}`);
  $("modalbody").innerHTML = `<div class="actions"><span class="chip">${esc(tr(r.pr.state))}</span>${item ? badge(item.column) : ""}</div>
    ${proposal ? splitBox(task, proposal) : ""}
    <div class="actions">${approval(task, r.pr)}${link(r.pr.url, t("open_github"))}</div>
    ${r.rounds.slice().reverse().map((round, i) => roundBox(round, i === 0)).join("")}`;
}

document.addEventListener("click", e => {
  const hit = name => e.target.closest(`[data-${name}]`);
  const yes = hit("approve"), run = hit("run"), stop = hit("stop"), tabButton = hit("tab"), pause = hit("pause"), acceptSplit = hit("split");
  if (hit("close")) { $("modal").close(); return; }
  if (hit("sure") || hit("unsure")) { confirming = Boolean(hit("sure")); showReviews(shownTask); return; }
  if (hit("brief")) { briefOpen = !briefOpen; renderQueen(lastState); return; }
  if (pause) {  // It sits in the project's summary, which would fold.
    e.preventDefault();
    post(`/projects/${encodeURIComponent(pause.dataset.pause)}/${pause.dataset.paused === "true" ? "resume" : "pause"}`);
    return;
  }
  if (yes) { approve(yes); return; }
  if (acceptSplit) { approveSplit(acceptSplit); return; }
  if (tabButton) { showTab(tabButton.dataset.tab); return; }
  if (stop) { post(`/workers/${encodeURIComponent(stop.dataset.stop)}/stop`); return; }
  if (run) { showRun(run.dataset.run); return; }
  const review = hit("review");
  if (review) { confirming = false; showReviews(review.dataset.review); }
  if (e.target === $("modal")) $("modal").close();
});
document.addEventListener("toggle", e => {
  const name = e.target.dataset?.project;
  if (name === undefined || $("search").value.trim()) return;
  if (e.target.open) closed.delete(name); else closed.add(name);
  save(CLOSED_KEY, JSON.stringify([...closed]));
}, true);
$("modal").addEventListener("close", () => { shownRun = shownTask = null; confirming = false; });
$("stop").onclick = () => post("/stop");
$("resume").onclick = () => post("/resume");
$("day").onchange = refreshDays;
$("search").oninput = renderProjects;
$("lang").onclick = () => setLanguage(lang === "fa" ? "en" : "fa");
addEventListener("resize", () => { if (lastState) renderScene(lastState, lastQueue); });

async function refresh() {
  try { const s = await refreshState(); await refreshQueue(s); await refreshDays(); }
  catch { toast(t("api_unreachable")); }
}
new EventSource("/api/v1/stream").onmessage = m => {
  live = [JSON.parse(m.data), ...live].slice(0, LIVE_LINES);
  renderLive();
  refreshState();
};
applyLanguage();
showTab(tab);
renderLive();
loadLive().catch(() => {});
refresh();
setInterval(refresh, 30000);
setInterval(() => { if (shownRun) showRun(shownRun).catch(() => {}); }, 5000);
</script>
</body>
</html>
