.menu-item:disabled { opacity:.6; cursor:default; }
.menu-item > span { flex:1; min-width:0; }
.menu-item small { font-size:12px; color:var(--muted); }
.menu-head { padding:8px 12px 4px; font-size:12px; font-weight:700; color:var(--muted); }
.menu-hint { margin:4px 12px 6px; font-size:12px; color:var(--muted); }
/* Wake the queen carries her crown, in honey. */
.crown { flex:none; width:18px; height:18px; fill:var(--honey); stroke:var(--hive-dark); stroke-width:1.4; stroke-linejoin:round; }
/* A task's sheet, the Kandu Clean look's: its colours named as there, from the Classic look's own. */
#sheet { --amber:#b4500a; --red:var(--bad); --green:var(--good); --blue:#2f62b0; --surface2:var(--sunken); --ink2:var(--muted); --ink3:var(--muted); --honey-ink:var(--on-honey); }
@media (prefers-color-scheme: dark) { #sheet { --amber:#f2a05c; --blue:#86a9ee; } }
#sheet .sheet-foot .actions > .btn, #sheet .sheet-foot .flightbox > .btn { flex:1 1 auto; min-height:48px; border-radius:12px; font-size:15px; white-space:normal; }
.sheet-hex { flex:none; width:56px; height:64px; display:grid; place-items:center; font-size:16px; font-weight:800; clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); background:var(--honey); color:var(--honey-ink); }
.sheet-hex.amber { background:var(--amber); color:var(--surface); } .sheet-hex.red { background:var(--red); color:var(--surface); }
.phases { display:grid; grid-template-columns:repeat(var(--n), minmax(0, 1fr)); gap:2px; }
.phase { display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; }
.phase .hex { width:30px; height:34px; background:var(--line); }
.phase span { font-size:11px; line-height:1.2; text-align:center; font-weight:600; color:var(--ink3); overflow-wrap:anywhere; }
.phase.done .hex { background:var(--honey); } .phase.done span { color:var(--ink); }
.phase.now .hex { background:var(--amber); } .phase.now span { color:var(--amber); font-weight:700; }
.sheet-state { display:flex; align-items:center; flex-wrap:wrap; gap:6px 16px; font-size:13px; color:var(--ink2); }
.sheet-state .textlink { text-decoration:underline; text-underline-offset:3px; }
.sheet-what { font-size:14px; color:var(--ink2); }
.sheet-box { padding:14px 16px; border-radius:14px; background:var(--surface); border:1px solid var(--line); display:flex; flex-direction:column; gap:8px; min-width:0; }
.sheet-box-head { font-size:12px; font-weight:700; color:var(--ink2); }
.sheet-question { font-size:15px; font-weight:600; overflow-wrap:anywhere; }
.sheet-section { display:flex; flex-direction:column; gap:10px; }
.steps { display:flex; flex-direction:column; }
.step { display:flex; gap:14px; }
.step > .hex { width:16px; height:18px; margin-top:3px; background:var(--honey); }
.step.last > .hex { background:var(--amber); }
.step > div { flex:1; min-width:0; padding-bottom:14px; }
.step-head { display:flex; align-items:baseline; gap:8px; }
.step-head b { flex:1; min-width:0; font-size:14px; overflow-wrap:anywhere; }
.step-head time { flex:none; font-size:12px; color:var(--ink3); }
.step-text { font-size:13px; color:var(--ink2); overflow-wrap:anywhere; }
.sheet-foot .flightbox { flex:1 1 auto; }
.tone-amber { color:var(--amber); } .tone-red { color:var(--red); } .tone-green { color:var(--green); } .tone-blue { color:var(--blue); } .tone-muted { color:var(--ink3); } .tone-ink { color:var(--ink); }
.hex { flex:none; width:9px; height:10px; clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); }
.spacer { flex:1; }
/* A project's settings: a pop-up over the page, centred on a wide screen and from the bottom on a phone. Nothing
   changes until Save. */
dialog.sheet { width:min(600px, calc(100vw - 24px)); max-height:calc(100dvh - 80px); background:var(--bg); overflow:hidden; }
dialog.sheet[open] { display:flex; flex-direction:column; }
.sheet-body { flex:1; min-height:0; overflow:auto; padding:16px 20px 20px; display:flex; flex-direction:column; gap:14px; }
.sheet-grip { display:none; align-self:center; width:40px; height:5px; border-radius:3px; background:var(--line); }
.sheet-head { display:flex; align-items:center; gap:14px; }
.sheet-who { flex:1; min-width:0; }
.sheet-who .muted { font-size:14px; overflow-wrap:anywhere; }
.sheet-who h2 { margin:0; font-size:21px; font-weight:700; line-height:1.25; overflow-wrap:anywhere; }
.sheet-close { all:unset; box-sizing:border-box; cursor:pointer; flex:none; align-self:flex-start; width:44px; height:44px; display:grid; place-items:center; border-radius:50%; background:var(--sunken); font-size:15px; font-weight:700; }
.sheet-close:focus-visible, .flip:focus-visible, .seg button:focus-visible { outline:2px solid var(--honey); outline-offset:2px; }
.sheet-foot { flex:none; padding:14px 20px calc(18px + env(safe-area-inset-bottom)); background:var(--surface); border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
.sheet-note { font-size:13px; font-weight:600; overflow-wrap:anywhere; }
#setfoot .sheet-note { color:var(--accent); }
.sheet-foot .actions > .btn { flex:1 1 auto; min-height:48px; border-radius:12px; font-size:15px; white-space:normal; }
.set-group { display:flex; flex-direction:column; }
.set-group h3 { margin:0; font-size:12px; font-weight:700; color:var(--muted); padding-bottom:4px; }
.set-field { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:10px 0; border-top:1px solid var(--line); min-width:0; }
.set-field.stack { flex-direction:column; align-items:stretch; }
.set-field.stack .set-label { flex:none; }
.set-label { flex:1 1 180px; min-width:0; display:flex; flex-direction:column; gap:2px; font-size:14px; }
.set-label small { font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
.seg { display:grid; grid-template-columns:1fr 1fr; gap:2px; padding:3px; border-radius:12px; background:var(--sunken); }
.seg button { all:unset; box-sizing:border-box; cursor:pointer; min-height:38px; padding:0 8px; display:flex; align-items:center; justify-content:center; text-align:center; border-radius:9px; font-size:14px; }
.seg button[aria-pressed="true"] { background:var(--surface); font-weight:700; box-shadow:0 1px 3px #0000001f; }
.seg button:disabled { cursor:not-allowed; opacity:.6; }
.flip { flex:none; width:44px; height:26px; padding:3px; border:0; border-radius:13px; background:var(--line); display:flex; justify-content:flex-start; cursor:pointer; }
.flip i { width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 2px #0003; }
.flip[aria-checked="true"] { background:var(--honey); justify-content:flex-end; }
.set-refused { padding:10px 14px; border-radius:12px; background:color-mix(in srgb, #f2a65a 14%, var(--surface)); color:var(--accent); font-size:13px; overflow-wrap:anywhere; }
.set-refused ul { margin:4px 0 0; padding-inline-start:18px; }
.set-danger { margin-top:6px; padding:14px 16px; border-radius:14px; border:1px solid color-mix(in srgb, var(--bad) 45%, var(--line)); background:color-mix(in srgb, var(--bad) 8%, var(--surface)); display:flex; flex-direction:column; gap:8px; }
.set-danger h3 { margin:0; font-size:13px; font-weight:700; color:var(--bad); }
.set-danger p { margin:0; font-size:13px; overflow-wrap:anywhere; }
.name-field { width:100%; }
.model-row { display:flex; gap:8px; align-items:center; min-width:0; }
.model-row .name-field { flex:1; min-width:0; }
.patch-name.clickable:hover { text-decoration:underline; }
@media (max-width: 640px) {
  dialog.menu, [dir="rtl"] dialog.menu { width:100%; max-width:100%; margin:auto 0 0; border-radius:20px 20px 0 0; padding:8px 8px calc(14px + env(safe-area-inset-bottom)); }
  dialog.sheet { width:100%; max-width:100%; height:94dvh; max-height:94dvh; margin:auto 0 0; border-radius:22px 22px 0 0; border-bottom:0; }
  .sheet-grip { display:block; }
  #projectsettings th, #projectsettings .fit { white-space:normal; }
  th, td { padding-inline:12px; }
  .hide-narrow { display:none; }
  .counts { margin-inline-start:0; width:100%; }
  .stat-value { font-size:21px; }
}
.tg-ok { color:var(--good); }
.tg-bad { color:var(--bad); }
.tg-connect { display:flex; flex-direction:column; gap:6px; min-width:0; }
.tg-line { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; min-width:0; font-size:13px; }
.tg-line label { font-weight:600; }
.tg-line input { flex:1 1 12em; min-width:0; }
.tg-chats { display:flex; flex-wrap:wrap; gap:6px; }
.tg-note { font-size:12px; }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <span class="brand" data-t="brand"></span>

    <span id="pulse" class="pulse"><i></i><span id="state" dir="auto" data-t="loading"></span></span>

    <button id="wake" class="btn plain"><svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5l4.6 3.9L12 5l4.4 7.4L21 8.5 19.2 19H4.8z"/></svg><span data-t="wake_queen"></span></button>
    <button id="restart" class="btn plain" data-t="restart_kandu"></button>
    <span id="didbanbox" class="flightbox"></span>
    <span id="zanbourdarbox" class="flightbox"></span>
    <button id="calm" class="btn plain" aria-pressed="false" data-t="calm"></button>
    <button id="look" class="btn plain" aria-haspopup="dialog"><span data-t="look"></span> ▾</button>
    <button id="lang" class="btn plain" lang="" data-t="other_language"></button>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="meadow" data-t="queue"></button>
    <button class="tab" role="tab" data-tab="work" data-t="tab_work"></button>
    <button class="tab" role="tab" data-tab="bazras" data-t="tab_bazras"></button>
    <button class="tab" role="tab" data-tab="settings" data-t="tab_settings"></button>
    <button class="tab" role="tab" data-tab="days" data-t="by_day"></button>
    <button class="tab" role="tab" data-tab="activity" data-t="live_stream"></button>
  </nav>
</header>
<main>
  <section id="upgrade" class="upgrade" aria-live="polite" hidden>
    <div class="upgrade-head"><strong id="upgradetitle" dir="auto"></strong><button id="upgraderead" class="btn" data-t="upgrade_read"></button></div>
    <div id="upgradeentries"></div>
  </section>
  <section id="basemissing" class="upgrade" aria-live="polite" hidden>
    <div class="upgrade-head"><strong id="basemissingtitle" dir="auto"></strong></div>
  </section>
  <section id="mainred" class="upgrade" aria-live="polite" hidden>
    <div class="upgrade-head"><strong id="mainredtitle" dir="auto"></strong></div>
    <div id="mainredtests" class="upgrade-entry" dir="auto"></div>
  </section>
  <div id="machines" class="list" hidden></div>
  <div id="asks" class="list" hidden></div>
  <div id="stats" class="stats"></div>
  <section data-panel="work" class="layout">
    <div class="list">
      <div class="tools"><input id="search" type="search" dir="auto" data-t-attr="placeholder aria-label" data-t="search"></div>
      <div id="projects" class="list"></div>
    </div>
    <div class="side">
      <div class="card pad"><h2 class="card-title" data-t="active_workers"></h2><div id="workers"></div></div>
      <div class="card pad" id="queenbox" hidden><h2 class="card-title" data-t="queen"></h2><div id="queen"></div></div>
      <div class="card pad" id="requestsbox" hidden><h2 class="card-title" data-t="open_requests"></h2><div id="requests"></div></div>
    </div>
  </section>
  <section data-panel="meadow" class="card meadow" hidden><div id="scene"></div><div id="comb" class="comb"></div><div id="legend" class="legend"></div></section>
  <section data-panel="bazras" class="list" hidden><div id="bazrasreports" class="list"></div></section>
  <section data-panel="settings" class="list" hidden><div class="card pad muted" data-t="settings_about"></div><div class="card pad add-open"><p class="muted" data-t="add_why"></p><div class="actions"><button id="addopen" class="btn" data-t="add_project"></button></div></div><div id="pacesettings" class="card pad"></div><div id="runtmpsettings" class="card pad"></div><div id="cleanmerged" class="card pad"></div><div id="defaultlook" class="card pad"></div><div id="notifysettings" class="card pad"></div><div id="projectsettings" class="card"></div></section>
  <section data-panel="days" class="list" hidden>
    <div class="card pad usage"><div class="toolbar"><h2 class="card-title" data-t="usage_title"></h2>
      <div class="usage-range"><select id="usagerange" data-t-attr="aria-label" data-t="usage_title"><option value="today" data-t="range_today"></option><option value="week" data-t="range_week"></option><option value="last7" data-t="range_last7"></option><option value="month" data-t="range_month"></option><option value="custom" data-t="range_custom"></option></select>
      <span id="usagedates" hidden><input id="usagefrom" type="date" dir="ltr" data-t-attr="aria-label" data-t="usage_from"> – <input id="usageto" type="date" dir="ltr" data-t-attr="aria-label" data-t="usage_to"></span></div></div>
      <div id="usagetotals" class="chips"></div><div id="usage"></div></div>
    <div class="toolbar"><select id="day" data-t-attr="aria-label" data-t="day"></select><div id="daytotals" class="chips"></div></div>
    <div id="byday" class="card"></div>
    <div id="didbansessions" class="card"></div>
    <div id="freeflights" class="card"></div>
  </section>
  <section data-panel="activity" class="card" hidden><div id="live" class="feed-scroll"></div></section>
</main>
<dialog id="lookmenu" class="menu" data-t-attr="aria-label" data-t="look"><div class="menu-head" data-t="look"></div><div id="lookitems"></div><p class="menu-hint" data-t="look_hint"></p></dialog>
<dialog id="modal"><div class="dialog-head"><h2 id="modaltitle"></h2><button class="btn plain small" data-close data-t-attr="aria-label" data-t="close">×</button></div><div id="modalbody" class="dialog-body"></div></dialog>
<dialog id="sheet" class="sheet" data-t-attr="aria-label" data-t="task_sheet"><div id="sheetbody" class="sheet-body"></div><div id="sheetfoot" class="sheet-foot"></div></dialog>
<dialog id="setsheet" class="sheet" data-t-attr="aria-label" data-t="tab_settings"><div id="setbody" class="sheet-body"></div><div id="setfoot" class="sheet-foot"></div></dialog>
<dialog id="releasebox" class="small"><form method="dialog" class="dialog-body">
  <h2 id="releasehead"></h2><p id="releasewhy" class="muted" data-t="release_why"></p><pre id="releasetext" class="log" dir="ltr"></pre>
  <div class="actions confirm-actions"><button class="btn" value="no" data-t="close"></button><button type="button" id="releasenow" class="btn primary" data-t="release_open"></button></div>
</form></dialog>
<dialog id="tokenbox" class="small"><form method="dialog" class="dialog-body" id="tokenform">

<dialog id="parallelbox" class="small"><form method="dialog" class="dialog-body">

  <div class="actions"><button class="btn primary" value="yes" data-t="save"></button><button class="btn" value="no" formnovalidate data-t="cancel"></button></div>
</form></dialog>

  <div class="actions"><button class="btn primary" value="yes" data-t="save"></button><button class="btn" value="no" formnovalidate data-t="cancel"></button></div>

  <div class="actions"><button class="btn primary" value="yes" data-t="save"></button><button class="btn" value="no" formnovalidate data-t="cancel"></button></div>

    <div class="actions"><button type="button" class="btn primary" id="addbtn" data-t="add_it"></button></div>
  </div>
  <div id="addresult"></div>
</form></dialog>

<script>
const $ = id => document.getElementById(id);
const esc = text => String(text ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const get = path => fetch("/api/v1" + path).then(r => r.ok ? r.json() : Promise.reject(r.status));
const LANGUAGE_KEY = "kandu-language", TAB_KEY = "kandu-tab", CLOSED_KEY = "kandu-closed-projects";
const TEXT = JSON.parse($("text").textContent);
const LIVE_LINES = 200;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
// What needs the user comes first.
const COLUMN_ORDER = ["Stuck", "Your approval", "Needs info", "Needs split", "Approved", "In review", "In progress", "waiting", "Ready", "Blocked", "Backlog", "Technical debt", "Done"];
let flights = {open: [], flown: []};
const flightsWarned = new Set();
let lang = "en", tab = "meadow", shownRun = null, shownTask = null, confirming = false, sendingBack = false, live = [], token = "";
let lastState = null, lastQueue = null, sceneKey = null, listKey = null, briefOpen = false, closed = new Set();
const saved = key => { try { return localStorage.getItem(key); } catch { return null; } };
const save = (key, value) => { try { localStorage.setItem(key, value); } catch {} };
// Calm: this browser's choice to stop all motion and live updates, kept in its storage. Nothing flies then, as with
// reduced motion.
const CALM_KEY = "kandu-calm";
let calm = saved(CALM_KEY) === "on", stateReadAt = 0;
const still = () => REDUCED || calm;
if (saved(LANGUAGE_KEY) === "fa") lang = "fa";
if (saved(TAB_KEY)) tab = saved(TAB_KEY);
try { closed = new Set(JSON.parse(saved(CLOSED_KEY)) || []); } catch {}

const locale = () => lang === "fa" ? "fa-IR" : "en-GB";
const t = key => TEXT[lang][key];
const num = value => value.toLocaleString(lang === "fa" ? "fa-IR" : "en-US");
const pct = value => lang === "fa" ? num(value) + "٪" : value + "%";
const faDigits = text => text.replace(/\d/g, d => num(Number(d)));
const digits = text => lang === "fa" ? faDigits(String(text)) : String(text);
const short = value => new Intl.NumberFormat(locale(), {notation: "compact", maximumFractionDigits: 1}).format(value);
const when = iso => new Date(iso).toLocaleString(locale(), {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"});
const clock = iso => new Date(iso).toLocaleTimeString(locale(), {hour: "2-digit", minute: "2-digit"});
// While GitHub refuses Kandu for a rate limit, the header says so and when Kandu calls it again.
const githubRefused = s => s?.github_refused ? t("github_refused").replace("{at}", clock(s.github_refused.at)) : "";
const dayName = day => new Date(day + "T12:00").toLocaleDateString(locale(), {year: "numeric", month: "long", day: "numeric"});
const bdi = text => `<bdi>${esc(text)}</bdi>`;
// Isolated, so `#` stays before its number inside right-to-left text.
const numberOf = task => `\u2066#${num(Number(task.split("#")[1]))}\u2069`;
const repoOf = task => task.split("#")[0].split("/").pop();
const badge = (column, label) => `<span class="badge" style="--c:${FLOWERS[column]?.swatch || "#a8a297"}">${esc(tr(label || column))}</span>`;
// An open by-hand task waits for the user, never for the queen, whatever its column.
const stateText = item => item.yours ? t("by_hand_yours") : tr(item.column === "waiting" ? "waiting for machine" : item.column);
const stateBadge = item => item.yours ? `<span class="badge" style="--c:#e8590c">${esc(t("by_hand_yours"))}</span>` : badge(item.column, item.column === "waiting" ? "waiting for machine" : item.column);

// What the API says stays in English; the page translates the values it knows.
function tr(value) {
  if (lang === "en" || !value) return value;
  const known = TEXT.values_fa[value];
  if (known) return known;
  for (const [pattern, replacement] of TEXT.patterns_fa) {
    const regex = new RegExp(pattern);
    if (regex.test(value)) return faDigits(value.replace(regex, replacement));
  }
  return value;
}

function applyLanguage() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
  document.title = t("brand");
  $("lang").lang = lang === "fa" ? "en" : "fa";
  $("calm").title = t("hint_calm");
  for (const el of document.querySelectorAll("[data-t]")) {
    const attrs = el.dataset.tAttr;
    if (attrs) attrs.split(" ").forEach(attr => el.setAttribute(attr, t(el.dataset.t)));
    else el.textContent = t(el.dataset.t);
  }
  $("look").title = t("look_hint");
  renderLegend();
}

// The look: each browser keeps the one it chose in a cookie, so the dashboard sends that look's page. The Look button
// beside the language switch opens the Look menu.
const LOOK_COOKIE = "kandu-look", LOOK_DAYS = 400;
function chooseLook(chosen) {
  document.cookie = `${LOOK_COOKIE}=${chosen}; path=/; max-age=${LOOK_DAYS * 86400}; samesite=strict`;
  location.reload();
}

function setLanguage(chosen) {
  lang = chosen;
  save(LANGUAGE_KEY, lang);
  listKey = null;
  applyLanguage();
  renderLive();
  if (shownRun) showRun(shownRun);
  if (shownTask) showTask(shownTask);
  refresh();
}

// The tabs' names in the Kandu Clean look, so a browser that saved one there opens the same page here.
const CLEAN_TABS = {today: "meadow", tasks: "work"};

function showTab(chosen) {
  chosen = CLEAN_TABS[chosen] || chosen;
  tab = document.querySelector(`[data-panel="${chosen}"]`) ? chosen : "meadow";
  save(TAB_KEY, tab);
  markView();
  for (const el of document.querySelectorAll("[data-tab]")) el.setAttribute("aria-selected", el.dataset.tab === tab);
  for (const el of document.querySelectorAll("[data-panel]")) el.hidden = el.dataset.panel !== tab;
  sceneKey = null;
  if (lastState) drawTab();
}

// A refresh draws only the tab on show, and a tab is drawn, with what it reads of its own, when it is opened.
function drawTab() {
  if (tab === "meadow") { renderScene(lastState, lastQueue); }
  if (tab === "work") { renderProjects(); renderBees(lastState); renderQueen(lastState); refreshRequests().catch(() => {}); }
  if (tab === "settings") renderSettings(lastState);
  refreshShown().catch(() => {});
}

function toast(text) {
  $("toast").textContent = text;
  $("toast").hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { $("toast").hidden = true; }, 6000);
}

// The token stays in memory only, and is asked for when a control first needs it.
function askToken() {
  return new Promise(resolve => {
    const box = $("tokenbox");
    $("token").value = "";
    box.returnValue = "no";
    box.addEventListener("close", () => {
      if (box.returnValue === "yes") token = $("token").value;
      resolve(Boolean(box.returnValue === "yes" && token));
    }, {once: true});
    box.showModal();
  });
}

async function post(path) {
  if (!token && !await askToken()) return false;
  const r = await fetch("/api/v1" + path, {method: "POST", headers: {Authorization: "Bearer " + token}});
  if (r.status === 403) token = "";
  post.failed = r.ok ? null : await r.json().catch(() => ({}));  // What went wrong, for a caller that offers a next step.
  if (!r.ok) toast(r.status === 403 ? t("token_required") : tr(post.failed.error) || t("request_failed"));
  refresh();
  return r.ok && await r.json().catch(() => ({}));  // The server's answer, always truthy, or false.
}

// A click always answers while the server works, in any button.
async function busy(button, work, text = t("working")) {
  const group = [...(button.closest(".actions")?.querySelectorAll("button") || [button])].filter(b => !b.disabled);
  const label = button.innerHTML, drawn = button instanceof SVGElement;  // The meadow's switch has no text to swap: it only fades.
  group.forEach(b => { b.disabled = true; });
  button.classList.add("busy");
  if (!drawn) button.textContent = text;
  try {
    return await work();
  } catch {
    toast(t("request_failed"));
    return false;
  } finally {
    group.forEach(b => { b.disabled = false; });
    button.classList.remove("busy");
    if (!drawn) button.innerHTML = label;
  }
}

// «Cut a release» (DESIGN §12): the action only reads the proposal, which `python -m kandu.release` prints with no
// yes and changes nothing. The dialog shows it and asks; only its confirm, the user's yes, opens the release PR, and
// only for the proposal shown. With no change since the last release it says so and offers no confirm.
async function showRelease() {
  const r = await fetch("/api/v1/release").catch(() => null);
  const p = r ? await r.json().catch(() => ({})) : {};
  if (!r?.ok) { toast(tr(p.error) || t("request_failed")); return; }
  drawRelease(p);
  if (!$("releasebox").open) $("releasebox").showModal();
}

function drawRelease(p) {
  $("releasehead").textContent = p.next ? t("release_ask").replace("{to}", p.next).replace("{from}", p.version) : t("release_none");
  $("releasewhy").hidden = !p.next;
  $("releasetext").textContent = p.text || "";
  $("releasenow").hidden = !p.next;
  $("releasenow").dataset.proposal = p.next ? p.proposal : "";
}

async function cutRelease(button) {
  const answer = await act(button, "/release?proposal=" + encodeURIComponent(button.dataset.proposal));
  if (answer) {
    $("releasehead").textContent = t("release_opened").replace("{v}", answer.version);
    $("releasewhy").hidden = true;
    $("releasetext").innerHTML = answer.url ? `<a href="${esc(answer.url)}" target="_blank" rel="noopener">${esc(answer.url)} ↗</a>` : "";
    $("releasenow").hidden = true;
  } else if (post.failed && "next" in post.failed) drawRelease(post.failed);  // it changed: the new proposal, to look at again
}

async function act(button, path, text) {
  if (!token && !await askToken()) return false;
  return busy(button, () => post(path), text);
}

async function doSendBack(button) {
  const task = button.dataset.back, [repo, number] = task.split("#");
  const done = await act(button, `/tasks/${repo}/${number}/send-back`);
  sendingBack = false;
  if (done) { toast(t("sent_back_done")); await refreshQueue(lastState, true).catch(() => {}); }
  showTask(task);
}

async function approve(button) {
  const [repo, number] = button.dataset.approve.split("#");
  await act(button, `/reviews/${repo}/${number}/approve?head=${encodeURIComponent(button.dataset.head)}`);
  confirming = false;
  showTask(button.dataset.approve);
}

  "Approved": {swatch: "#2f8a4e", petal: "#8fd19e", heart: "#2f8a4e"},
};
const ON_THE_WAY = ["Ready", "In progress", "In review"];  // A column that says more than this is left as it is.
const PETALS = [0, 60, 120, 180, 240, 300];
const RAYS = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330];
const CROWN = "M-7 -5 l3.5 4 3.5 -5 3.5 5 3.5 -4 v8 h-14z";

const HAND = '<path class="sign" style="fill:#f08c4a;stroke-width:1.2" transform="translate(0 -6)" d="M-4 4 V-2 a1 1 0 0 1 2 0 V-5 a1 1 0 0 1 2 0 V-6 a1 1 0 0 1 2 0 V-5 a1 1 0 0 1 2 0 V0 l1.6 -1.6 a1 1 0 0 1 1.4 1.4 L2 4.5 Q1 6 -1 6 H-2 Q-4 6 -4 4z"/>';
const SCALES = {Small: .72, Medium: 1, Large: 1.4};
const CELL_W = 72, CELL_H = 124, COMB_ROW = 12;
const CHECK = '<path class="sign light" d="M-4.5 0 L-1 3.5 L5 -3.5"/>';
const SIGNS = {
  "Backlog": `<path class="sign" fill="#f5b301" transform="translate(0 -7) scale(.8)" d="${CROWN}"/>`,
  "Ready": '<path class="sign solid" d="M-3 -10 L4 -5.5 L-3 -1z"/>',

  "Needs info": '<text class="sign-text" y="5">?</text>',
  "Needs split": '<path class="sign" stroke-dasharray="2 2" d="M0 -6 V6"/><path class="sign" d="M-2.2 -2 L-5 0 L-2.2 2 M2.2 -2 L5 0 L2.2 2"/>',
  "Technical debt": '<path class="sign" style="stroke:#c9ae5a;stroke-width:1.8" d="M-21 -7 L-25 -13 M-7 -16 L-9 -24 M6 -19 L9 -27 M20 -9 L25 -14"/>',
  "Your approval": CHECK,
  "Approved": CHECK,
  "Stuck": '<text class="sign-text" x="-15" y="13.5" style="fill:#c43d2f;font-size:12px">!</text>',
};
// Each one sits in a small round mark under the flower.
const MARKS = {
  door: '<rect class="sign solid" x="-3.6" y="-1" width="7.2" height="5" rx="1"/><path class="sign" d="M-2.1 -1 V-2.2 a2.1 2.1 0 0 1 4.2 0 V-1"/>',
  back: '<path class="sign" d="M3.8 3.4 V.4 a2.2 2.2 0 0 0 -2.2 -2.2 H-3.6 M-1.6 -4 L-3.8 -1.8 L-1.6 .4"/>',
  slice: '<circle class="sign" cx="-1.9" r="2.5"/><circle class="sign" cx="1.9" r="2.5"/>',
  unsized: '<path class="sign" d="M-4.8 -1.8 h9.6 v3.6 h-9.6z M-2.4 -1.8 v1.6 M0 -1.8 v1.6 M2.4 -1.8 v1.6"/>',
  yours: '<text class="mark-text" y="3.4">!</text>',
};

function bloom(column, index, sign = SIGNS[column]) {
  const sway = `sway${index % 2 ? " alt" : ""}`;
  if (column === "Blocked" || column === "Stuck") {  // Stuck droops as Blocked does: neither moves on by itself.
    const mark = column === "Stuck" ? sign : '<path class="sign" style="stroke:#c43d2f;stroke-width:2.2" d="M-18 6 l6 6 M-12 6 l-6 6"/>';
    return `<g><path d="M0 34 Q2 10 -13 6" fill="none" stroke="#8a7f66" stroke-width="3"/>
      <circle cx="-15" cy="9" r="6" fill="#9a8f80"/>${mark}<circle cx="-5" cy="33" r="3" fill="#9a8f80"/><circle cx="7" cy="34" r="3" fill="#9a8f80"/></g>`;
  }
  if (column === "Technical debt") {  // Wild grass with dry tips: no flower, and nobody planted it.
    const blade = (x, tip, top, fill) => `<path d="M${x - 4} 34 Q${x + (tip - x) * .3} 12 ${tip} ${top} Q${x + (tip - x) * .75} 14 ${x + 4} 34z" fill="${fill}"/>`;
    return `<g class="${sway}">${blade(-8, -21, -7, "#5d6b34")}${blade(8, 20, -9, "#5d6b34")}${blade(-3, -7, -16, "#6f7f3d")}${blade(3, 6, -19, "#6f7f3d")}
      ${blade(-11, -24, 12, "#7f8c45")}${blade(11, 25, 11, "#7f8c45")}${blade(0, 1, 2, "#8b9650")}${sign}</g>`;
  }
  if (column === "Ready" || column === "waiting" || column === "Backlog") {
    const tip = column === "Ready" ? "#8fc46a" : "#c9c4b6";
    return `<g class="${sway}"><path d="M0 34 V2" stroke="#4f8a3a" stroke-width="3"/><ellipse cx="7" cy="20" rx="7" ry="3" fill="#6da84f"/>
      <ellipse cy="-5" rx="8" ry="12" fill="#6da84f"/><ellipse cy="-6" rx="6" ry="8" fill="${tip}"/>${sign}</g>`;
  }
  const {petal, heart} = FLOWERS[column];
  const stem = '<path d="M0 34 V4" stroke="#4f8a3a" stroke-width="3"/><ellipse cx="7" cy="22" rx="7" ry="3" fill="#6da84f"/>';
  if (heart) {
    const rays = RAYS.map(a => `<ellipse cy="-15" rx="4.2" ry="8" fill="${petal}" stroke="#3a260844" transform="rotate(${a})"/>`).join("");
    const ring = column === "Your approval" ? '<circle class="wait-ring" r="24"/>' : "";
    return `<g class="${sway}">${stem}${ring}${rays}<circle r="10" fill="${heart}"/>${sign}</g>`;
  }
  const petals = PETALS.map(a => `<ellipse cy="-11" rx="6" ry="9" fill="${petal}" transform="rotate(${a})"/>`).join("");
  return `<g class="${sway}">${stem}${petals}<circle r="8.5" fill="#f5b301"/>${sign}</g>`;
}

function markAt(x, drawing, kind = "") {
  return `<g transform="translate(${x} 34)"><circle class="mark ${kind}" r="7"/>${drawing}</g>`;
}

// The marks a task carries, from the local log, under its flower.
function marksOf(item) {
  const {size, door, sent_back: back, slice, questions, yours} = item.mark || {};
  return [door && door !== "two-way" ? {key: "door", drawing: MARKS.door} : null, back ? {key: "back", drawing: MARKS.back} : null,
          slice ? {key: "slice", drawing: MARKS.slice} : null,
          size || item.column === "Technical debt" || item.by_hand ? null : {key: "unsized", drawing: MARKS.unsized},
          questions ? {key: "questions", drawing: `<text class="mark-text" y="3.4">${num(questions)}</text>`, kind: "ask"} : null,
          yours ? {key: "yours", drawing: MARKS.yours, kind: "yours"} : null].filter(Boolean);
}

function flower(item, index) {
  const scale = SCALES[item.mark?.size] || 1;
  const marks = marksOf(item);
  const start = -(marks.length - 1) * 7.5;
  return `<g class="bloom" transform="translate(0 34) scale(${scale}) translate(0 -34)">${bloom(item.column, index, item.yours ? HAND : undefined)}</g>
    ${marks.map(({drawing, kind}, i) => markAt(start + i * 15, drawing, kind)).join("")}`;
}

// What shows on hover over a task.
function taskTitle(item) {
  return `${item.task} · ${item.title} · ${stateText(item)}${item.by_hand && !item.yours ? ` · ${t("by_hand")}` : ""}${heldLines(item.mark, item.blockers).map(line => ` · ${line}`).join("")}`;
}

const BEE_TOOLS = {
  reviewer: '<path class="lens" d="M21 5 l6 7"/><circle class="lens" cx="18" cy="1" r="6"/>',
  scout: '<path class="lens" d="M-12 0 H-24"/><path class="tool" d="M-24 0 v-11 l10 3.5 -10 3.5z"/>',
  splitter: '<rect class="tool" x="-13" y="-15" width="26" height="6" rx="1"/><path class="lens" style="stroke-width:1" d="M-8 -15 v3 M-3 -15 v3 M2 -15 v3 M7 -15 v3"/>',
  inspector: '<rect class="tool" x="15" y="-9" width="10" height="13" rx="1.5"/><path class="lens" style="stroke-width:1" d="M17.5 -5 h5 M17.5 -2 h5 M17.5 1 h3"/>',
};

function bee(kind, size = 1) {
  return `<g class="${kind}" transform="scale(${size})">
    <ellipse class="wing" cx="-2" cy="-8" rx="6" ry="8"/><ellipse class="wing low" cx="-2" cy="8" rx="6" ry="8"/>
    <ellipse class="body" rx="12" ry="7"/><rect class="stripe" x="-6" y="-6.6" width="3.4" height="13.2"/><rect class="stripe" x="0" y="-7" width="3.4" height="14"/>
    <circle class="head" cx="11" r="4.5"/>${BEE_TOOLS[kind] || ""}</g>`;
}

// A small speech bubble that does not move with the bee, so it can be read.
function speech(x, y, text, back = false) {
  const width = text.length * 7.4 + 20;
  return `<g class="speech${back ? " back" : ""}" transform="translate(${x} ${y})"><rect x="${-width / 2}" y="-24" width="${width}" height="24" rx="8"/>
    <path d="M-6 0 l6 8 l6 -8z"/><text y="-7">${esc(text)}</text></g>`;
}

function isFix(phase) { return /^fix round/.test(phase || ""); }

function beeKind(phase) {
  if (/^review/.test(phase)) return "reviewer";
  if (/^sizing/.test(phase)) return "splitter";
  return phase === "live check" ? "scout" : "worker";
}

function flight(worker, kind, spot, hive, index) {
  const label = `<title>${esc(worker.task)} · ${esc(tr(worker.phase))}</title>`;
  const run = worker.run_id ? ` class="clickable" data-run="${esc(worker.run_id)}"` : "";
  if (still()) return `<g${run} transform="translate(${spot.x} ${spot.y - 26})">${label}${bee(kind)}</g>`;
  if (kind !== "worker") {
    const circle = `M${spot.x - 26} ${spot.y} a26 26 0 1 1 52 0 a26 26 0 1 1 -52 0`;
    return `<g${run}>${label}<g class="flying">${bee(kind)}</g><animateMotion dur="${5 + index}s" repeatCount="indefinite" rotate="auto" path="${circle}"/></g>`;
  }
  const midY = Math.min(hive.y, spot.y) - 70;
  const midX = (hive.x + spot.x) / 2;
  const path = `M${hive.x} ${hive.y} Q${midX} ${midY} ${spot.x} ${spot.y - 18} Q${midX} ${midY + 150} ${hive.x} ${hive.y}`;
  return `<g${run}>${label}<g class="flying">${bee(kind)}</g><animateMotion dur="${9 + index * 2}s" repeatCount="indefinite" rotate="auto" calcMode="linear"
    keyTimes="0;0.4;0.65;1" keyPoints="0;0.5;0.5;1" path="${path}"/></g>`;
}

// Bazras looks at a whole project, so it circles the patch's name, not a flower.
function inspectorBee(looking, projects) {
  const patch = looking && projects.find(p => p.name === looking.project);
  if (!patch) return "";
  const x = patch.x + patch.width / 2, y = patch.y + patch.height - 30;
  const said = t(looking.judging ? "bazras_judging" : "bazras_looking");
  const run = looking.judging ? ` class="clickable" data-run="${esc(looking.run_id)}"` : "";
  const label = `<title>${esc(looking.project)} · ${esc(said)}</title>`;
  if (still()) return `<g${run} transform="translate(${x} ${y})">${label}${bee("inspector")}</g>${speech(x, y - 22, said)}`;
  const circle = `M${x - 60} ${y} a60 22 0 1 1 120 0 a60 22 0 1 1 -120 0`;
  return `<g${run}>${label}<g class="flying">${bee("inspector")}</g><animateMotion dur="7s" repeatCount="indefinite" rotate="auto" path="${circle}"/></g>${speech(x, y - 30, said)}`;
}

function hive(x, y, asleep, queenRun) {
  const widths = [52, 88, 112, 124, 124];
  const bands = widths.map((w, i) => `<rect class="band" x="${-w / 2}" y="${-96 + i * 25}" width="${w}" height="27" rx="13"/>`).join("");
  const naps = asleep ? `<text class="zzz" x="56" y="-92">z</text><text class="zzz two" x="70" y="-108">z</text><text class="zzz three" x="84" y="-124">z</text>` : "";
  return `<g class="${asleep ? "asleep" : ""}" transform="translate(${x} ${y})"><title>${t("hive")}</title>${bands}<path class="door" d="M-16 29 a16 16 0 0 1 32 0z"/>
    <g${queenRun ? ` class="clickable" data-run="${esc(queenRun)}"` : ""} transform="translate(0 -44) rotate(-90)">${queenRun ? '<circle class="halo" r="38"/><circle class="halo" r="38" style="animation-delay:.9s"/>' : ""}${queenRun ? `<g class="flying">${bee("queen", 1.5)}</g>` : bee("queen", 1.5)}</g>
    <path d="M-10 -80 l5 8 5 -8 5 8 5 -8 v12 h-20z" fill="#f5b301" stroke="#3a2608"/>${naps}${queenRun ? speech(0, -112, t("queen_deciding")) : ""}</g>`;
}

function fields(state, queue) {
  const projects = Object.entries(queue?.projects || {}).map(([name, columns]) => ({name, tasks:
    Object.entries(columns).flatMap(([column, tasks]) => tasks.map(task => ({task: task.task, title: task.title, url: task.url, by_hand: !!task.by_hand, yours: !!task.yours, blockers: task.blockers || [], column})))}));
  const seen = new Set(projects.flatMap(p => p.tasks.map(item => item.task)));
  const strays = [...(state.workers || []).filter(w => !seen.has(w.task)).map(w => ({task: w.task, title: "", column: "In progress", project: w.project})),
                  ...(state.waiting_for_machine || []).filter(task => !seen.has(task)).map(task => ({task, title: "", column: "waiting"}))];
  for (const stray of strays) {
    // A task never sits in another project's patch: one the queue does not know gets a patch of its own.
    const name = stray.project || repoOf(stray.task);
    let patch = projects.find(p => p.name === name);
    if (!patch) projects.push(patch = {name, tasks: []});
    patch.tasks.push(stray);
  }
  for (const task of state.waiting_for_machine || []) {
    const found = projects.flatMap(p => p.tasks).find(item => item.task === task);
    if (found) found.column = "waiting";
  }
  const working = new Set((state.workers || []).map(w => w.task));
  for (const patch of projects) {
    patch.paused = (state.paused_projects || []).includes(patch.name);
    patch.merge = mergeMode(state, patch.name);
    patch.over = overLimit(state, patch.name);
    for (const item of patch.tasks) {
      item.mark = state.flowers?.[item.task] || {};
      if (item.yours) item.mark = {...item.mark, yours: true};  // an open by-hand task is the user's to do
      // A merge held by an open blocker is nobody's to approve yet: it keeps its column and says what it waits for.
      const held = item.mark.pr === "held" || (item.blockers || []).length > 0;
      if (item.mark.pr && ON_THE_WAY.includes(item.column) && !held) item.column = item.mark.pr === "waits" ? "Your approval" : "Approved";
      // Kandu will not move it on by itself, and no agent runs on it: it is neither waiting nor working.
      if (item.mark.status?.state === "stuck" && !working.has(item.task) && [...ON_THE_WAY, "Approved"].includes(item.column)) item.column = "Stuck";
    }
  }
  return projects;
}

// A project at its daily token limit starts nothing new today. Its patch or cell turns red with an outline, which a
// pause never draws, and a paused project at its limit keeps both marks. The mark goes when the day or the limit changes.
const overLimit = (state, name) => state?.over_limit?.[name] || null;
const limitText = over => `\u2066${num(over.today)} / ${num(over.limit)}\u2069`;

function limitBadge(over) {
  if (!over) return "";
  return `<span class="badge limit" title="${esc(t("over_limit_hint"))}">${t("over_limit")} · ${limitText(over)}</span>`;
}

// Whether a project merges by itself, waits for the user, or is frozen; frozen wins over auto-merge.
function mergeMode(state, name) {
  const row = (state.project_settings || []).find(p => p.name === name);
  if (!row) return "";
  return row.frozen ? "frozen" : row.auto_merge ? "auto" : "waits";
}

// The mark beside a project's name; like the name, it opens the project's settings, where the mode is changed.
function mergeMark(patch) {
  if (!patch.merge) return "";
  return ` · <tspan class="merge-mark clickable" data-settings-open="${esc(patch.name)}"><title>${esc(t(`mode_${patch.merge}_hint`))}</title><tspan class="merge-dot ${patch.merge}">●</tspan>\u00a0${esc(t(`mode_${patch.merge}`))}</tspan>`;
}

// Patches keep the config's order, row by row, the first one where reading starts.
function placePatches(projects, narrow) {
  const width = narrow ? 380 : 450, perRow = Math.floor(width / CELL_W);
  const columns = narrow ? [{x: 20, y: 290}] : [{x: 30, y: 150}, {x: 720, y: 150}];
  if (lang === "fa") columns.reverse();
  projects.forEach((patch, i) => {
    const column = columns[i % columns.length];
    if (i % columns.length === 0) { const top = Math.max(...columns.map(c => c.y)); columns.forEach(c => { c.y = top; }); }
    const rows = Math.max(1, Math.ceil(patch.tasks.length / perRow));
    patch.x = column.x; patch.y = column.y; patch.width = width; patch.height = rows * CELL_H + 52; patch.perRow = perRow;
    column.y += patch.height + 16;
  });
  return Math.max(...columns.map(c => c.y));
}

// A Kanduban on the project: a small mark beside the patch's name, on the side the switch is not. It is filled while
// the project's Kanduban is open, and then it opens that one's link.
function kandubanMark(patch) {
  return `<g class="kanduban-mark clickable${kandubanOf(patch.name)?.status === "open" ? " open" : ""}" data-fly="kanduban:${esc(patch.name)}" data-kanduban-for="${esc(patch.name)}">
    <title>${esc(`${t("open_kanduban")}: ${t("kanduban_hint")}`)}</title><circle r="9"/><text y="4">K</text></g>`;
}

function kandubanOf(name) {
  return flights.open.find(f => f.kind === "kanduban" && f.project === name);
}

// The switch sits beside the patch's name; a project paused in the config has none, since only the config resumes it.
function patchSwitch(patch) {
  if (lastState.paused_in_config.includes(patch.name)) return "";
  return `<g class="switch clickable${patch.paused ? " off" : ""}" data-pause="${esc(patch.name)}" data-paused="${patch.paused}" data-for="${esc(patch.name)}">
    <title>${t(patch.paused ? "resume_project" : "pause_project")}</title><rect class="track" x="-18" y="-11" width="36" height="22" rx="11"/><circle class="knob" cx="8" r="8"/></g>`;
}

// A finished task leaves the field and fills a cell of the comb under it.
function renderComb(done, days) {
  const free = Math.max(COMB_ROW - done.length % COMB_ROW, 0) % COMB_ROW + (done.length ? 0 : COMB_ROW);
  const full = done.map(item => `<button class="cell full" data-review="${esc(item.task)}" title="${esc(item.title)}">${numberOf(item.task)}<small>${esc(item.project)}</small></button>`);
  const label = days ? t("done_in_hive").replace("{count}", num(done.length)).replace("{days}", num(days)) : "";
  $("comb").innerHTML = `<b>${t("hive")}${label ? ` · ${label}` : ""}</b><div class="cells">${full.join("")}${'<span class="cell"></span>'.repeat(free)}</div>`;
}

function renderScene(state, queue) {
  if (tab !== "meadow") return;
  const box = $("scene");
  const narrow = box.clientWidth < 760;
  const projects = fields(state, queue).sort((a, b) => rank(a.name) - rank(b.name));
  const stopped = state.stop_requested;
  const asleep = stopped || state.supervisor !== "awake";
  const looking = state.bazras?.running || null;
  const key = JSON.stringify([narrow, lang, stopped, asleep, !queue, projects, state.paused_in_config, state.workers, state.queen_run, looking]);
  if (key === sceneKey) return;
  sceneKey = key;
  const width = narrow ? 420 : 1200;
  const done = projects.flatMap(patch => patch.tasks.filter(item => item.column === "Done").map(item => ({...item, project: patch.name})));
  projects.forEach(patch => { patch.tasks = patch.tasks.filter(item => item.column !== "Done"); });
  const height = Math.max(placePatches(projects, narrow) + 34, narrow ? 300 : 420);
  const home = narrow ? {x: 210, y: 140} : {x: 600, y: Math.round(height * .5)};
  const spots = {};
  const patches = projects.map(patch => {
    const flowers = patch.tasks.map((item, i) => {
      const x = patch.x + (i % patch.perRow) * CELL_W + CELL_W / 2 + (patch.width - patch.perRow * CELL_W) / 2;
      const y = patch.y + Math.floor(i / patch.perRow) * CELL_H + 54;
      spots[item.task] = {x, y};
      return `<g class="clickable" data-review="${esc(item.task)}" transform="translate(${x} ${y})"><title>${esc(taskTitle(item))}</title>${flower(item, i)}
        <text class="flower-number" y="52">${numberOf(item.task)}</text></g>`;
    }).join("");
    const middle = patch.x + patch.width / 2;
    const limit = patch.over ? `<title>${esc(`${t("over_limit")} · ${limitText(patch.over)}`)}</title>` : "";
    return `<ellipse class="soil${patch.paused ? " off" : ""}${patch.over ? " over" : ""}" cx="${middle}" cy="${patch.y + patch.height / 2 + 8}" rx="${patch.width / 2}" ry="${patch.height / 2}">${limit}</ellipse>
      <g class="${patch.paused ? "patch-off" : ""}"><text class="patch-name clickable" data-name="${esc(patch.name)}" data-settings-open="${esc(patch.name)}" x="${middle}" y="${patch.y + patch.height - 8}">\u2066${esc(patch.name)}\u2069${patch.paused ? ` · <tspan class="patch-paused">${t("project_on_pause")}</tspan>` : ""}${mergeMark(patch)}</text>${flowers}</g>${patchSwitch(patch)}${kandubanMark(patch)}`;
  }).join("");
  const bees = (state.workers || []).map((worker, i) => spots[worker.task] ? flight(worker, beeKind(worker.phase), spots[worker.task], {x: home.x, y: home.y + 20}, i) : "").join("")
    + inspectorBee(looking, projects);
  // Neighbouring flowers take turns on two rows, so their labels do not cover each other.
  const talking = (state.workers || []).filter(worker => spots[worker.task] && worker.phase)
    .sort((a, b) => spots[a.task].x - spots[b.task].x);
  const talk = talking.map((worker, i) => {
    const spot = spots[worker.task];
    return speech(spot.x, spot.y - 46 - (i % 2) * 28, `${isFix(worker.phase) ? "↩ " : ""}${tr(worker.phase)}`, isFix(worker.phase));
  }).join("");
  const note = done.length || projects.some(p => p.tasks.length) ? "" : `<text class="meadow-note" x="${width / 2}" y="${height - 30}">${t(queue ? "empty_meadow" : "reading_board")}</text>`;
  box.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${t("hive")}" class="${stopped ? "paused" : ""}">
    <defs><linearGradient id="sky" x2="0" y2="1"><stop class="sky-top" offset="0"/><stop class="sky-low" offset="1"/></linearGradient></defs>
    <rect width="${width}" height="${height}" fill="url(#sky)"/>
    <path class="hill far" d="M0 90 Q${width * .3} 40 ${width * .6} 85 T${width} 70 V${height} H0z"/>
    <path class="hill" d="M0 125 Q${width * .4} 75 ${width} 120 V${height} H0z"/>
    ${hive(home.x, home.y, asleep, state.queen_run)}${patches}${bees}${talk}${note}</svg>`;
  for (const name of box.querySelectorAll(".patch-name")) {  // Only the drawn name knows how wide it is.
    const b = name.getBBox();
    const mark = [...box.querySelectorAll(".kanduban-mark")].find(g => g.dataset.kandubanFor === name.dataset.name);
    mark?.setAttribute("transform", `translate(${lang === "fa" ? b.x + b.width + 16 : b.x - 16} ${b.y + b.height / 2})`);
    const toggle = [...box.querySelectorAll(".switch")].find(g => g.dataset.for === name.dataset.name);
    if (!toggle) continue;
    toggle.setAttribute("transform", `translate(${lang === "fa" ? b.x - 28 : b.x + b.width + 28} ${b.y + b.height / 2})`);
  }
  if (stopped) box.firstElementChild.pauseAnimations();
  renderComb(done, queue?.done_days);
}

function renderLegend() {
  const entry = (drawing, label, box, height) => `<span><svg viewBox="${box}" style="height:${height}px" aria-hidden="true">${drawing}</svg>${esc(label)}</span>`;
  const group = (title, entries) => `<div class="legend-group"><b>${t(title)}</b>${entries.join("")}</div>`;
  const kinds = ["Stuck", "Your approval", "Approved", "Needs info", "Needs split", "In review", "In progress", "Ready", "waiting", "Blocked", "Backlog", "Technical debt"];
  const flowers = [...kinds.map(kind => entry(bloom(kind, 0), tr(kind === "waiting" ? "waiting for machine" : kind), "-28 -28 56 66", 46)),
                   entry(bloom("Backlog", 0, HAND), t("by_hand_yours"), "-28 -28 56 66", 46)];
  const sizes = Object.keys(SCALES).map(size => entry(flower({column: "In progress", mark: {size}}, 0), tr(size), "-34 -46 68 84", 58));
  const mark = (drawing, key, kind) => entry(markAt(0, drawing, kind), t(key), "-9 25 18 18", 20);
  const signs = [mark(MARKS.door, "mark_door"), mark(MARKS.back, "sent_back"), mark(MARKS.slice, "mark_slice"), mark(MARKS.unsized, "mark_unsized"),
                 mark(`<text class="mark-text" y="3.4">${num(3)}</text>`, "mark_questions", "ask"), mark(MARKS.yours, "waits_for_you", "yours")];
  const queen = `${bee("queen")}<path transform="translate(11 -9)" fill="#f5b301" stroke="#3a2608" d="${CROWN}"/>`;
  const bees = [[queen, "bee_queen"], [bee("worker"), "bee_worker"], [bee("reviewer"), "bee_reviewer"], [bee("scout"), "bee_scout"], [bee("splitter"), "bee_splitter"], [bee("inspector"), "bee_inspector"]]
    .map(([drawing, key]) => entry(drawing, t(key), "-28 -20 58 40", 30));
  const over = Object.keys(lastState?.over_limit || {}).length  // The legend explains the red only while it shows.
    ? group("legend_projects", [entry('<ellipse class="soil over" rx="21" ry="9"/>', t("legend_over_limit"), "-24 -12 48 24", 20)]) : "";
  $("legend").innerHTML = group("legend_flowers", flowers) + group("legend_sizes", sizes) + group("legend_marks", signs) + group("legend_bees", bees) + over;
}

function meter(label, value, limit) {
  const edit = `<button class="textlink limit-edit" data-limits>${t("change")}</button>`;
  if (value === undefined || value === null) return `<div class="card stat"><div class="stat-label">${label}</div><div class="stat-value muted">—</div><small>${t("limit")} ${pct(limit)}${edit}</small></div>`;
  const over = value >= limit ? " over" : "";
  return `<div class="card stat"><div class="stat-label">${label}</div><div class="stat-value${over}">${pct(value)}</div>
    <div class="meter${over}"><i style="width:${Math.min(value, 100)}%"></i><b style="inset-inline-start:${limit}%"></b></div><small>${t("limit")} ${pct(limit)}${edit}</small></div>`;
}

function changeLimits(button) {
  const box = $("limitsbox");
  $("limitsession").value = lastState.limits.session;
  $("limitweek").value = lastState.limits.week;
  box.returnValue = "no";
  box.addEventListener("close", () => {
    if (box.returnValue === "yes") act(button, `/limits?session=${$("limitsession").value}&week=${$("limitweek").value}`);
  }, {once: true});
  box.showModal();
}

function changeParallel(button) {
  const box = $("parallelbox"), parallel = lastState.parallel;
  $("paralleltotal").value = parallel.total;
  $("parallelprojects").innerHTML = Object.entries(parallel.projects).map(([name, most]) =>
    `<label class="limit-field"><span>${bdi(name)}</span><input type="number" min="1" required data-project="${esc(name)}" data-was="${most}" value="${most}"></label>`).join("");
  box.returnValue = "no";
  box.addEventListener("close", () => {
    if (box.returnValue !== "yes") return;
    const changed = [...$("parallelprojects").querySelectorAll("input")].filter(input => input.value !== input.dataset.was)
      .map(input => `&project=${encodeURIComponent(`${input.dataset.project}:${input.value}`)}`).join("");
    act(button, `/parallel?total=${encodeURIComponent($("paralleltotal").value)}${changed}`);
  }, {once: true});
  box.showModal();
}

// What the wake and debt tiles say.
const wakeText = s => !s.timer_on ? t("timer_off") : s.next_wake ? esc(when(s.next_wake)) : "—";
const debtCount = () => lastQueue && Object.values(lastQueue.projects).reduce((sum, columns) => sum + columns["Technical debt"].length, 0);

function renderStats(s) {
  const workers = s.workers || [];
  const most = s.parallel ? `<small>${t("limit")} ${num(s.parallel.total)}<button class="textlink limit-edit" data-parallel>${t("change")}</button></small>` : "";
  const bees = `<div class="card stat"><div class="stat-label">${t("active_workers")}</div><div class="stat-value">${num(workers.length)}</div>${most}</div>`;
  const yours = `<div class="card stat"><div class="stat-label">${t("waits_for_you_count")}</div><div class="stat-value" style="color:${s.waits_for_you ? "#e8590c" : "inherit"}">${num(s.waits_for_you || 0)}</div></div>`;
  const wake = `<div class="card stat"><div class="stat-label">${t("next_wake")}</div><div class="stat-value stat-small">${wakeText(s)}</div></div>`;
  const parked = debtCount();
  const debt = `<div class="card stat"><div class="stat-label">${t("debt")}</div><div class="stat-value${lastQueue ? "" : " muted"}">${lastQueue ? num(parked) : "—"}</div></div>`;
  $("stats").innerHTML = meter(t("session"), s.usage?.session, s.limits.session) + meter(t("week"), s.usage?.week, s.limits.week) + bees + yours + debt + wake + backupCard(s.backup) + upstreamCard(s.upstream) + dropCard(s.drop_blockers) + requestsCard(s.show_requests) + releaseCard(s.version);
}

// Kandu's version, and «Cut a release», which shows the proposal first.
function releaseCard(v) {
  return `<div class="card stat"><div class="stat-label">${t("release_version")}</div><div class="stat-value stat-small"><bdi dir="ltr">${esc(v || "—")}</bdi></div>
    <small><button class="textlink limit-edit" data-release>${t("release_cut")}</button></small></div>`;
}

// Whether open requests show with their decision maps: off until the user turns it on here.
function requestsCard(on) {
  if (on === undefined) return "";
  return `<div class="card stat"><div class="stat-label">${t("open_requests")}</div><div class="stat-value stat-small">${t(on ? "requests_shown" : "drop_off")}</div>
    <small><button class="textlink limit-edit" data-requests="${on ? "false" : "true"}">${t(on ? "drop_turn_off" : "drop_turn_on")}</button></small></div>`;
}

const MAP_MARKS = [["decided", "✅"], ["asked", "❓"], ["later", "⏳"], ["out", "✂️"]];
const openRequests = new Set();  // a re-render keeps the maps the user opened

async function refreshRequests() {
  const body = await get("/requests");
  $("requestsbox").hidden = !body.show_requests;
  if (body.show_requests) renderRequests(body.projects);
}

// Read-only: a map is changed in Didban, never here.
function renderRequests(projects) {
  const map = m => !m ? `<div class="empty">${t("no_map")}</div>`
    : `<ul class="map">${MAP_MARKS.flatMap(([name, mark]) => m[name].map(entry => `<li><span title="${esc(t("map_" + name))}">${mark}</span> <span dir="auto">${esc(entry)}</span></li>`)).join("")}</ul>`;
  const request = r => `<details data-request="${esc(r.id)}"${openRequests.has(r.id) ? " open" : ""}><summary dir="auto">${esc(r.text)}</summary>${map(r.map)}</details>`;
  $("requests").innerHTML = projects.length ? projects.map(p => `<h3>${p.project === null ? t("no_project_yet") : bdi(p.project)}</h3>${p.requests.map(request).join("")}`).join("")
    : `<div class="empty">${t("no_requests")}</div>`;
}

// Whether the queen may ask to drop a blocker: off until the user turns it on here.
function dropCard(on) {
  if (on === undefined) return "";
  return `<div class="card stat"><div class="stat-label">${t("drop_blockers")}</div><div class="stat-value stat-small">${t(on ? "drop_on" : "drop_off")}</div>
    <small><button class="textlink limit-edit" data-drops="${on ? "false" : "true"}">${t(on ? "drop_turn_off" : "drop_turn_on")}</button></small></div>`;
}

async function dropBlocker(button) {
  const [repo, number] = button.dataset.drop.split("#");
  if (await act(button, `/drop-blockers/${repo}/${number}?blocker=${encodeURIComponent(button.dataset.blocker)}`)) {
    toast(t("drop_done"));
    await refreshState().catch(() => {});
  }
}

// The daily backup: off until the user turns it on here. A failed last try shows, so it is never silent.
function backupCard(b) {
  if (!b) return "";
  const said = b.enabled ? t("backup_daily_at").replace("{at}", num(b.at)) : t("backup_off");
  const failed = b.last?.type === "backup_failed";
  const note = failed ? esc(t("backup_last_failed")) : b.copies.length ? esc(t("backup_copies").replace("{count}", num(b.copies.length))) : "";
  return `<div class="card stat"><div class="stat-label">${t("backup")}</div><div class="stat-value stat-small${failed ? " over" : ""}">${esc(said)}</div>
    <small>${note}<button class="textlink limit-edit" data-backup>${t("change")}</button></small></div>`;
}

// The install's main against the public Kandu: shown only while `upstream` is on. The check only counts; the
// button makes one task, and while it is open the card links to it instead.
function upstreamCard(u) {
  if (!u) return "";
  const counts = [u.behind ? t("upstream_behind").replace("{n}", num(u.behind)) : "", u.ahead ? t("upstream_ahead").replace("{n}", num(u.ahead)) : ""].filter(Boolean);
  const said = u.failed ? t("upstream_failed") : u.behind === null ? t("upstream_not_checked") : counts.join(" · ") || t("upstream_up_to_date");
  const note = u.failed ? (u.last_good_at ? t("upstream_last_good").replace("{at}", when(u.last_good_at)) : t("upstream_never_good")) : u.checked_at ? when(u.checked_at) : "";
  const task = u.task ? `<a class="textlink limit-edit" href="${esc(u.task.url)}" target="_blank" rel="noopener">${t("upstream_task_open")} ${numberOf(u.task.task)} ↗</a>`
    : !u.failed && u.behind ? `<button class="textlink limit-edit" data-upstream-bring>${t("upstream_bring_in")}</button>` : "";
  return `<div class="card stat"><div class="stat-label">${t("upstream")} · <bdi dir="ltr">${esc(u.remote)}/${esc(u.branch)}</bdi></div><div class="stat-value stat-small${u.failed ? " over" : ""}">${esc(said)}</div>
    <small>${esc(note)}<button class="textlink limit-edit" data-upstream-check>${t("upstream_check_now")}</button>${task}</small></div>`;
}

// A machine's run temporary folder: on, each run there gets its own folder inside it, removed when the run ends.
function runTmpCard(machines) {
  const rows = machines.map(m => `<div class="pace-row"><span>${bdi(m.name)}</span><span class="muted">${m.run_tmp ? `<bdi dir="ltr">${esc(m.run_tmp_dir)}</bdi>` : esc(t("run_tmp_off"))}</span><button class="btn small" data-run-tmp="${esc(m.name)}">${t("change")}</button></div>`);
  return `<h2 class="card-title" title="${esc(t("run_tmp_why"))}">${t("run_tmp")}</h2>${rows.join("")}`;
}

function changeRunTmp(button) {
  const name = button.dataset.runTmp, m = (lastState.machines || []).find(x => x.name === name);
  if (!m) return;
  const box = $("runtmpbox");
  $("runtmpmachine").textContent = name;
  $("runtmpon").checked = Boolean(m.run_tmp);
  $("runtmpfolder").value = m.run_tmp_dir || "";
  box.returnValue = "no";
  box.addEventListener("close", async () => {
    if (box.returnValue !== "yes") return;
    const on = $("runtmpon").checked, folder = $("runtmpfolder").value.trim();
    const query = new URLSearchParams({enabled: on, ...(folder ? {folder} : {})});
    if (await act(button, `/machines/${encodeURIComponent(name)}/run-tmp?${query}`)) {
      toast(t(on ? "run_tmp_saved_on" : "run_tmp_saved_off").replace("{machine}", name).replace("{folder}", folder));
      refreshState().catch(() => {});
    }
  }, {once: true});
  box.showModal();
}

function changeBackup(button) {
  const box = $("backupbox"), b = lastState.backup;
  $("backupon").checked = b.enabled;
  $("backupat").value = b.at;
  $("backupdestination").value = b.destination;
  $("backupkeep").value = b.keep;
  box.returnValue = "no";
  box.addEventListener("close", async () => {
    if (box.returnValue !== "yes") return;
    const on = $("backupon").checked, at = $("backupat").value;
    const query = `enabled=${on}&at=${encodeURIComponent(at)}&destination=${encodeURIComponent($("backupdestination").value)}&keep=${encodeURIComponent($("backupkeep").value)}`;
    if (await act(button, `/backup?${query}`)) toast(t(on ? "backup_saved_on" : "backup_saved_off").replace("{at}", num(at)));
  }, {once: true});
  box.showModal();
}

function renderBees(s) {
  if (tab !== "work") return;
  const workers = s.workers || [];
  $("workers").innerHTML = workers.map(w => `<div class="bee-row"><div class="bee-who"><button class="textlink" data-review="${esc(w.task)}">${bdi(repoOf(w.task))} ${numberOf(w.task)}</button>
      <div>${esc(tr(w.phase))} · ${bdi(w.machine)} · ${esc(clock(w.started))}</div></div>
      ${w.run_id ? `<button class="btn small" data-run="${esc(w.run_id)}">${t("watch")}</button><button class="btn small danger" data-stop="${esc(w.run_id)}">${t("stop")}</button>` : ""}</div>`).join("")
    || `<div class="muted">${t("none")}</div>`;
}

function renderQueen(s) {
  $("queenbox").hidden = !s.queen;
  $("asks").hidden = !s.queen?.questions.length && !s.queen?.drops?.length;
  if (!s.queen) return;
  const cost = [s.queen.tokens, s.queen.today, s.queen.limit].map(short).join(" / ");
  const long = s.queen.brief.length > 420;
  if (tab === "work") $("queen").innerHTML = `<div class="meta">${esc(when(s.queen.ts))} · ${t("queen_cost")}: ${esc(cost)}</div>
    <div dir="auto" class="brief${long && !briefOpen ? " clamp" : ""}">${esc(s.queen.brief)}</div>
    ${long ? `<button class="btn plain small" data-brief>${t(briefOpen ? "show_less" : "show_more")}</button>` : ""}`;
  $("asks").innerHTML = s.queen.questions.map(q => `<div class="ask"><div class="ask-text"><div class="ask-who">${t("queen_asks")} · ${bdi(repoOf(q.task))} ${numberOf(q.task)}</div><div dir="auto">${esc(q.question)}</div></div>
    <button class="btn small" data-review="${esc(q.task)}">${t("open")}</button></div>`).join("")
    + (s.queen.drops || []).map(d => `<div class="ask"><div class="ask-text"><div class="ask-who">${t("queen_asks")} · ${bdi(repoOf(d.task))} ${numberOf(d.task)}</div>
    <div>${esc(t("drop_ask").replace("{blocker}", d.blocker))}</div><div dir="auto">${esc(d.reason)}</div></div>
    <button class="btn small primary" data-drop="${esc(d.task)}" data-blocker="${esc(d.blocker)}">${t("drop_yes")}</button>
    <button class="btn small" data-review="${esc(d.task)}">${t("open")}</button></div>`).join("");
}

// Each machine that does not answer: since when, and the tasks that wait for it, to be sized or worked.
function unreachableMachines(s) {
  return (s.unreachable_machines || []).map(m => {
    const tasks = m.tasks.map(task => `${bdi(repoOf(task))} ${numberOf(task)}`).join(", ");
    return `<div class="ask"><div class="ask-text"><div class="ask-who" dir="auto">${t("machine_off").replace("{machine}", bdi(m.machine)).replace("{since}", esc(when(m.since)))}</div>
    <div dir="auto">${m.tasks.length ? `${t("machine_waits")} ${tasks}` : t("machine_waits_none")}</div></div></div>`;
  }).join("");
}

// After Stop, the bees at work finish their step: Kandu says it is stopping, and how many still work, then stopped.
function stopWord(s) {
  if (!s.stop_requested) return "";
  return s.stopping ? t(s.stopping === 1 ? "stopping_one" : "stopping_many").replace("{n}", num(s.stopping)) : tr("stopped");
}

// The header's version badge, from Kandu's own log: the install's version, and whether it is the newest release of
// the public upstream. Behind, a click opens that release's changes. The page never asks GitHub.
function renderVersion(v) {
  const box = $("version");
  if (!v) { box.hidden = true; return; }
  const mine = v.installed || t("version_no_version");
  const tried = v.tried_at ? t("version_tried").replace("{at}", when(v.tried_at)) : t("version_never_tried");
  const said = v.up_to_date === true ? t("version_latest").replace("{v}", mine)
    : v.up_to_date === false ? t("version_newer").replace("{v}", mine).replace("{latest}", v.latest)
    : t("version_unknown").replace("{v}", mine).replace("{tried}", tried);
  box.textContent = said;
  box.title = said;
  box.className = `version ${v.up_to_date === true ? "latest" : v.up_to_date === false ? "newer" : "unknown"}`;
  if (v.up_to_date === false && v.url) {
    box.href = v.url;
    box.target = "_blank";
    box.rel = "noopener";
  } else {
    box.removeAttribute("href");
  }
  box.hidden = false;
}

// A project whose main is red, until main passes: the failing tests and the task that fixes it, read from the log.
// A project whose base branch is missing on GitHub: none of its tasks starts until it is there again.
function renderBaseMissing(missing) {
  const box = $("basemissing"), names = Object.keys(missing || {});
  box.hidden = !names.length;
  $("basemissingtitle").textContent = names.map(n => t("base_missing_title").replace("{project}", n)
    .replace("{branch}", missing[n].branch).replace("{repos}", missing[n].repos.join(", "))).join(" · ");
}

function renderMainRed(red) {
  const box = $("mainred"), names = Object.keys(red || {});
  if (!names.length) { box.hidden = true; return; }
  const first = red[names[0]];
  $("mainredtitle").textContent = names.map(n => t("main_red_title").replace("{project}", n)).join(" · ");
  const fix = names.map(n => red[n].fix_task ? `${t("main_red_fix")}: ${red[n].fix_task}` : "").filter(Boolean).join(" · ");
  $("mainredtests").textContent = [...new Set(names.flatMap(n => red[n].failing))].join("\n") + (fix ? `\n${fix}` : "");
  box.hidden = false;
}

// The upgrade notice: what each version the user has not read brought, from the install's changelog, shown as it is
// written; a published version's heading links to its release. «Mark as read» keeps the newest version shown as read
// in Kandu's state, so it is gone in every browser.
function renderUpgrade(u) {
  const box = $("upgrade");
  if (!u || !u.entries || !u.entries.length) { box.hidden = true; return; }
  $("upgradetitle").textContent = t("upgrade_title").replace("{v}", u.version);
  const drawn = JSON.stringify(u.entries);
  if (box.dataset.drawn !== drawn) {
    box.dataset.drawn = drawn;
    $("upgradeentries").replaceChildren(...u.entries.map(entry => {
      const text = document.createElement("pre");
      text.className = "upgrade-entry";
      text.dir = "auto";
      const [head, ...rest] = entry.text.split("\n");
      if (entry.url) {
        const link = document.createElement("a");
        link.href = entry.url;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = head;
        text.append(link);
      } else {
        text.append(head);
      }
      if (rest.length) text.append("\n" + rest.join("\n"));
      return text;
    }));
  }
  box.dataset.read = u.read;
  box.hidden = false;
}

async function refreshState() {
  stateReadAt = Date.now();
  const s = await get("/state");
  lastState = s;
  if (!saved(LANGUAGE_KEY) && TEXT[s.language] && s.language !== lang) setLanguage(s.language);  // The browser's choice wins.
  renderVersion(s.version_badge);
  renderUpgrade(s.upgrade);
  renderBaseMissing(s.base_missing);
  renderMainRed(s.main_red);
  const name = s.stop_requested ? "stopped" : (s.supervisor || "never ran");
  const refused = githubRefused(s);
  $("pulse").className = `pulse ${s.stop_requested ? "stopped" : refused ? "refused" : s.supervisor === "awake" ? "awake" : ""}`;
  $("state").textContent = (refused ? refused + " · " : "") + (stopWord(s) || tr(name)) + (s.last_reason ? " · " + tr(s.last_reason) : "");
  $("stop").hidden = s.stop_requested;
  $("stop").title = t("hint_stop");
  $("resume").hidden = !s.stop_requested;
  $("machines").innerHTML = unreachableMachines(s);
  $("machines").hidden = !(s.unreachable_machines || []).length;
  const marked = Object.keys(s.over_limit || {}).sort().join();
  if (marked !== renderLegend.marked) { renderLegend.marked = marked; renderLegend(); }  // It explains the red while it shows.
  renderStats(s);
  renderBees(s);
  renderQueen(s);
  renderScene(s, lastQueue);
  renderProjects();
  renderSettings(s);
  if (tab === "work") refreshRequests().catch(() => {});
  return s;
}

function matches(project, item, words) {
  const text = `${project} ${item.task} ${item.title} ${stateText(item)} ${item.by_hand ? t("by_hand") : ""} ${item.mark?.yours ? t("waits_for_you") : ""}`.toLowerCase();
  return words.every(word => text.includes(word));
}

function projectCard(project, shown, total, searching) {
  const sorted = [...shown].sort((a, b) => COLUMN_ORDER.indexOf(a.column) - COLUMN_ORDER.indexOf(b.column));
  const counts = COLUMN_ORDER.map(column => [column, sorted.filter(item => item.column === column).length]).filter(([, count]) => count);
  const rows = sorted.map(item => {
    return `<tr data-review="${esc(item.task)}"><td class="fit number">${numberOf(item.task)}</td><td dir="auto"><button class="textlink">${esc(item.title || item.task)}</button>${item.by_hand && !item.yours ? ` <span class="badge" title="${esc(t("by_hand_hint"))}">${t("by_hand")}</span>` : ""}${item.mark?.yours && !item.yours ? ` <span class="badge" style="--c:#e8590c">${t("waits_for_you")}</span>` : ""}${heldLines(item.mark, item.blockers).map(line => `<div class="muted" dir="auto">${esc(line)}</div>`).join("")}</td>
      <td class="fit">${stateBadge(item)}</td></tr>`;
  }).join("");
  const table = rows ? `<table class="rows"><thead><tr><th class="fit">${t("number")}</th><th>${t("title")}</th><th class="fit">${t("status")}</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">${t("empty")}</div>`;
  const open = searching || !closed.has(project.name);
  const paused = lastState.paused_projects.includes(project.name);
  const inConfig = lastState.paused_in_config.includes(project.name);  // Only a change of config resumes this one.
  const pause = `${paused ? `<span class="badge" style="--c:#d9604f">${t("project_on_pause")}</span>` : ""}${inConfig ? "" : `<button class="btn small project-pause" data-pause="${esc(project.name)}" data-paused="${paused}">${t(paused ? "resume_project" : "pause_project")}</button>`}`;
  return `<details class="card project" data-project="${esc(project.name)}"${open ? " open" : ""}><summary><button type="button" class="textlink project-name" data-settings-open="${esc(project.name)}" title="${esc(t("set_open_hint"))}">${bdi(project.name)}</button>${limitBadge(overLimit(lastState, project.name))}<span class="number">${num(total)}</span>
    <span class="counts">${counts.map(([column, count]) => `<span class="badge" style="--c:${FLOWERS[column].swatch}" title="${esc(tr(column === "waiting" ? "waiting for machine" : column))}">${num(count)}</span>`).join("")}</span>${pause}</summary>${bazrasLine(project.name)}${table}</details>`;
}

// The project's last look, in its card; only for a project Bazras looks at.
function bazrasLine(name) {
  const looks = lastState.bazras?.last || {};
  if (!(name in looks)) return "";
  const last = looks[name];
  const said = !last ? t("bazras_none_yet") : lookBadge(last);

// A number with a minus and a plus; each press sends the new number at once. `path` holds {n} for it.
function stepper(value, path, label, step = 1) {

  return `<span class="stepper">${button(-step, "−")}<b class="number">${num(value)}</b>${button(step, "+")}</span>`;
}

// The settings section: Kandu's pace, then one row per project, in the registry's order. A project paused in its
// config shows a switch that cannot move, since only the config resumes it. A change goes to the API at once and
// the next state redraws.
// Telegram: which kinds of news Kandu sends, as `notify.events` in the config; the bot's token and the chat stay in
// local/.env and never reach the page. The kinds go in the order a user meets them; one the page does not know yet
// comes last, by its name.
const NOTIFY_ORDER = ["pr_ready", "task_done", "needs_decision", "failure", "supervisor_stopped", "usage_limit", "claude_login", "machine_unreachable", "upstream"];
const notifyKinds = n => [...NOTIFY_ORDER.filter(k => n.kinds.includes(k)), ...n.kinds.filter(k => !NOTIFY_ORDER.includes(k))];
const notifyPath = events => `/notify?events=${encodeURIComponent([...events].join(",") || "none")}`;  // none: send nothing
// Telegram's connection: the bot's token and the chat go in a POST's body to local/.env, so they are in no URL and no
// log, and the page only learns whether each is set. A field is never filled back in.
async function sendForm(button, path, fields) {
  if (!token && !await askToken()) return false;
  return busy(button, async () => {
    const r = await fetch("/api/v1" + path, {method: "POST", body: new URLSearchParams(fields),
      headers: {Authorization: "Bearer " + token, "Content-Type": "application/x-www-form-urlencoded"}});
    if (r.status === 403) token = "";
    const answer = await r.json().catch(() => ({}));
    if (!r.ok) { toast(r.status === 403 ? t("token_required") : tr(answer.error) || t("request_failed")); return false; }
    return answer;
  });
}

async function tgConnect(button) {
  const d = button.dataset;
