# Kandu main config — example.
# /kandu-setup writes the real one to local/kandu.yaml (gitignored) by asking you questions.
# You can also copy this file there and edit it by hand.

brain:
  machine: server              # name of a machine below; the supervisor runs here (should be always on)
  work_dir: ~/kandu-work       # where Kandu clones projects that have run: clone; their path must be inside it
  install_dir: ~/kandu         # where this repo is installed on that machine

didban:                        # see DESIGN §13
  knowledge:                   # sources Didban may read, read-only; never copied
    - name: notes
      machine: server
      path: ~/notes

machines:
  - name: server
    reach: local               # local = the machine Kandu runs on
    always_on: true
  - name: laptop
    reach: ssh laptop          # SSH alias from ~/.ssh/config
    always_on: false           # checked at the start of each cycle; skipped when unreachable

claude:
  auth: subscription           # subscription | api_key (api_key: set ANTHROPIC_API_KEY in local/.env)
  limits:
    session_5h_percent: 70     # stop when the 5-hour usage window reaches this
    weekly_percent: 60         # stop when weekly usage reaches this
  login_warn_days: 7           # warn this many days before the Claude login expires
  models:                      # optional; worker, reviewer, splitter, live_check, queen or bazras. A role not named runs on Claude's default
    splitter: claude-sonnet-5-5
    live_check: claude-sonnet-5-5

github:
  account: your-github-login
  owners:                      # users / orgs Kandu may work in
    - your-github-login
    - acme-org
  sync_every_minutes: 10       # optional; how often Kandu reads GitHub into its copy and sends its queued changes

notify:
  adapter: telegram            # telegram | none
  telegram:
    bot_token_env: KANDU_TELEGRAM_BOT_TOKEN   # names of variables in local/.env, not the values
    chat_id_env: KANDU_TELEGRAM_CHAT_ID
  language: en                 # optional; the language of notifications only, en | fa. Default: top-level language
  events:                      # optional; what is important enough to send. Default: all of these
    - supervisor_stopped
    - failure
    - needs_decision
    - pr_ready
    - task_done
    - usage_limit
    - claude_login

bazras:                        # optional; Bazras's daily look at projects whose `inspect` is on (DESIGN §5)
  at: "06:00"                  # default hour; a project's inspect.at overrides it

backup:                        # optional; a daily copy of local/ and state/, what Git cannot rebuild (DESIGN §12)
  enabled: false               # off until you turn it on, here or in the dashboard
  at: "03:00"                  # the hour of the daily copy, on the brain's clock
  destination: ~/kandu-backups # a folder on the brain's machine, outside local/ and state/; logs/ is left out
  keep: 7                      # how many copies stay; the oldest go only after a new copy is good

supervisor:                    # optional; these are the defaults
  wake_every_minutes: 60
  max_cycle_minutes: 50
  max_parallel_workers: 2
  max_parallel_sizers: 4       # splitter runs at once; they only read, so every unsized task is sized in the same cycle
  auto_merge: false            # true = the supervisor merges on its own when it judges a PR right
  auto_revert: false           # must stay false: the supervisor only reports breakage
  queen: true                  # true = an LLM runs the cycle for every project; it wakes only when needed
  queen_max_retries: 3         # how often the queen may take each kind of step on one task (retry, rework, check, new task, merge order); past it the task stops and you hear of it
  queen_daily_token_limit: 2000000   # her own limit; past it, running work ends and nothing new starts
  queen_drop_blockers: false   # true = the queen may ask you to drop a blocker a task does not need; off until you turn it on, here or in the dashboard
  clean_merged: true           # true = once a task's PR is merged, its folders beside the repo and its kandu/ branches go; a folder with work not in the PR stays. Off here or in the dashboard

# permissions:                 # optional; what each role may do. Without it every role may do everything:
