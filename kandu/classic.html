// A project's pop-up shows every setting it has, in its groups. Nothing changes until Save, and then each change
// goes through the call it always had, so it is checked and logged as before.
// Each role a project may give a model of its own; the queen's is global only. An empty draft is "same as global".
const MODEL_KEYS = ["model_worker", "model_reviewer", "model_splitter", "model_live_check", "model_bazras"];
const SETTING_GROUPS = [["set_group_work", ["paused", "max_parallel_workers", "priority", "daily_token_limit", "multi_user"]], ["set_group_merge", ["auto_merge", "frozen", "watch_main"]], ["set_group_queen", ["split_approval", "queen_answers_one_way"]], ["set_group_models", MODEL_KEYS]];

function settingsDraft(row) {
  return {name: row.name, ...Object.fromEntries(SETTING_GROUPS.flatMap(([, keys]) => keys).map(key => [key, row[key]]))};
}

// One call for each setting that changed, the same call the dashboard always made for it. A new name goes last, so
// every other call still names the project as the server knows it.
function settingsCalls(name, was, now) {
  const project = encodeURIComponent(name);
  const path = (key, value) => key === "paused" ? `/projects/${project}/${value ? "pause" : "resume"}`
    : key === "max_parallel_workers" ? `/parallel?project=${encodeURIComponent(`${name}:${value}`)}`
    : `/projects/${project}/settings?${key}=${encodeURIComponent(MODEL_KEYS.includes(key) && !value ? "global" : value)}`;
  return [...SETTING_GROUPS.flatMap(([, keys]) => keys), "name"].filter(key => now[key] !== was[key]).map(key => ({setting: key, path: path(key, now[key])}));
}

// Turning "merges by itself" on asks first; turning it off asks nothing.
function mergeOnAsked(was, now) {
  return !was.auto_merge && Boolean(now.auto_merge);
}

// What Save does: close when nothing changed, ask before merging by itself, or save.
function saveStep(edit) {
  if (!settingsCalls("", edit.was, edit.now).length) return "close";
  return mergeOnAsked(edit.was, edit.now) && !edit.asking ? "ask" : "save";
}

// Sends each change in turn. One the server takes becomes what the pop-up starts from, so it is not sent again; one
// it refuses is listed with why. `send` answers {ok} or {ok: false, why, stop}. An empty name is refused here, and
// once a new name is taken the pop-up goes on under it.
async function applySettings(name, edit, send) {
  edit.refused = [];
  for (const call of settingsCalls(name, edit.was, edit.now)) {
    if (call.setting === "name" && !edit.now.name) { edit.refused.push({setting: "name", why: tr("give the project a name")}); continue; }
    const answer = await send(call.path);
    if (answer.ok) {
      edit.was = {...edit.was, [call.setting]: edit.now[call.setting]};
      if (call.setting === "name") edit.name = edit.now.name;
      continue;
    }
    edit.refused.push({setting: call.setting, why: answer.why});
    if (answer.stop) break;
  }
  return edit.refused;
}

const SETTING_LABELS = {name: "set_name", paused: "set_run_label", max_parallel_workers: "setting_workers", priority: "setting_priority", daily_token_limit: "setting_tokens", auto_merge: "setting_auto_merge", frozen: "setting_frozen", split_approval: "set_split_by", queen_answers_one_way: "set_one_way_by", watch_main: "set_watch_main", multi_user: "set_multi_user", model_worker: "set_model_worker", model_reviewer: "set_model_reviewer", model_splitter: "set_model_splitter", model_live_check: "set_model_live_check", model_bazras: "set_model_bazras"};
const SETTING_HINTS = {name: "set_name_hint", max_parallel_workers: "setting_workers_hint", priority: "setting_priority_hint", daily_token_limit: "setting_tokens_hint", auto_merge: "mode_auto_hint", frozen: "mode_frozen_hint", watch_main: "set_watch_main_hint", multi_user: "set_multi_user_hint"};

// One setting's control, drawn from the draft. A pause set in the config shows and cannot move.
function settingControl(key, row, now) {
  const label = t(SETTING_LABELS[key]), value = now[key];
  const hint = row.paused_in_config && key === "paused" ? t("paused_in_config_hint") : SETTING_HINTS[key] ? t(SETTING_HINTS[key]) : "";
  const head = `<div class="set-label"><span>${label}</span>${hint ? `<small>${esc(hint)}</small>` : ""}</div>`;
  const seg = (options, off = false) => `<div class="set-field stack">${head}<div class="seg" role="group" aria-label="${esc(label)}">${options.map(([v, text]) =>
    `<button type="button" data-draft="${key}" data-value="${v}" aria-pressed="${String(value) === v}"${off ? " disabled" : ""}>${t(text)}</button>`).join("")}</div></div>`;
  const step = () => `<div class="set-field">${head}<span class="stepper"><button type="button" class="btn small" data-draft="${key}" data-by="-1" aria-label="${esc(`${t("less")}: ${label}`)}"${value <= 1 ? " disabled" : ""}>−</button><b class="number">${num(value)}</b><button type="button" class="btn small" data-draft="${key}" data-by="1" aria-label="${esc(`${t("more")}: ${label}`)}">+</button></span></div>`;
  const flip = () => `<div class="set-field">${head}<button type="button" class="flip" role="switch" aria-checked="${Boolean(value)}" data-draft="${key}" aria-label="${esc(label)}"><i></i></button></div>`;
  if (key === "paused") return seg([["false", "set_running"], ["true", "project_on_pause"]], row.paused_in_config);
  if (key === "split_approval") return seg([["user", "set_me"], ["queen", "set_the_queen"]]);
  if (key === "queen_answers_one_way") return seg([["false", "set_me"], ["true", "set_the_queen"]]);
  if (key === "name") return `<div class="set-field stack">${head}<input type="text" class="name-field" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" data-draft="${key}" value="${esc(value)}" aria-label="${esc(label)}"></div>`;
  if (MODEL_KEYS.includes(key)) {
    // Its own model, or the global one marked as global; Claude's default when neither names one.
    const global = row.global_models?.[key.slice(6)] || t("set_model_default");
    const note = value ? `${t("set_model_own")} · ${t("set_model_global")}: ${global}` : `${t("set_model_from_global")}: ${global}`;
    return `<div class="set-field stack"><div class="set-label"><span>${label}</span><small class="${value ? "" : "model-global"}" dir="auto">${esc(note)}</small></div>
      <div class="model-row"><input type="text" class="name-field" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" data-draft="${key}" value="${esc(value)}" placeholder="${esc(global)}" aria-label="${esc(label)}">
      <button type="button" class="btn small" data-draft="${key}" data-value=""${value ? "" : " disabled"}>${t("set_model_same")}</button></div></div>`;
  }
  if (key === "daily_token_limit") return `<div class="set-field">${head}<input type="number" class="tokens-field" min="1" step="100000" dir="ltr" inputmode="numeric" data-draft="${key}" value="${esc(value)}" aria-label="${esc(label)}"></div>`;
  return key === "max_parallel_workers" || key === "priority" ? step() : flip();
}

function settingsBody(row, edit) {
  const groups = SETTING_GROUPS.map(([head, keys]) => `<section class="set-group"><h3>${t(head)}</h3>${keys.map(key => settingControl(key, row, edit.now)).join("")}</section>`).join("");
  const refused = edit.refused.length ? `<div class="set-refused" role="alert"><b>${t("set_refused")}</b><ul>${edit.refused.map(r =>
    `<li>${esc(t(SETTING_LABELS[r.setting]))}: <span dir="auto">${esc(r.why)}</span></li>`).join("")}</ul></div>` : "";
  return `<div class="sheet-grip"></div><div class="sheet-head"><div class="sheet-who"><div class="muted">${t("tab_settings")}</div><h2>${bdi(row.name)}</h2></div>
    <button type="button" class="sheet-close" data-set-cancel aria-label="${esc(t("close"))}">✕</button></div>${refused}<section class="set-group">${settingControl("name", row, edit.now)}</section>
    <section class="set-group"><div class="set-field stack"><div class="set-label"><span>${t("set_base_branch")}</span><small>${esc(t("set_base_branch_hint"))}</small></div><b dir="${row.base_branch ? "ltr" : "auto"}" data-base-branch>${esc(row.base_branch || t("set_base_branch_default"))}</b></div></section>${groups}
    <section class="set-group"><h3>${t("kanduban")}</h3><p class="muted">${t("kanduban_hint")}</p><div class="actions" id="setkanduban">${kandubanControls(row.name)}</div></section>
    <section class="set-danger"><h3>${t("set_danger")}</h3><p class="muted">${t("remove_project_hint")}</p><div class="actions"><button type="button" class="btn danger" data-remove="${esc(row.name)}">${t("remove_project")}</button></div></section>`;
}

function settingsFoot(edit) {
  if (edit.asking) return `<div class="sheet-note tone-amber">${t("set_merge_ask")}</div>
    <div class="actions"><button type="button" class="btn" data-set-no>${t("set_merge_no")}</button><button type="button" class="btn primary" data-set-yes>${t("set_merge_yes")}</button></div>`;
  return `<div class="actions"><button type="button" class="btn" data-set-cancel>${t("cancel")}</button><button type="button" class="btn primary" data-set-save>${t("save")}</button></div>`;
}

let setEdit = null;  // The open pop-up: its project, what the server had, the draft, what was refused, and whether it asks.

function openSettings(name) {
  const row = (lastState?.project_settings || []).find(p => p.name === name);
  if (!row) return;
  setEdit = {name, was: settingsDraft(row), now: settingsDraft(row), refused: [], asking: false};
  markView();
  drawSettings();
  $("setsheet").showModal();
  $("setbody").scrollTop = 0;
}

function drawSettings() {
  const row = (lastState?.project_settings || []).find(p => p.name === setEdit.name) || {name: setEdit.name};
  $("setbody").innerHTML = settingsBody(row, setEdit);
  $("setfoot").innerHTML = settingsFoot(setEdit);
}

// A change in the pop-up changes only its draft.
function changeDraft(control) {
  const key = control.dataset.draft, now = setEdit.now;
  if (control.dataset.by) now[key] = Math.max(1, now[key] + Number(control.dataset.by));
  else if (control.dataset.value !== undefined) now[key] = {true: true, false: false}[control.dataset.value] ?? control.dataset.value;
  else if (control.getAttribute("role") === "switch") now[key] = !now[key];
  else { now[key] = key === "name" || MODEL_KEYS.includes(key) ? control.value.trim() : control.value.trim() === "" ? "" : Number(control.value); setEdit.asking = false; $("setfoot").innerHTML = settingsFoot(setEdit); return; }
  setEdit.asking = false;
  drawSettings();
}

async function saveSettings(button) {
  const edit = setEdit, step = saveStep(edit);
  if (step === "close") { $("setsheet").close(); return; }
  if (step === "ask") { edit.asking = true; drawSettings(); return; }
  if (!token && !await askToken()) return;
  const send = async path => {
    post.failed = null;
    if (await act(button, path)) return {ok: true};
    return {ok: false, why: post.failed?.error ? tr(post.failed.error) : t("request_failed"), stop: !token};
  };
  const refused = await applySettings(edit.name, edit, send);
  renderSettings.key = null;  // Whatever the answers, the next state draws what the server kept.
  if (edit !== setEdit) return;
  edit.asking = false;
  if (refused.length) { drawSettings(); $("setbody").scrollTop = 0; return; }
  $("setsheet").close();
  toast(fillIn("set_saved", {name: edit.name}));
}

// The pop-up of a project that was removed closes.
function closeSettings(name) {
  if (setEdit?.name === name) $("setsheet").close();
}

// Taking a project out of Kandu: the first click asks on the button itself, the second acts. Nothing is typed.
// When the PR with its memory cannot be made, nothing is removed and the button becomes the choice to go on
// without that PR, asked the same way.
async function removeProject(button) {
  if (button.dataset.sure !== "true") {
    button.dataset.sure = "true";
    button.textContent = t("remove_sure");
    return;
  }
  button.dataset.sure = "false";
  const name = button.dataset.remove, without = button.dataset.withoutPr === "true";
  const removed = await act(button, `/projects/${encodeURIComponent(name)}/remove${without ? "?without_memory_pr=true" : ""}`, t("removing"));
  if (!removed) {
    const offerWithout = Boolean(post.failed?.memory_pr_failed);
    button.dataset.withoutPr = String(offerWithout || without);
    button.textContent = t(offerWithout || without ? "remove_without_pr" : "remove_project");
    return;
  }
  const memory = removed.memory || {};
  toast([fillIn("removed_msg", {name}), memory.why ? fillIn(`memory_${memory.why}`, {pr: memory.pr || ""}) : ""].filter(Boolean).join(" "));
  closeSettings(name);
  renderSettings.key = null;
  refreshState().catch(() => {});
}

async function changeSetting(box) {
  const d = box.dataset;
  const name = d.settingPause ?? d.settingSplits ?? d.settingOneWay ?? d.settingWatchMain ?? d.settingAutoMerge ?? d.settingFrozen ?? d.settingMultiUser ?? d.settingTokens;
  const settings = `/projects/${encodeURIComponent(name)}/settings?`;
  const path = d.settingPause !== undefined ? `/projects/${encodeURIComponent(name)}/${box.checked ? "pause" : "resume"}`
    : d.settingSplits !== undefined ? `${settings}split_approval=${box.checked ? "queen" : "user"}`
    : d.settingAutoMerge !== undefined ? `${settings}auto_merge=${box.checked}`
    : d.settingWatchMain !== undefined ? `${settings}watch_main=${box.checked}`
    : d.settingFrozen !== undefined ? `${settings}frozen=${box.checked}`
    : d.settingMultiUser !== undefined ? `${settings}multi_user=${box.checked}`
    : d.settingTokens !== undefined ? `${settings}daily_token_limit=${encodeURIComponent(box.value)}`
    : `${settings}queen_answers_one_way=${box.checked}`;
  renderSettings.key = null;  // Whatever the answer, the next state draws what the server kept.
  if (!await act(box, path)) refreshState().catch(() => {});
}

// The config's priority, 1 first; a project the config does not name goes last.
function rank(name) {
  const at = (lastState.project_order || []).indexOf(name);
  return at < 0 ? 1e9 : at;
}

function renderProjects() {
  if (!lastState || tab !== "work") return;
  const words = $("search").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const projects = fields(lastState, lastQueue);
  const key = JSON.stringify([lang, words, projects, lastState.paused_projects, lastState.over_limit]);
  if (key === listKey) return;
  listKey = key;
  const cards = projects.map(project => ({project, total: project.tasks.length, shown: project.tasks.filter(item => matches(project.name, item, words))}))
    .filter(card => card.shown.length || !words.length)
    .sort((a, b) => rank(a.project.name) - rank(b.project.name));
  $("projects").innerHTML = cards.map(card => projectCard(card.project, card.shown, card.total, words.length)).join("")
    || `<div class="card empty">${t(words.length ? "no_match" : "empty_meadow")}</div>`;
}

async function refreshQueue(state, fresh) {
  try {
    lastQueue = await get(fresh ? "/queue?fresh=1" : "/queue");
    renderStats(state);
    renderProjects();
    renderScene(state, lastQueue);
    if (lastQueue.stale) toast(t("github_unreadable"));
  } catch { toast(t("github_unreadable")); }
}

function didDuring(actions) {
  const done = ["requests", "tasks", "answers"].filter(kind => actions[kind]).map(kind => `${num(actions[kind])} ${t("did_" + kind)}`);
  return done.join(" · ") || "—";
}

async function refreshDidban() {
  const {sessions} = await get("/didban");
  const rows = sessions.map(s => `<tr><td class="fit number">${esc(s.started ? when(s.started) : "—")}</td><td dir="auto">${esc(s.title || "—")}</td>
    <td class="fit hide-narrow">${esc(didDuring(s.actions))}</td>
    <td class="fit end" title="${esc(num(s.tokens.input + s.tokens.output + s.tokens.cache_read + s.tokens.cache_creation))}">${esc(short(s.tokens.input + s.tokens.output + s.tokens.cache_creation))}</td></tr>`).join("");
  $("didbansessions").innerHTML = `<h3>${t("didban_sessions")}</h3>` + (rows ? `<table class="rows"><thead><tr><th class="fit">${t("when")}</th><th>${t("session_title")}</th><th class="fit hide-narrow">${t("session_did")}</th><th class="fit end">${t("tokens")}</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">${t("no_didban_sessions")}</div>`);
}

// Didban and Zanbourdar sit side by side in the header, so their buttons say whose session they are.
function flightControls(flight, target, label, go = t("flight_go"), close = t("flight_close")) {
  if (flight?.status === "opening") return `<button class="btn busy" disabled>${t("flight_opening")}</button>`;
  if (flight?.status === "open") return `${flight.url ? `<a class="btn primary" href="${esc(flight.url)}" target="_blank" rel="noopener">${go} ↗</a>` : `<button class="btn busy" disabled>${t("flight_no_link")}</button>`}<button class="btn" data-land="${esc(flight.key)}">${close}</button>`;
  return `<button class="btn" data-fly="${esc(target)}">${label}</button>`;
}

function kandubanControls(name) {
  return flightControls(kandubanOf(name), `kanduban:${name}`, t("open_kanduban"), t("go_kanduban"), t("close_kanduban"));
}

// A Kanduban is named by its project; Zanbourdar is the free flight with neither a task nor a project.
function flightName(s) {
  if (s.task) return `<button class="textlink" data-review="${esc(s.task)}">${bdi(repoOf(s.task))} ${numberOf(s.task)}</button>`;
  return s.project ? `${esc(t("kanduban"))} ${bdi(s.project)}` : esc(t("zanbourdar"));
}

function renderFlights() {
  if ($("setkanduban") && setEdit) $("setkanduban").innerHTML = kandubanControls(setEdit.name);
  for (const mark of document.querySelectorAll(".kanduban-mark")) mark.classList.toggle("open", kandubanOf(mark.dataset.kandubanFor)?.status === "open");
  $("didbanbox").innerHTML = flightControls(flights.open.find(f => f.kind === "didban"), "didban", t("open_didban"), t("go_didban"), t("close_didban"));
  $("zanbourdarbox").innerHTML = flightControls(flights.open.find(f => f.kind === "zanbourdar"), "zanbourdar", t("open_zanbourdar"), t("go_zanbourdar"), t("close_zanbourdar"));
  if ($("taskflight") && shownTask) $("taskflight").innerHTML = flightControls(flights.open.find(f => f.task === shownTask), shownTask, t("open_flight"));
  const task = flightName;
  const open = flights.open.filter(f => f.kind !== "didban" && f.status === "open").map(f => `<tr><td class="fit number">${esc(when(f.started))}</td><td>${task(f)}</td>
    <td dir="auto">${f.url ? `<a class="textlink" href="${esc(f.url)}" target="_blank" rel="noopener">${t("flight_go")} ↗</a>` : esc(t("flight_no_link"))} <button class="btn small" data-land="${esc(f.key)}">${t("flight_close")}</button></td><td class="fit end">${t("flight_open_now")}</td></tr>`);
  const flown = flights.flown.map(s => `<tr><td class="fit number">${esc(s.started ? when(s.started) : "—")}</td><td>${task(s)}</td><td dir="auto">${esc(s.title || "—")}</td>
    <td class="fit end" title="${esc(num(s.tokens.input + s.tokens.output + s.tokens.cache_read + s.tokens.cache_creation))}">${esc(short(s.tokens.input + s.tokens.output + s.tokens.cache_creation))}</td></tr>`);
  const rows = [...open, ...flown].join("");
  $("freeflights").innerHTML = `<h3>${t("free_flights")}</h3>` + (rows ? `<table class="rows"><thead><tr><th class="fit">${t("when")}</th><th>${t("number")}</th><th>${t("session_title")}</th><th class="fit end">${t("tokens")}</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">${t("no_free_flights")}</div>`);
}

async function refreshFlights() {
  flights = await get("/flights");
  for (const f of flights.open.filter(f => f.status === "failed" && !flightsWarned.has(f.session))) {
    flightsWarned.add(f.session);
    toast(tr(f.error));
  }
  renderFlights();
  clearTimeout(refreshFlights.timer);
  if (flights.open.some(f => f.status === "opening" || (f.status === "open" && !f.url))) refreshFlights.timer = setTimeout(() => refreshFlights().catch(() => {}), 2000);
}

async function openFlight(button) {
  const target = button.dataset.fly;
  const project = target.startsWith("kanduban:") ? target.slice("kanduban:".length) : null;
  const shown = project && kandubanOf(project);
  if (shown?.status === "open") { if (shown.url) window.open(shown.url, "_blank", "noopener"); return; }  // One per project: its link.
  if (shown) return;  // still opening
  const path = project ? `/flights/kanduban/${encodeURIComponent(project)}`
    : ["didban", "zanbourdar"].includes(target) ? `/flights/${target}` : `/flights/tasks/${target.replace("#", "/")}`;
  const focus = button.dataset.focus ? `&project=${encodeURIComponent(button.dataset.focus)}` : "";
  await act(button, `${path}?language=${lang}${focus}`, t("flight_opening"));
  await refreshFlights();
}

// Tokens by project over a range, each project's tasks under it, then Kandu itself and the sessions, so the rows
// add up to the total. Today also shows what counts against each project's daily limit.
async function refreshUsage() {
  const range = $("usagerange").value, custom = range === "custom";
  $("usagedates").hidden = !custom;
  if (custom && !($("usagefrom").value && $("usageto").value)) return;
  const query = custom ? `from=${$("usagefrom").value}&to=${$("usageto").value}` : `range=${range}`;
  const usage = await get(`/usage?${query}`);
  const most = Math.max(1, ...usage.projects.map(p => p.total), usage.kandu, usage.sessions);
  const bar = value => `<span class="tokenbar" style="width:${(100 * value / most).toFixed(1)}%"></span>`;
  const cell = value => `<td class="fit end" title="${esc(num(value))}">${esc(short(value))}${bar(value)}</td>`;
  const limit = p => p.limit ? `<span class="limit-note${p.counted >= p.limit ? " over" : ""}">${esc(fillIn("of_limit", {counted: short(p.counted), limit: short(p.limit)}))}</span>` : "";
  const rows = usage.projects.map(p => `<tr class="group"><td>${bdi(p.project)}${limit(p)}</td><td class="fit hide-narrow"></td>${cell(p.total)}</tr>`
    + p.tasks.map(task => `<tr class="sub" data-review="${esc(task.task)}"><td class="number">${numberOf(task.task)}</td><td class="fit hide-narrow">${task.outcome ? esc(tr(task.outcome)) : "—"}</td>${cell(task.total)}</tr>`).join("")).join("")
    + (usage.kandu ? `<tr class="group" title="${esc(t("kandu_itself_hint"))}"><td>${t("kandu_itself")}</td><td class="fit hide-narrow"></td>${cell(usage.kandu)}</tr>` : "")
    + (usage.sessions ? `<tr class="group"><td>${t("usage_sessions")}</td><td class="fit hide-narrow"></td>${cell(usage.sessions)}</tr>` : "");
  $("usage").innerHTML = rows ? `<table class="rows"><thead><tr><th>${t("project")}</th><th class="fit hide-narrow">${t("outcome")}</th><th class="fit end">${t("tokens")}</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">${t("no_usage")}</div>`;
  const chips = obj => Object.entries(obj).sort(([, a], [, b]) => b - a).map(([name, used]) => `<span class="chip">${bdi(tr(name))}: ${esc(short(used))}</span>`);
  $("usagetotals").innerHTML = [`<span class="chip"><b>${t("total")}: ${esc(short(usage.total))}</b></span>`, ...chips(usage.roles), ...chips(usage.models)].join("");
}

async function refreshDays() {
  refreshDidban();
  refreshUsage().catch(() => {});
  const {days} = await get("/days");
  const select = $("day"), chosen = select.value;
  select.innerHTML = days.slice().reverse().map(d => `<option value="${esc(d)}">${esc(dayName(d))}</option>`).join("");
  if (days.includes(chosen)) select.value = chosen;
  if (!days.length) { $("byday").innerHTML = `<div class="empty">${t("no_activity")}</div>`; return; }
  const day = await get("/days/" + select.value);
  const finished = Object.fromEntries(day.finished.map(f => [f.task, f.outcome]));
  const spent = Object.entries(day.tasks).sort(([, a], [, b]) => b.total - a.total);
  const most = Math.max(1, ...spent.map(([, used]) => used.total));
  const rows = spent.map(([task, used]) => `<tr data-review="${esc(task)}"><td class="fit number">${numberOf(task)}</td><td>${bdi(repoOf(task))}</td>
    <td class="fit hide-narrow">${finished[task] ? esc(tr(finished[task])) : "—"}</td>
    <td class="fit end" title="${esc(num(used.total))}">${esc(short(used.total))}<span class="tokenbar" style="width:${(100 * used.total / most).toFixed(1)}%"></span></td></tr>`).join("");
  $("byday").innerHTML = rows ? `<table class="rows"><thead><tr><th class="fit">${t("number")}</th><th>${t("project")}</th><th class="fit hide-narrow">${t("outcome")}</th><th class="fit end">${t("tokens")}</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">${t("no_activity")}</div>`;
  const parts = obj => Object.entries(obj).map(([name, used]) => `<span class="chip">${bdi(tr(name))}: ${esc(short(used.total))}</span>`);
  $("daytotals").innerHTML = [`<span class="chip">${t("total")}: ${esc(short(day.total.total))}</span>`, ...parts(day.roles), ...parts(day.models)].join("");
}

function renderLive() {
  const rows = live.map(e => `<tr${e.task ? ` data-review="${esc(e.task)}"` : ""}><td class="fit number">${esc(clock(e.ts))}</td><td class="fit">${esc(tr(e.type))}</td>
    <td class="fit">${e.task ? numberOf(e.task) : ""}</td><td dir="auto">${esc([e.phase, e.decision, e.reason, e.outcome].filter(Boolean).map(tr).join(" · "))}</td></tr>`).join("");
  $("live").innerHTML = rows ? `<table class="rows feed"><tbody>${rows}</tbody></table>` : `<div class="empty">${t("nothing_yet")}</div>`;
}

async function loadLive() {
  const seen = [];
  for (let after = 0; ; ) {
    const page = await get(`/events?after=${after}`);
    seen.push(...page.events);
    if (!page.events.length || page.next === after) break;
    after = page.next;
  }
  live = [...seen.reverse(), ...live].slice(0, LIVE_LINES);
  renderLive();
}

}

  </div></details>`;

function doneBox(info) {
  const counted = tokens => tokens.total - tokens.cache_read;  // as the daily limit counts them
  const minutes = ms => `${num(Math.max(1, Math.round(ms / 60000)))} ${t("minutes")}`;
  const roles = Object.entries(info.cost.roles).map(([role, used]) => `<tr><td>${esc(tr(role))}</td><td class="fit number">${num(used.runs)}</td><td class="fit number">${minutes(used.duration_ms)}</td><td class="fit number">${num(counted(used.tokens))}</td></tr>`).join("");
  return `${info.issue?.body ? `<div class="slice-body" dir="auto">${esc(info.issue.body)}</div>` : ""}
    <div class="chips"><span class="chip">${t("cost_cached")}: ${num(info.cost.total.cache_read)}</span></div>
    ${roles ? `<table class="rows"><thead><tr><th>${t("cost_role")}</th><th class="fit">${t("cost_runs")}</th><th class="fit">${t("cost_time")}</th><th class="fit">${t("tokens")}</th></tr></thead><tbody>${roles}</tbody></table>` : `<p class="muted">${t("cost_none")}</p>`}`;
}

function queued(task) {
  return Object.values(lastQueue?.projects || {}).flatMap(columns => Object.entries(columns).flatMap(([column, tasks]) => tasks.map(item => ({...item, column})))).find(item => item.task === task);
}

// Why a merge waited, from the local log, and the open tasks it waits for, from the copy: one line each.
function heldLines(mark, blockers) {
  const column = name => tr(name || "no column");
  const named = b => `${numberOf(b.task)} ${column(b.column)}${b.slices.length ? ` (${t("slices")}: ${b.slices.map(s => `${numberOf(s.task)} ${column(s.column)}`).join(", ")})` : ""}`;
  const lines = [];
  if (blockers?.length) lines.push(`${t("waits_for_task")}: ${blockers.map(named).join(" · ")}`);
  if (mark?.waited?.length) lines.push(`${t("merge_waited")}: ${mark.waited.map(tr).join(" · ")}`);
  return lines;
}

// What stayed after the task's merge, and why: a folder or branch with work that is not in the PR.
function keptLines(kept) {
  return (kept || []).map(k => `${t("kept_after_merge")}: ${tr(k.what)} ${k.target} · ${tr(k.reason)}`);
}

// A head whose tests failed at the merge gate: when they last ran, and the control to run them again.
function testsView(task, pr) {
  const tests = pr.tests;
  if (!tests?.failed) return "";
  const when = tests.last_run ? ` ${t("tests_last_run")}: ${esc(new Date(tests.last_run).toLocaleString(lang))}.` : "";
  const control = tests.can_test_again ? `<button class="btn" data-test-again="${esc(task)}" data-head="${esc(pr.head_sha)}">${t("test_again")}</button>` : tests.asked ? ` ${t("tests_asked")}` : "";
  return `<p class="muted">${t("tests_waiting")}${when}</p>${control}`;
}

async function testAgain(button) {
  const [repo, number] = button.dataset.testAgain.split("#");
  await act(button, `/reviews/${repo}/${number}/test-again?head=${encodeURIComponent(button.dataset.head)}`);
  showTask(button.dataset.testAgain);
}

// After a yes, the merge is promised only when nothing else still holds it.
function approval(task, pr, holds = []) {
  if (pr.approved) return `<p class="muted">${holds.length ? `${t("approved_held")} ${esc(holds.map(tr).join(" · "))}` : t("approved_waits")}</p>`;
  if (!pr.can_approve) return pr.state === "OPEN" ? `<p class="muted">${esc(tr(pr.why_not))}</p>` : "";
  if (!confirming) return `<button class="btn primary" data-sure>${t("approve")}</button>`;
  return `<div class="confirm"><div>${t("approve_sure")}</div><div class="actions"><button class="btn primary" data-approve="${esc(task)}" data-head="${esc(pr.head_sha)}">${t("approve")}</button><button class="btn" data-unsure>${t("cancel")}</button></div></div>`;
}

// A stopped task the user sends back to work. Nothing here merges.
function sendBack(task, item) {
  if (!item || item.by_hand || !["Blocked", "Needs info"].includes(item.column)) return "";
  if (!sendingBack) return `<button class="btn primary" data-back-sure>${t("send_back")}</button>`;
  return `<div class="confirm"><div>${t("send_back_sure")}</div><div class="actions"><button class="btn primary" data-back="${esc(task)}">${t("send_back")}</button><button class="btn" data-unsure>${t("cancel")}</button></div></div>`;
}

// What a waiting task waits on, where the problem is and the next step, from the wait the server worked out. Links
// are drawn only for GitHub and the checks' https pages, as the server keeps them.
function waitLines(wait) {
  if (!wait) return [];
  const checks = wait.checks || [], first = checks[0], blockers = wait.blockers || [];
  const issue = key => { const [repo, number] = key.split("#"); return `https://github.com/${repo}/issues/${number}`; };
  let what, step, where = [];
  if (wait.on === "check") {
    what = first ? fillIn("wait_check", {name: checks.map(c => c.name).join(", ")}) : t("wait_checks");
    where = checks.filter(c => c.url).map(c => [c.name, c.url]);
    step = first ? fillIn(first.url ? "step_log" : "step_check", {name: first.name}) : t("step_checks");
  } else if (wait.on === "blocker") {
    what = fillIn("wait_blocker", {name: blockers.join(", ")});
    where = blockers.map(b => [b, issue(b)]);
    step = fillIn("step_blocker", {name: blockers[0]});
  } else if (wait.on === "decision" && (wait.detail || []).length) {
    what = fillIn("wait_decision_on", {detail: wait.detail.map(tr).join(lang === "fa" ? "؛ " : "; ")});
    step = t("step_ask");
  } else {
    what = t(`wait_${wait.on}`);
    step = t(wait.on === "yes" ? "step_yes" : "step_ask");
  }
  return [esc(fillIn("wait_on", {what})),
          ...where.map(([name, url]) => `${esc(t("wait_where"))}: <a class="textlink" href="${esc(url)}" target="_blank" rel="noopener" dir="ltr">${esc(name)} ↗</a>`),
          esc(fillIn("wait_step", {step})), ...(wait.held ? [esc(t("wait_held"))] : [])];
}

async function toQueen(button) {
  const [repo, number] = button.dataset.toQueen.split("#");
  if (await act(button, `/tasks/${repo}/${number}/to-queen`)) { toast(t("to_queen_done")); await refreshQueue(lastState, true).catch(() => {}); }
  showTask(button.dataset.toQueen);
}

// What a by-hand task is and how the user does it, with its goal and criteria from the copy, read-only.
function byHandBox(item) {
  if (!item?.by_hand) return "";
  const part = (label, text) => text ? `<div><div class="muted">${label}</div><div class="slice-body" dir="auto">${esc(text)}</div></div>` : "";
  return `<div class="card pad"><p>${t("by_hand_what")}</p><p>${t("by_hand_how")}</p><p>${t("by_hand_done")}</p></div>
    ${part(t("issue_goal"), item.goal)}${part(t("issue_criteria"), item.criteria)}`;
}

function splitAccept(task, proposal) {
  return confirming
    ? `<div class="confirm"><div>${t("approve_split_sure")}</div><div class="actions"><button class="btn primary" data-split="${esc(task)}" data-fingerprint="${esc(proposal.fingerprint)}">${t("approve_split")}</button><button class="btn" data-unsure>${t("cancel")}</button></div></div>`
    : `<button class="btn primary" data-sure>${t("approve_split")}</button>`;
}

async function approveSplit(button) {
  const task = button.dataset.split;
  const [repo, number] = task.split("#");
  const path = `/splits/${repo}/${number}/approve?proposal=${encodeURIComponent(button.dataset.fingerprint)}`;
  if (await act(button, path, t("split_creating"))) toast(t("split_approved"));
  confirming = false;
  showTask(task);
}

const WAIT_ORDER = ["approval", "queen", "decision", "split", "by_hand", "stuck"];

// What waits for the user, one item per open task, as Today in the Kandu Clean look lists it; the sheet says its kind and line.
function waitItems(s, queue) {
  const open = {};
  for (const [project, columns] of Object.entries(queue?.projects || {}))
    for (const [column, tasks] of Object.entries(columns)) for (const entry of tasks) open[entry.task] = {...entry, project, column};
  const done = task => open[task]?.column === "Done";
  const working = new Set((s.workers || []).map(w => w.task));
  const order = name => { const at = (s.project_order || []).indexOf(name); return at < 0 ? 1e9 : at; };
  const splitsMine = name => ((s.project_settings || []).find(p => p.name === name)?.split_approval || "user") === "user";
  const button = (label, attrs, primary = false) => ({label, attrs, primary});
  const items = new Map();
  const add = (task, kind, label, tone, line, actions) => {
    if (items.has(task)) return;
    const project = open[task]?.project || repoOf(task);
    items.set(task, {task, project, title: open[task]?.title || "", kind: label, tone, line, stuck: kind === "stuck",
                     order: WAIT_ORDER.indexOf(kind), rank: order(project), actions: [...actions, button(t("open"), `data-review="${esc(task)}"`)]});
  };
  const marks = Object.entries(s.flowers || {});
  for (const d of s.queen?.drops || [])
    add(d.task, "queen", t("kind_queen"), "amber", `${fillIn("drop_ask", {blocker: d.blocker})}: ${d.reason}`,
        [button(t("drop_yes"), `data-drop="${esc(d.task)}" data-blocker="${esc(d.blocker)}"`, true)]);
  for (const [task, mark] of marks) {
    if (mark.status?.state !== "stuck" || working.has(task) || !open[task] || done(task)) continue;
    const back = ["Blocked", "Needs info"].includes(open[task].column) && !open[task].by_hand;
    add(task, "stuck", t("state_stuck"), "red", statusText(mark.status), back ? [button(t("send_back"), `data-back-open="${esc(task)}"`, true)] : []);
  }
  for (const q of s.queen?.questions || []) {
    if (done(q.task)) continue;
    add(q.task, "queen", t("kind_queen"), "amber", q.question, [button(t("ask_didban"), `data-fly="didban" data-focus="${esc(open[q.task]?.project || repoOf(q.task))}"`, true)]);
  }
  for (const [task, mark] of marks) {
    if (!mark.yours || done(task)) continue;
    const on = mark.status?.wait?.on;
    const line = mark.status?.why ? statusText(mark.status) : fillIn("wait_on", {what: t(on === "yes" ? "wait_yes" : on === "unknown" ? "wait_unknown" : "wait_decision")});
    if (on === "yes") add(task, "approval", tr("Your approval"), "amber", line, [button(t("approve"), `data-approve-open="${esc(task)}"`, true)]);
    else if (on === "check" || on === "blocker") add(task, "decision", t(`kind_${on}`), "amber", line, []);
    else add(task, "decision", t("waits_for_you"), "amber", line, [button(t("ask_didban"), `data-fly="didban" data-focus="${esc(open[task]?.project || repoOf(task))}"`)]);
  }
  for (const [task, entry] of Object.entries(open)) {
    if (entry.column === "Needs split" && splitsMine(entry.project))
      add(task, "split", tr("Needs split"), "amber", t("split_waits"), [button(t("approve_split"), `data-approve-open="${esc(task)}"`, true)]);
    else if (entry.yours && !done(task))
      add(task, "by_hand", t("by_hand_yours"), "amber", t("by_hand_hint"), [button(t("open_flight"), `data-fly="${esc(task)}"`, true)]);
  }
  const number = item => Number(item.task.split("#")[1]);
  return [...items.values()].sort((a, b) => a.stuck - b.stuck || a.rank - b.rank || a.order - b.order || number(a) - number(b));
}

function taskMarks(item) {
  const {size, door, sent_back: back, slice, questions} = item.mark || {};
  return [size ? tr(size) : null, door && door !== "two-way" ? tr(door) : null, back ? t("mark_sent_back") : null,
          slice ? t("mark_slice") : null, questions ? fillIn(questions === 1 ? "mark_question" : "mark_questions", {n: num(questions)}) : null,
          item.by_hand && !item.yours ? t("by_hand") : null].filter(Boolean);
}

function statusText(status) {
  const detail = !status.detail ? null : status.why === "review_blockers" ? num(Number(status.detail))
    : status.detail.split("; ").map(tr).join(lang === "fa" ? "؛ " : "; ");
  const sentence = t(`status_${status.why || status.state}`);
  return sentence.includes("{detail}") ? sentence.replace("{detail}", detail || t("status_no_detail")) : detail ? `${sentence} (${detail})` : sentence;
}

// A task's sheet: from the bottom on a phone, centred on a wide screen. It tells the task's story, its phases, links,
// what it does, the queen's question, the proposed slices and its steps so far, and its footer says what waits and
// offers the actions Kandu has for its state. Every place that opens a task opens this sheet.
const PHASES = ["sizing", "implement", "review", "merge", "deploy", "live check"];
const QUIET_STEPS = ["notification_sent", "notification_failed"];  // they tell the user, not the task's story

// The phases a task walked, then those still to come; the one it is in now is marked: a worker's phase, the merge
// while its PR waits or was approved, its last review while in review. A stuck task stays at the phase it stopped
// in. A task waiting its turn is in none yet, and a done one has walked them all.
function taskPhases(item, worker, steps) {
  const kind = phase => /^(review round|fix round|update$|queen's|sizing notes$)/.test(phase) ? "review" : phase;
  const walked = [];
  for (const step of steps) if (step.type === "phase_changed" && step.phase && walked.at(-1) !== step.phase) walked.push(step.phase);
  const column = item?.column, last = walked.at(-1) || null;
  if (column === "Done") return (walked.length ? walked : PHASES).map(name => ({name, label: tr(name), at: "done"}));
  const now = worker?.phase || (["Your approval", "Approved"].includes(column) ? "merge"
    : column === "In review" ? (kind(last || "") === "review" ? last : "review")
    : ["In progress", "Blocked", "Stuck"].includes(column) ? last || (column === "In progress" ? "implement" : null) : null);
  const list = now && walked.at(-1) !== now ? [...walked, now] : walked;
  const furthest = Math.max(-1, ...list.map(name => PHASES.indexOf(kind(name))));
  return [...list.map((name, i) => ({name, at: now && i === list.length - 1 ? "now" : "done"})),
          ...PHASES.slice(furthest + 1).map(name => ({name, at: "next"}))].map(p => ({...p, label: tr(p.name)}));
}

// One step of the task's story: what happened, when, and its detail.
function stepOf(e) {
  const named = text => lang === "en" ? text.replace(/_/g, " ").replace(/^./, c => c.toUpperCase()) : tr(text);
  const title = e.type === "phase_changed" && e.phase ? (lang === "en" ? named(e.phase) : tr(e.phase)) : named(e.type);
  const detail = [e.round ? fillIn("step_round", {n: num(e.round)}) : null, typeof e.blockers === "number" ? fillIn("step_blockers", {n: num(e.blockers)}) : null,
                  e.size ? tr(e.size) : null, e.door ? tr(e.door) : null, e.role ? tr(e.role) : null,
                  e.duration_ms ? fillIn("so_far_min", {n: num(Math.max(1, Math.round(e.duration_ms / 60000)))}) : null,
                  ...[e.action, e.decision, e.reason, e.outcome].filter(Boolean).map(tr)].filter(Boolean);
  return {title, time: when(e.ts), text: detail.join(" · ")};
}

// What the sheet shows of a task, from the state, the queue and what the API says of it: its PR and reviews, its
// issue and steps, and the split proposed for it.
function sheetView(task, s, queue, {review, info, proposal}) {
  const item = fields(s, queue).flatMap(patch => patch.tasks.map(entry => ({...entry, project: patch.name}))).find(entry => entry.task === task);
  const wait = waitItems(s, queue).find(entry => entry.task === task);
  const worker = (s.workers || []).find(w => w.task === task) || null;
  const steps = (info?.steps || []).filter(e => !QUIET_STEPS.includes(e.type));
  const body = info?.issue?.body || "";
  const goal = body.match(/^##\s*Goal\s*\n([\s\S]*?)(?=\n##\s|$)/m)?.[1].trim() || body.split(/\n\s*\n/)[0].trim();
  const status = s.flowers?.[task]?.status || null;
  const stuck = item && (["Stuck", "Blocked"].includes(item.column) || status?.state === "stuck") && !worker;
  const [repo, number] = task.split("#");
  return {task, item: item || null, worker, status, review: review || null, proposal: proposal || null, info: info || null,
          number: numberOf(task), project: item?.project || repoOf(task), title: item?.title || review?.pr?.title || repoOf(task),
          meta: [item?.project || repoOf(task), ...(item ? taskMarks(item) : [])].join(" · "),
          state: wait && !wait.stuck ? wait.kind : item ? (item.column === "waiting" ? t("waiting_machine") : stateText(item)) : "",
          tone: stuck ? "red" : wait ? "amber" : "honey",
          phases: taskPhases(item, worker, steps),
          links: {pr: review?.pr?.url || null, issue: item?.url || `https://github.com/${repo}/issues/${number}`,
                  run: worker?.run_id || steps.filter(e => e.run_id).at(-1)?.run_id || null},
          what: goal, question: (s.queen?.questions || []).find(q => q.task === task)?.question || null,
          drop: (s.queen?.drops || []).find(d => d.task === task) || null,
          steps: steps.map(stepOf), wait: wait || null, language: s.language, yours: Boolean(item?.yours || s.flowers?.[task]?.yours)};
}

function sheetBody(v) {
  const link = (url, label) => url ? `<a class="textlink" href="${esc(url)}" target="_blank" rel="noopener">${label} ↗</a>` : "";
  const phases = v.phases.map(p => `<div class="phase ${p.at}"><i class="hex"></i><span>${esc(p.label)}</span></div>`).join("");
  const status = v.status ? `<div class="status-line ${esc(v.status.state)}"><span class="badge">${esc(t(`state_${v.status.state}`))}</span><span dir="auto">${esc(statusText(v.status)
    + (v.status.tries ? " " + fillIn("status_tries", {this: num(v.status.tries.this), of: num(v.status.tries.of)}) : ""))}</span></div>
    ${v.status.cleaned ? `<p class="muted" dir="auto">${esc(t("cleaned_folder"))}: ${esc(tr(v.status.cleaned))}</p>` : ""}` : "";
  // The user's language, also one the page has no text for. The English is what reaches the issue.
  const own = v.proposal && (lang === "en" && TEXT[v.language] ? null : v.proposal.user_text);
  const slices = v.proposal ? `<div class="sheet-box"><div class="sheet-box-head">${t("proposed_slices")}</div><div dir="auto">${esc(own?.reason || v.proposal.reason)}</div>
    ${v.proposal.slices.map((slice, i) => `<details class="round"><summary>${num(i + 1)}. <span dir="auto">${esc(own?.slices[i].title || slice.title)}</span></summary><div class="round-body">
    <div class="chips"><span class="chip">${esc(tr(slice.size))}</span><span class="chip">${num(slice.files)} ${t("files_touched")}</span><span class="chip">${esc(tr(slice.door))}</span></div>
    <div class="slice-body" dir="auto">${esc(own?.slices[i].body || slice.body)}</div></div></details>`).join("")}
    ${own ? `<details class="round"><summary>${t("english_text")}</summary><div class="round-body">${v.proposal.slices.map((slice, i) =>
      `<div><b dir="ltr">${num(i + 1)}. ${esc(slice.title)}</b><div class="slice-body" dir="ltr">${esc(slice.body)}</div></div>`).join("")}</div></details>` : ""}
    <p class="muted">${t("split_decline_hint")}</p></div>` : "";
  const counted = tokens => tokens.total - tokens.cache_read;  // as the daily limit counts them
  const cost = v.item?.column === "Done" && v.info?.cost ? `<div class="chips">${v.info.outcome ? `<span class="chip">${esc(tr(v.info.outcome))}</span>` : ""}<span class="chip">${t("cost_tokens")}: ${num(counted(v.info.cost.total))}</span></div>
    <details class="round"><summary>${t("task_full_issue")}</summary><div class="round-body">${doneBox(v.info)}</div></details>` : "";
  const r = v.review;
  const pr = r?.pr ? `<span class="chip">${esc(tr(r.pr.state))}</span>` : `<span class="muted">${t("no_pr")}</span>`;
  const yours = v.yours && v.state !== t("waits_for_you") ? `<span class="badge" style="--c:#e8590c">${t("waits_for_you")}</span>` : "";
  const lines = [...(r ? heldLines({waited: r.waited}, r.blockers) : heldLines(v.item?.mark, v.item?.blockers)), ...keptLines(r?.kept)];
  const steps = v.steps.map((step, i) => `<div class="step${i === v.steps.length - 1 ? " last" : ""}"><i class="hex"></i><div><div class="step-head"><b dir="auto">${esc(step.title)}</b><time>${esc(step.time)}</time></div>
    ${step.text ? `<div class="step-text" dir="auto">${esc(step.text)}</div>` : ""}</div></div>`).join("");
  return `<div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head"><div class="sheet-hex ${v.tone}">${v.number}</div><div class="sheet-who"><div class="muted" dir="auto">${esc(v.meta)}</div><h2 dir="auto">${esc(v.title)}</h2></div>
    <button class="sheet-close" data-close-sheet aria-label="${esc(t("close"))}">✕</button></div>
    <div class="phases" style="--n:${v.phases.length}">${phases}</div>
    <div class="sheet-state"><b class="tone-${v.tone === "honey" ? "ink" : v.tone}">${esc(v.state)}</b>${pr}${yours}<span class="spacer"></span>${link(v.links.pr, t("task_pr"))}${link(v.links.issue, t("task_issue"))}
    ${v.links.run ? `<button class="textlink" data-run="${esc(v.links.run)}">${t("task_run_log")}</button>` : ""}</div>
    ${status}${v.what ? `<div class="sheet-what slice-body" dir="auto">${esc(v.what)}</div>` : ""}
    ${v.question ? `<div class="sheet-box"><div class="sheet-box-head tone-amber">${t("kind_queen")}</div><div class="sheet-question" dir="auto">${esc(v.question)}</div></div>` : ""}
    ${slices}${byHandBox(v.item)}${cost}${lines.map(line => `<p class="muted" dir="auto">${esc(line)}</p>`).join("")}
    <div class="sheet-section"><b>${t("task_steps")}</b><div class="steps">${steps || `<div class="muted">${t("no_steps")}</div>`}</div></div>
    ${r?.rounds?.length ? `<div class="sheet-section">${r.rounds.slice().reverse().map((round, i) => roundBox(round, i === 0)).join("")}</div>` : ""}`;
}

// The footer: what waits, if anything, and the actions Kandu has for the task's state; with none, its page on GitHub.
function sheetFoot(v) {
  const notes = v.status?.wait ? waitLines(v.status.wait) : v.wait ? [esc(v.wait.line)] : [];
  const tone = v.tone === "honey" ? "amber" : v.tone;
  const project = v.item?.project || repoOf(v.task);
  const flight = `<span id="taskflight" class="flightbox">${flightControls(flights.open.find(f => f.task === v.task), v.task, t("open_flight"))}</span>`;
  const actions = [
    v.review?.pr ? testsView(v.task, v.review.pr) : "",
    v.review?.pr ? approval(v.task, v.review.pr, v.review.holds) : "",
    v.proposal ? splitAccept(v.task, v.proposal) : "",
    sendBack(v.task, v.item),
    v.status?.why === "internal_error" ? `<button class="btn" data-to-queen="${esc(v.task)}" title="${esc(t("to_queen_hint"))}">${t("to_queen")}</button>` : "",
    v.drop ? `<button class="btn primary" data-drop="${esc(v.task)}" data-blocker="${esc(v.drop.blocker)}">${t("drop_yes")}</button>` : "",
    v.question ? `<button class="btn" data-fly="didban" data-focus="${esc(project)}">${t("ask_didban")}</button>` : "",
    flight,
    v.worker?.run_id ? `<button class="btn danger" data-stop="${esc(v.worker.run_id)}">${t("stop_bee")}</button>` : "",
  ].filter(Boolean);
  const github = v.links.pr || v.links.issue;
  if (actions.every(a => a === flight || a.startsWith("<p"))) actions.push(`<a class="btn" href="${esc(github)}" target="_blank" rel="noopener">${t("open_github")} ↗</a>`);
  return `${notes.length ? `<div class="sheet-note tone-${tone}">${notes.map(line => `<div dir="auto">${line}</div>`).join("")}</div>` : ""}<div class="actions">${actions.join("")}</div>`;
}

async function showTask(task) {
  shownTask = task;
  markView();
  const [repo, number] = task.split("#");
  const item = queued(task);
  const [review, proposal, info] = await Promise.all([get(`/reviews/${repo}/${number}`).catch(() => null),
    item?.column === "Needs split" ? get(`/splits/${repo}/${number}`).then(s => s.split).catch(() => null) : null,
    get(`/tasks/${repo}/${number}`).catch(() => null)]);
  if (shownTask !== task) return;
  const view = sheetView(task, lastState || {}, lastQueue, {review, info, proposal});
  $("sheetbody").innerHTML = sheetBody(view);
  $("sheetfoot").innerHTML = sheetFoot(view);
  if (!$("sheet").open) { $("sheet").showModal(); $("sheetbody").scrollTop = 0; }
}

document.addEventListener("click", e => {
  const hit = name => e.target.closest(`[data-${name}]`);
  { const tg = hit("tg-send") || hit("tg-use") || hit("tg-find") || hit("tg-test"); if (tg) { tgConnect(tg); return; } }
  const yes = hit("approve"), run = hit("run"), stop = hit("stop"), tabButton = hit("tab"), pause = hit("pause"), acceptSplit = hit("split");
  if (hit("close")) { $("modal").close(); return; }
  if (hit("choose-look")) { pickLook(hit("choose-look")); return; }
  if (e.target === $("lookmenu")) { $("lookmenu").close(); return; }
  if (hit("close-sheet")) { $("sheet").close(); return; }
  if (hit("test-again")) { testAgain(hit("test-again")); return; }
  if (hit("settings-open")) { e.preventDefault(); openSettings(hit("settings-open").dataset.settingsOpen); return; }  // A name in a summary would fold it.
  if (hit("draft") && hit("draft").tagName === "BUTTON") { changeDraft(hit("draft")); return; }
  if (hit("set-save") || hit("set-yes")) { saveSettings(hit("set-save") || hit("set-yes")); return; }
  if (hit("set-no")) { setEdit.asking = false; drawSettings(); return; }
  if (hit("set-cancel")) { $("setsheet").close(); return; }
  if (hit("fly")) { openFlight(hit("fly")); return; }
  if (hit("inspect")) { saveInspect(hit("inspect")); return; }
  if (hit("remove")) { removeProject(hit("remove")); return; }
  if (hit("step")) { changeStep(hit("step")); return; }
  if (hit("land")) { act(hit("land"), `/flights/${encodeURIComponent(hit("land").dataset.land)}/close`).then(() => refreshFlights()).catch(() => {}); return; }
  if (hit("limits")) { changeLimits(hit("limits")); return; }
  if (hit("parallel")) { changeParallel(hit("parallel")); return; }
  if (hit("backup")) { changeBackup(hit("backup")); return; }
  if (hit("run-tmp")) { changeRunTmp(hit("run-tmp")); return; }
  if (hit("release")) { showRelease(); return; }
  if (hit("upstream-check")) { act(hit("upstream-check"), "/upstream/check").then(() => refreshState()).catch(() => {}); return; }
  if (hit("upstream-bring")) { act(hit("upstream-bring"), "/upstream/bring-in").then(answer => { if (answer) toast(t(answer.created ? "upstream_task_made" : "upstream_task_there")); return refreshState(); }).catch(() => {}); return; }
  if (hit("requests")) { act(hit("requests"), `/requests?enabled=${hit("requests").dataset.requests}`).then(() => refreshState()).catch(() => {}); return; }
  if (hit("drops")) { act(hit("drops"), `/drop-blockers?enabled=${hit("drops").dataset.drops}`).then(() => refreshState()).catch(() => {}); return; }
  if (hit("drop")) { dropBlocker(hit("drop")); return; }
  if (hit("sure") || hit("unsure")) { confirming = Boolean(hit("sure")); sendingBack = false; showTask(shownTask); return; }
  if (hit("back-sure")) { sendingBack = true; confirming = false; showTask(shownTask); return; }
  if (hit("back")) { doSendBack(hit("back")); return; }
  if (hit("to-queen")) { toQueen(hit("to-queen")); return; }
  if (hit("brief")) { briefOpen = !briefOpen; renderQueen(lastState); return; }
  if (pause) {  // It sits in the project's summary, which would fold.
    e.preventDefault();
    act(pause, `/projects/${encodeURIComponent(pause.dataset.pause)}/${pause.dataset.paused === "true" ? "resume" : "pause"}`);
    return;
  }
  if (yes) { approve(yes); return; }
  if (acceptSplit) { approveSplit(acceptSplit); return; }
  if (tabButton) { showTab(tabButton.dataset.tab); return; }
  if (stop) { act(stop, `/workers/${encodeURIComponent(stop.dataset.stop)}/stop`); return; }
  if (run) { showRun(run.dataset.run); return; }
  const review = hit("review");
  if (review) { confirming = false; sendingBack = false; showTask(review.dataset.review); }
  if (e.target === $("modal")) $("modal").close();
  if (e.target === $("sheet")) $("sheet").close();
  if (e.target === $("setsheet")) $("setsheet").close();
});
document.addEventListener("input", e => {
  if (setEdit && e.target.matches?.("input[data-draft]")) changeDraft(e.target);
});
document.addEventListener("change", e => {
  if (e.target.matches?.("[data-setting-pause], [data-setting-splits], [data-setting-one-way], [data-setting-watch-main], [data-setting-auto-merge], [data-setting-frozen], [data-setting-multi-user], [data-setting-tokens]")) changeSetting(e.target);
  if (e.target.matches?.("[data-clean-merged]")) changeCleanMerged(e.target);
  if (e.target.matches?.("[data-reference-copy]")) changeReferenceCopy(e.target);
  if (e.target.matches?.("[data-default-look]")) changeDefaultLook(e.target);
  if (e.target.matches?.("[data-refining-way]")) changeRefiningWay(e.target);
  if (e.target.matches?.("[data-notify-kind]")) changeNotify(e.target);
  if (e.target.matches?.("[data-tg-buttons]")) changeTgButtons(e.target);
});
document.addEventListener("toggle", e => {
  const asked = e.target.dataset?.request;
  if (asked !== undefined) { if (e.target.open) openRequests.add(asked); else openRequests.delete(asked); return; }
  const name = e.target.dataset?.project;
  if (name === undefined || $("search").value.trim()) return;
  if (e.target.open) closed.delete(name); else closed.add(name);
  save(CLOSED_KEY, JSON.stringify([...closed]));
}, true);
// Every view has its own address: its tab, then what is open over it, as task/<owner>/<repo>/<number>, project/<name>
// and run/<id>. Opening or closing a view adds it to the browser's history, so a reload, Back and Forward and a copied
// link open the same view, in any look; the look and the language stay each browser's own. The Classic looks' first two
// tabs go by Kandu Clean's names, so one address opens the same page in all three.
const TAB_ADDRESS = {meadow: "today", work: "tasks"};
function viewAddress() {
  const parts = [TAB_ADDRESS[tab] || tab];
  if (shownTask) parts.push("task", ...shownTask.replace("#", "/").split("/"));
  if (setEdit) parts.push("project", setEdit.name);
  if (shownRun) parts.push("run", shownRun);
  return "/" + parts.map(encodeURIComponent).join("/");
}
function readAddress(path) {
  const parts = path.split("/").filter(Boolean).map(part => { try { return decodeURIComponent(part); } catch { return part; } });
  const view = {tab: parts.shift() || null, task: null, project: null, run: null, lost: false};
  while (parts.length && !view.lost) {
    const kind = parts.shift();
    if (kind === "task" && parts.length >= 3 && /^\d+$/.test(parts[2])) view.task = `${parts.shift()}/${parts.shift()}#${parts.shift()}`;
    else if (kind === "project" && parts.length) view.project = parts.shift();
    else if (kind === "run" && parts.length) view.run = parts.shift();
    else view.lost = true;
  }
  return view;
}
// A view the user opens goes into the history; one opened from the address is already there.
function markView() {
  if (markView.held) return;
  const address = viewAddress();
  if (address !== location.pathname) history.pushState(null, "", address);
}
const until = async (ready, most) => { for (let waited = 0; !ready() && waited < most; waited += 100) await new Promise(r => setTimeout(r, 100)); };
// Opens the view the address names. What Kandu no longer knows opens the first page with a short note.
async function openAddress() {
  const view = readAddress(location.pathname), turn = openAddress.turn = (openAddress.turn || 0) + 1;
  markView.held = true;
  try {
    showTab(view.tab || tab);
    let lost = view.lost || Boolean(view.tab) && (TAB_ADDRESS[view.tab] || view.tab) !== (TAB_ADDRESS[tab] || tab);
    if (!view.run && shownRun) { shownRun = null; $("modal").close(); }
    if (!view.project && setEdit) { setEdit = null; $("setsheet").close(); }
    if (!view.task && shownTask) { shownTask = null; $("sheet").close(); }
    if (!lost && (view.task || view.project || view.run)) {
      await until(() => lastState, 15000);
      if (view.task && view.task !== shownTask) {
        await until(() => lastQueue, 5000);
        const [repo, number] = view.task.split("#");
        const info = queued(view.task) ? {} : await get(`/tasks/${repo}/${number}`).catch(() => null);
        if (turn !== openAddress.turn) return;
        lost = !info || !queued(view.task) && !info.issue && !info.steps?.length;
        if (!lost) { confirming = sendingBack = false; await showTask(view.task).catch(() => {}); }
      }
      if (!lost && view.project && view.project !== setEdit?.name) {
        lost = !(lastState?.project_settings || []).some(p => p.name === view.project);
        if (!lost) openSettings(view.project);
      }
      if (!lost && view.run && view.run !== shownRun) {
        lost = !await get("/runs/" + encodeURIComponent(view.run)).catch(() => null);
        if (turn !== openAddress.turn) return;
        if (!lost) await showRun(view.run).catch(() => {});
      }
    }
    if (turn !== openAddress.turn) return;
    if (lost) {
      shownRun = shownTask = setEdit = null;
      for (const box of ["modal", "setsheet", "sheet"]) if ($(box).open) $(box).close();
      showTab("today");
      toast(t("view_not_found"));
    }
    history.replaceState(null, "", viewAddress());
  } finally {
    if (turn === openAddress.turn) markView.held = false;
  }
}
addEventListener("popstate", () => { openAddress(); });
$("modal").addEventListener("close", () => { shownRun = null; markView(); });
$("sheet").addEventListener("close", () => { shownTask = null; confirming = sendingBack = false; markView(); });
$("setsheet").addEventListener("close", () => { setEdit = null; markView(); });
$("upgraderead").onclick = async e => {
  if (await act(e.currentTarget, "/upgrade/read?version=" + encodeURIComponent($("upgrade").dataset.read))) $("upgrade").hidden = true;
};
$("stop").onclick = e => act(e.currentTarget, "/stop");
$("resume").onclick = e => act(e.currentTarget, "/resume");
$("restart").onclick = e => act(e.currentTarget, "/restart");
$("releasenow").onclick = e => cutRelease(e.currentTarget);

// The Look menu lists every look the dashboard has, from the state, and marks the one this page is. A page that has
// not read the state yet knows the two it came with. A choice is kept in this browser's cookie.
const LOOK_NAMES = ["classic", "classic-new", "clean"];
const LOOK_HERE = "classic";  // the look this page is
function lookItems(looks, current) {
  return (looks?.length ? looks : LOOK_NAMES).map(look => `<button class="menu-item" data-choose-look="${esc(look)}" aria-current="${look === current}"><span>${esc(TEXT[lang][`default_look_${look}`] || look)}</span>${look === current ? '<small aria-hidden="true">✓</small>' : ""}</button>`).join("");
}

function openLooks() {
  $("lookitems").innerHTML = lookItems(lastState?.looks, LOOK_HERE);
  $("lookmenu").showModal();
}

function pickLook(button) {
  $("lookmenu").close();
  if (button.dataset.chooseLook !== LOOK_HERE) chooseLook(button.dataset.chooseLook);
}

// Adding a project: a few facts from the user, the rest read from the copy and shown before anything is written.
const fillIn = (key, values) => Object.entries(values).reduce((text, [k, v]) => text.replaceAll(`{${k}}`, v), t(key));

function machineOptions(chosen) {
  const machines = lastState?.machines || [];
  $("addmachine").innerHTML = machines.map(m => `<option value="${esc(m.name)}">${esc(m.name)}</option>`).join("")
    + `<option value="">${esc(t("new_machine"))}</option>`;
  if (chosen !== undefined) $("addmachine").value = chosen;
  $("newmachine").hidden = $("addmachine").value !== "";
}

function openAdd() {
  machineOptions();
  $("proposal").hidden = true;
  $("addresult").innerHTML = "";
  $("addbox").showModal();
}

async function addMachine(button) {
  const query = new URLSearchParams({name: $("mname").value, ssh: $("mssh").value, always_on: $("malways").checked});
  const result = await act(button, `/machines?${query}`);
  if (!result) return;
  toast(t(result.reachable ? "machine_reachable" : "machine_unreachable"));
  await refreshState();
  machineOptions(result.machine);
}

async function detectProject(button) {
  const query = new URLSearchParams({machine: $("addmachine").value, path: $("addpath").value, repo: $("addrepo").value});
  const found = await act(button, `/projects/detect?${query}`);
  if (!found) return;
  const p = found.proposal;
  for (const input of $("proposal").querySelectorAll("[data-f]")) {
    if (input.type === "checkbox") input.checked = Boolean(p[input.dataset.f]);
    else input.value = p[input.dataset.f] ?? "";
  }
  $("addrepo").value = p.repo;
  $("addpath").value = p.path;
  $("proposalnote").textContent = fillIn("proposal_note", {repo: p.repo, copy: tr(found.copy), board: tr(found.board)});
  $("proposalwarnings").innerHTML = (found.warnings || []).map(w => `<li class="warn" dir="ltr">${esc(w)}</li>`).join("");
  $("proposal").hidden = false;
  $("addresult").innerHTML = "";
}

async function addProject(button) {
  const query = new URLSearchParams({machine: $("addmachine").value, path: $("addpath").value, repo: $("addrepo").value});
  for (const input of $("proposal").querySelectorAll("[data-f]")) query.set(input.dataset.f, input.type === "checkbox" ? input.checked : input.value);
  const result = await act(button, `/projects?${query}`);
  if (!result) return;
  const made = (url, key) => !url ? "" : url.startsWith("http")
    ? `<p><a class="textlink" href="${esc(url)}" target="_blank" rel="noopener">${esc(t(key))} ↗</a></p>`
    : `<p class="muted" dir="ltr">${esc(url)}</p>`;
  $("proposal").hidden = true;
  $("addresult").innerHTML = `<p>${esc(fillIn("project_added_msg", {name: result.project, board: result.board.number}))}</p>`
    + made(result.test_task, "test_task_made") + made(result.deploy_task, "deploy_task_made")
    + `<ul class="add-checks">${result.checks.map(c => `<li class="${esc(c.level)}" dir="ltr">${esc(c.level)} · ${esc(c.text)}</li>`).join("")}</ul>`;
}

$("addopen").onclick = openAdd;
$("addmachine").onchange = () => machineOptions($("addmachine").value);
$("maddbtn").onclick = e => addMachine(e.currentTarget);
$("detectbtn").onclick = e => detectProject(e.currentTarget);
$("addbtn").onclick = e => addProject(e.currentTarget);
$("addform").onsubmit = e => e.preventDefault();
document.querySelector("[data-addclose]").onclick = () => $("addbox").close();
$("wake").onclick = e => act(e.currentTarget, "/wake");
$("reload").onclick = e => busy(e.currentTarget, () => refreshQueue(lastState, true));
$("day").onchange = refreshDays;
$("usagerange").onchange = () => refreshUsage().catch(() => {});
$("usagefrom").onchange = $("usageto").onchange = () => refreshUsage().catch(() => {});
$("search").oninput = renderProjects;
$("lang").onclick = () => setLanguage(lang === "fa" ? "en" : "fa");
$("look").onclick = openLooks;
addEventListener("resize", () => { if (lastState) renderScene(lastState, lastQueue); });

// The reads a tab needs of its own, only while it shows; it reads them again when it is opened.
async function refreshShown() {
  if (tab === "days") await refreshDays();
  if (tab === "bazras") await refreshBazras();
}

async function refresh() {
  try { const s = await refreshState(); await refreshQueue(s); await refreshFlights(); await refreshShown(); }
  catch { toast(t("api_unreachable")); }
}
// A burst of stream events reads the state at most once every STATE_GAP: the first at once, the rest together once
// the gap has passed. The stream's own lines show at once.
const STATE_GAP = 5000, LIVE_EVERY = 30000, CALM_EVERY = 60000;
let stream = null, stateSoon = null;
function stateLater() {
  if (stateSoon) return;
  stateSoon = setTimeout(() => { stateSoon = null; refreshState().catch(() => {}); }, Math.max(0, stateReadAt + STATE_GAP - Date.now()));
}
function follow() {  // A page nobody is looking at asks for nothing, and catches up when it is seen again. A calm one never streams.
  if (document.hidden || calm) {
    stream?.close();
    stream = null;
  } else if (!stream) {
    stream = new EventSource("/api/v1/stream");
    stream.onmessage = m => {
      live = [JSON.parse(m.data), ...live].slice(0, LIVE_LINES);
      renderLive();
      stateLater();
    };
    loadLive().catch(() => {});
    refresh();
  }
}
function tick() {  // everything again every 30 seconds, or once a minute while calm
  clearTimeout(tick.timer);
  tick.timer = setTimeout(() => { if (!document.hidden) refresh(); tick(); }, calm ? CALM_EVERY : LIVE_EVERY);
}
function applyCalm() {
  document.documentElement.dataset.calm = calm ? "on" : "off";
  $("calm").setAttribute("aria-pressed", calm);
}
// Calm on: nothing moves, the stream closes and the state is read once a minute. Off brings both back.
function setCalm(on) {
  calm = on;
  save(CALM_KEY, on ? "on" : "off");
  applyCalm();
  sceneKey = null;
  if (lastState) { renderStats(lastState); drawTab(); }
  follow();
  tick();
}
$("calm").onclick = () => setCalm(!calm);
applyLanguage();
applyCalm();
openAddress();
renderLive();
document.addEventListener("visibilitychange", () => { follow(); if (calm && !document.hidden) refresh(); });
follow();
if (calm) refresh();
tick();
setInterval(() => { if (shownRun && !document.hidden && !calm) showRun(shownRun).catch(() => {}); }, 5000);
</script>
