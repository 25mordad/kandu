// Today: what waits for the user first, then each project's flight path, the queen's brief and today's events. All
// of it comes from the state and the queue the page already reads, and the events it already follows.

// A flight path's six stages, and the stage of each column as the page places a task: a PR that waits for a yes or
// was approved is at Merge, a task waiting for its machine is still Ready, and a stuck one stays where it stopped.
const STAGES = ["stage_shape", "stage_ready", "stage_build", "stage_review", "stage_merge", "stage_live"];
const STAGE_OF = {"Backlog": 0, "Technical debt": 0, "Needs info": 0, "Needs split": 0, "Ready": 1, "waiting": 1, "In progress": 2, "Blocked": 2, "In review": 3, "Your approval": 4, "Approved": 4, "Done": 5};
const DOTS_SHOWN = 3;
const HIVE_CELLS = 12;  // the hive shows at least this many cells, empty ones after the done tasks
const DOT_ORDER = ["stuck", "you", "bee", "turn"];  // the most urgent first, when a stage holds more than it shows
const WAIT_ORDER = ["approval", "queen", "decision", "split", "by_hand", "stuck"];
const EVENT_TONES = {red: ["loop_stopped", "machine_down", "machine_unreachable", "card_stuck", "backup_failed", "notification_failed", "upstream_check_failed"], amber: ["merge_held", "blocker_drop_asked", "task_held"], green: ["supervisor_woke", "user_approved", "queen_approved", "queen_accepted_split", "deployed", "machine_up", "backup_made"], blue: ["task_picked", "phase_changed", "review_finished", "run_finished", "task_sized", "notes_sized", "slice_created", "task_split"]};
let waitKey = null;  // the item of "Waits for you" in view, kept by its task while the list changes

// What waits for the user, each open task once: the queen's ask, a PR for their yes or decision, a split for them to
// accept, an open by-hand task, and a stuck task no worker is on. Needs first, then stuck, in the projects' order.
// Each offers the actions Kandu has for it, and opening its task.
function waitItems(s, queue) {
  const open = {};
  for (const [project, columns] of Object.entries(queue?.projects || {}))
    for (const [column, tasks] of Object.entries(columns)) for (const entry of tasks) open[entry.task] = {...entry, project, column};
  const done = task => open[task]?.column === "Done";
  const working = new Set((s.workers || []).map(w => w.task));
  const order = name => { const at = (s.project_order || []).indexOf(name); return at < 0 ? 1e9 : at; };
  const splitsMine = name => ((s.project_settings || []).find(p => p.name === name)?.split_approval || "user") === "user";
  const button = (label, attrs, primary = false) => ({label, attrs, primary});
  const items = new Map();
  const add = (task, kind, label, tone, line, actions) => {
    if (items.has(task)) return;
    const project = open[task]?.project || repoOf(task);
    items.set(task, {task, project, title: open[task]?.title || "", kind: label, tone, line, stuck: kind === "stuck",
                     order: WAIT_ORDER.indexOf(kind), rank: order(project), actions: [...actions, button(t("open"), `data-review="${esc(task)}"`)]});
  };
  const marks = Object.entries(s.flowers || {});
  for (const d of s.queen?.drops || [])
    add(d.task, "queen", t("kind_queen"), "amber", `${fillIn("drop_ask", {blocker: d.blocker})}: ${d.reason}`,
        [button(t("drop_yes"), `data-drop="${esc(d.task)}" data-blocker="${esc(d.blocker)}"`, true)]);
  for (const [task, mark] of marks) {
    if (mark.status?.state !== "stuck" || working.has(task) || !open[task] || done(task)) continue;
    const back = ["Blocked", "Needs info"].includes(open[task].column) && !open[task].by_hand;
    add(task, "stuck", t("state_stuck"), "red", statusText(mark.status), back ? [button(t("send_back"), `data-back-open="${esc(task)}"`, true)] : []);
  }
  for (const q of s.queen?.questions || []) {
    if (done(q.task)) continue;
    add(q.task, "queen", t("kind_queen"), "amber", q.question, [button(t("ask_didban"), `data-fly="didban" data-focus="${esc(open[q.task]?.project || repoOf(q.task))}"`, true)]);
  }
  for (const [task, mark] of marks) {
    if (!mark.yours || done(task)) continue;
    const on = mark.status?.wait?.on;
    const line = mark.status?.why ? statusText(mark.status) : fillIn("wait_on", {what: t(on === "yes" ? "wait_yes" : on === "unknown" ? "wait_unknown" : "wait_decision")});
    if (on === "yes") add(task, "approval", tr("Your approval"), "amber", line, [button(t("approve"), `data-approve-open="${esc(task)}"`, true)]);
    else if (on === "check" || on === "blocker") add(task, "decision", t(`kind_${on}`), "amber", line, []);
    else add(task, "decision", t("waits_for_you"), "amber", line, [button(t("ask_didban"), `data-fly="didban" data-focus="${esc(open[task]?.project || repoOf(task))}"`)]);
  }
  for (const [task, entry] of Object.entries(open)) {
    if (entry.column === "Needs split" && splitsMine(entry.project))
      add(task, "split", tr("Needs split"), "amber", t("split_waits"), [button(t("approve_split"), `data-approve-open="${esc(task)}"`, true)]);
    else if (entry.yours && !done(task))
      add(task, "by_hand", t("by_hand_yours"), "amber", t("by_hand_hint"), [button(t("open_flight"), `data-fly="${esc(task)}"`, true)]);
  }
  const number = item => Number(item.task.split("#")[1]);
  return [...items.values()].sort((a, b) => a.stuck - b.stuck || a.rank - b.rank || a.order - b.order || number(a) - number(b));
}

// One item of "Waits for you" in view, with its place and its neighbours, and the others below it; null when none.
// An item that went away leaves the first in its place.
function waitView(items, key) {
  if (!items.length) return null;
  const n = items.length, at = Math.max(0, items.findIndex(item => item.task === key));
  return {current: items[at], place: fillIn("wait_place", {at: num(at + 1), of: num(n)}), prev: items[(at - 1 + n) % n].task,
          next: items[(at + 1) % n].task, rest: items.filter((_, i) => i !== at)};
}

// Kandu's state at a glance: stopped; at a usage limit, with when it resets (when Kandu checks it again if `/usage`
// did not say); how many wait for the user and how many are stuck; asleep with the next wake; or all clear. While
// awake it says how many bees fly. At both limits it names the one that resets later: work waits for that one.
function todaySentence(s, items) {
  const usage = s.usage || {}, limits = s.limits || {};
  const wakes = !s.timer_on ? t("chip_timer_off") : s.next_wake ? fillIn("chip_wakes", {at: clock(s.next_wake)}) : "";
  if (s.stop_requested) return [{text: stopWord(s), tone: "red"}, {text: t(s.stopping ? "today_stopping" : "today_stopped")}];
  const over = ["session", "week"].filter(name => usage[name] >= limits[name]);
  if (over.length) {
    const resets = name => usage[`${name}_resets`] || "";
    const limit = over.reduce((a, b) => resets(b) && new Date(resets(b)) > new Date(resets(a) || 0) ? b : a);
    const again = resets(limit) ? [{text: fillIn("today_resets", {at: when(resets(limit))})}]
      : s.timer_on && s.next_wake ? [{text: fillIn("today_checks_again", {at: clock(s.next_wake)})}] : [];
    return [{text: t(`today_${limit}_limit`), tone: "amber"}, ...again];
  }
  const stuck = items.filter(item => item.stuck).length, waiting = items.length - stuck, bees = (s.workers || []).length;
  const lead = [...(waiting ? [{text: fillIn(waiting === 1 ? "lane_wait_one" : "lane_wait", {n: num(waiting)}), tone: "amber"}] : []),
                ...(stuck ? [{text: fillIn("lane_stuck", {n: num(stuck)}), tone: "red"}] : [])];
  const asleep = [{text: t("chip_asleep"), tone: lead.length ? undefined : "ink"}, ...(wakes ? [{text: wakes}] : [])];
  const flying = {text: fillIn(bees === 1 ? "today_bee_flying" : "today_bees_flying", {n: num(bees)})};
  if (s.supervisor !== "awake") return [...lead, ...asleep];
  return lead.length ? [...lead, flying] : [{text: t("today_all_clear"), tone: "ink"}, flying];
}

function sentenceHtml(parts) {
  return parts.map(p => p.tone ? `<b class="tone-${p.tone}">${esc(p.text)}</b>` : `<span>${esc(p.text)}</span>`).join('<span class="sep"> · </span>');
}

// The phone's health line: the state, each usage against its limit, the bees at work of the most, and each machine
// that does not answer. Each opens the page that explains it.
function healthItems(s) {
  const chip = stateChip(s), most = s.parallel?.total;
  return [
    {kind: "state", tone: {awake: "green", holding: "amber", refused: "amber", stopped: "red"}[chip.kind] || "muted", text: chip.long, tab: "activity"},
    {kind: "bar", name: t("session"), value: s.usage?.session ?? null, limit: s.limits.session, tab: "days"},
    {kind: "bar", name: t("week"), value: s.usage?.week ?? null, limit: s.limits.week, tab: "days"},
    ...(s.codex ? [{kind: "bar", name: t("codex_session"), value: s.codex.usage?.session ?? null, limit: s.codex.limits.session, tab: "days"},
                   {kind: "bar", name: t("codex_week"), value: s.codex.usage?.week ?? null, limit: s.codex.limits.week, tab: "days"}] : []),
    {kind: "bees", tone: "muted", text: fillIn("health_bees", {n: num((s.workers || []).length), most: most ? num(most) : "—"}), tab: "tasks"},
    ...(s.unreachable_machines || []).map(m => ({kind: "machine", tone: "red", text: fillIn("health_machine", {machine: m.machine, since: when(m.since)}), tab: "tasks"})),
  ];
}

function healthHtml(items) {
  return items.map(i => `<button class="hitem ${i.kind}" data-tab="${i.tab}">${i.kind === "bar" ? gauge(i.name, i.value, i.limit)
    : `<i class="hex tone-${i.tone}"></i><span dir="auto">${esc(i.text)}</span>`}</button>`).join("");
}

// What a task's dot says: stuck with no worker on it, it needs the user, a worker is on it, or it waits its turn.
function dotKind(item, working, waiting) {
  if (item.mark?.status?.state === "stuck" && !working.has(item.task)) return "stuck";
  if (waiting.has(item.task)) return "you";
  return working.has(item.task) ? "bee" : "turn";
}

// One lane per project, those that need attention first and paused ones last, faded. Each stage shows its most
// urgent tasks as dots, then how many more; Live shows how many are done.
function flightPaths(s, queue, items) {
  const working = new Set((s.workers || []).map(w => w.task));
  const waiting = new Set(items.filter(item => !item.stuck).map(item => item.task));
  const order = name => { const at = (s.project_order || []).indexOf(name); return at < 0 ? 1e9 : at; };
  return fields(s, queue).map(patch => {
    const dots = patch.tasks.map(item => ({task: item.task, title: item.title, stage: item.stage, kind: dotKind(item, working, waiting)}))
      .sort((a, b) => DOT_ORDER.indexOf(a.kind) - DOT_ORDER.indexOf(b.kind));
    const open = dots.filter(d => d.stage !== 5), count = kind => open.filter(d => d.kind === kind).length;
    const stages = STAGES.map((_, at) => {
      const here = dots.filter(d => d.stage === at);
      return at === 5 ? {dots: [], more: 0, done: here.length} : {dots: here.slice(0, DOTS_SHOWN), more: Math.max(0, here.length - DOTS_SHOWN), done: 0};
    });
    const stuck = count("stuck"), you = count("you"), bees = count("bee");
    const [tone, line] = patch.paused ? ["muted", t("project_on_pause")] : stuck ? ["red", fillIn("lane_stuck", {n: num(stuck)})]
      : patch.over ? ["red", t("over_limit")] : you ? ["amber", fillIn(you === 1 ? "lane_wait_one" : "lane_wait", {n: num(you)})]
      : bees ? ["ink", fillIn(bees === 1 ? "lane_bee_one" : "lane_bees", {n: num(bees)})]
      : ["muted", open.length ? fillIn("lane_quiet", {n: num(open.length)}) : t("lane_all_done")];
    return {name: patch.name, paused: patch.paused, tone, line, stages, attention: !patch.paused && Boolean(stuck || you || patch.over), order: order(patch.name)};
  }).sort((a, b) => a.paused - b.paused || b.attention - a.attention || a.order - b.order);
}

function pathsHtml(lanes, queue) {
  const head = `<div class="today-head"><b>${t("flight_paths")}</b><span class="muted">${esc(fillIn(lanes.length === 1 ? "projects_one" : "projects_many", {n: num(lanes.length)}))}</span></div>`;
  if (!queue) return `${head}<div class="muted">${t("reading_board")}</div>`;
  if (!lanes.length) return `${head}<div class="muted">${t("paths_empty")}</div>`;
  const dot = d => `<button class="pdot ${d.kind}" data-review="${esc(d.task)}" title="${esc(`${numberOf(d.task)} ${d.title}`)}" aria-label="${esc(`${numberOf(d.task)} ${d.title} · ${t("dot_" + d.kind)}`)}"></button>`;
  const stage = (st, at) => `<div class="stage">${at === 5 ? (st.done ? `<span class="pdone" title="${esc(fillIn("live_done", {n: num(st.done)}))}">${num(st.done)}</span>` : "")
    : st.dots.map(dot).join("") + (st.more ? `<span class="pmore">+${num(st.more)}</span>` : "")}</div>`;
  const lane = l => `<div class="lane${l.paused ? " off" : ""}"><div class="lane-head"><b>${bdi(l.name)}</b><span class="lane-line tone-${l.tone}">${esc(l.line)}</span></div>
    <div class="lane-track">${l.stages.map(stage).join("")}</div></div>`;
  const legend = ["you", "stuck", "bee", "turn"].map(kind => `<span><i class="pdot ${kind}"></i>${esc(t("dot_" + kind))}</span>`).join("");
  return `${head}<div class="stage-names">${STAGES.map(key => `<span>${t(key)}</span>`).join("")}</div>
    <div class="lanes">${lanes.map(lane).join("")}</div><div class="plegend">${legend}</div>`;
}

// The hive: the tasks done in the last days the queue keeps, each in a honey cell that names it on hover.
function hiveCells(queue) {
  return Object.entries(queue?.projects || {}).flatMap(([project, columns]) => (columns.Done || []).map(item => ({task: item.task, project, title: item.title})));
}

function hiveHtml(cells, days) {
  const full = cells.map(c => `<button class="cell full" data-review="${esc(c.task)}" title="${esc(`${c.project} · ${c.title}`)}">${numberOf(c.task)}</button>`);
  const free = '<span class="cell"></span>'.repeat(Math.max(0, HIVE_CELLS - cells.length));
  const count = days ? `<span class="muted">${esc(fillIn("done_in_hive", {count: num(cells.length), days: num(days)}))}</span>` : "";
  return `<div class="today-head"><b>${t("hive")}</b>${count}</div><div class="cells">${full.join("")}${free}</div>`;
}

// The queen's latest brief, with when she wrote it and the tokens that look cost.
function briefMeta(queen) {
  return `${when(queen.ts)} · ${fillIn("brief_tokens", {n: short(queen.tokens)})}`;
}

function briefHtml(queen) {
  if (!queen) return "";
  return `<div class="today-head"><b>${t("queen")}</b><span class="muted">${esc(briefMeta(queen))}</span></div><div class="brief" dir="auto">${esc(queen.brief)}</div>`;
}

// An event's colour says its kind: red a failure or a stop, amber what waits for the user, green what went well,
// blue work moving on, muted the rest.
function eventTone(e) {
  if (e.type === "task_finished") return e.outcome === "needs_info" ? "amber" : ["blocked", "sizing_failed", "failed", "deploy_failed", "live_check_failed"].includes(e.outcome) ? "red" : "green";
  if (e.type === "decision") return ["internal_error", "failed", "sizing_failed", "round_no_commit"].includes(e.decision) ? "red"
    : e.decision === "merge_waits" || (e.reason || "").startsWith("the user decides next") ? "amber" : "muted";
  if (e.type === "queen_decided") return e.action === "ask_user" ? "amber" : "muted";
  return Object.keys(EVENT_TONES).find(tone => EVENT_TONES[tone].includes(e.type)) || "muted";
}

function eventLine(e) {
  const name = lang === "en" ? e.type.replace(/_/g, " ").replace(/^./, c => c.toUpperCase()) : tr(e.type);
  const detail = [e.phase, e.decision, e.reason, e.outcome].filter(Boolean).map(tr).join(" · ");
  return [name, e.task ? `${repoOf(e.task)} ${numberOf(e.task)}` : "", detail].filter(Boolean).join(" · ");
}

// Today's events, newest first, by the browser's own day.
function todayEvents(events, now) {
  const day = now.toDateString();
  return events.filter(e => new Date(e.ts).toDateString() === day).sort((a, b) => new Date(b.ts) - new Date(a.ts));
}

function eventsHtml(events) {
  const rows = events.map(e => `<div class="event"${e.task ? ` data-review="${esc(e.task)}"` : ""}><time>${esc(clock(e.ts))}</time><i class="tone-${eventTone(e)}"></i><span dir="auto">${esc(eventLine(e))}</span></div>`).join("");
  return `<div class="today-head"><b>${t("today_events")}</b></div>${rows || `<div class="muted">${t("today_none")}</div>`}`;
}

// The arrows are mirrored by the browser in right-to-left text, so each points the way it goes in either language.
function waitsHtml(view) {
  const c = view.current;
  const where = item => `${bdi(item.project)} ${numberOf(item.task)}`;
  const head = `<div class="today-head"><b>${t("waits_for_you_count")}</b><span class="muted">${esc(view.place)}</span><span class="spacer"></span>
    <button class="btn step" data-wait-to="${esc(view.prev)}" aria-label="${esc(t("previous"))}">‹</button><button class="btn step" data-wait-to="${esc(view.next)}" aria-label="${esc(t("next"))}">›</button></div>`;
  const card = `<div class="wait-card"><div class="wait-kind"><i class="hex tone-${c.tone}"></i><b class="tone-${c.tone}">${esc(c.kind)}</b><span class="muted">${where(c)}</span></div>
    <div class="wait-title" dir="auto">${esc(c.title || repoOf(c.task))}</div><div class="wait-why" dir="auto">${esc(c.line)}</div>
    <div class="actions">${c.actions.map(a => `<button class="btn${a.primary ? " primary" : ""}" ${a.attrs}>${esc(a.label)}</button>`).join("")}</div></div>`;
  const rest = view.rest.map(i => `<button class="wait-row" data-wait-to="${esc(i.task)}"><i class="hex tone-${i.tone}"></i><span><b dir="auto">${esc(i.title || repoOf(i.task))}</b><small>${esc(i.kind)} · ${where(i)}</small></span><span aria-hidden="true">›</span></button>`).join("");
  return head + card + (rest ? `<div class="wait-rest">${rest}</div>` : "");
}

function renderToday() {
  if (!lastState || tab !== "today") return;
  const s = lastState, items = waitItems(s, lastQueue), view = waitView(items, waitKey);
  waitKey = view ? view.current.task : null;
  $("health").innerHTML = healthHtml(healthItems(s));
  $("waits").hidden = !view;
  $("waits").innerHTML = view ? waitsHtml(view) : "";
  $("hivebox").innerHTML = hiveHtml(hiveCells(lastQueue), lastQueue?.done_days);
  $("sentence").innerHTML = sentenceHtml(todaySentence(s, items));
  $("paths").innerHTML = pathsHtml(flightPaths(s, lastQueue, items), lastQueue);
  $("briefbox").hidden = !s.queen;
  $("briefbox").innerHTML = briefHtml(s.queen);
  $("todayevents").innerHTML = eventsHtml(todayEvents(live, new Date()));
}

// The frame: the header's chip and usage bars, Didban beside them, the count on Today, More, and Stop.

// After Stop, the bees at work finish their step: Kandu says it is stopping, and how many still work, then stopped.
function stopWord(s) {
  if (!s.stop_requested) return "";
  return s.stopping ? t(s.stopping === 1 ? "stopping_one" : "stopping_many").replace("{n}", num(s.stopping)) : t("chip_stopped");
}

// The header's chip: stopping or stopped, holding at a usage limit, awake or asleep, with the next wake; on a phone only awake
// or asleep. While GitHub refuses Kandu for a rate limit, it says so first. Why Kandu last slept shows on hover.
function stateChip(s) {
  const refused = githubRefused(s);
  const usage = s.usage || {}, limits = s.limits || {};
  const holding = usage.session >= limits.session || usage.week >= limits.week;
  const kind = s.stop_requested ? "stopped" : refused ? "refused" : holding ? "holding" : s.supervisor === "awake" ? "awake" : "asleep";
  const short = s.stop_requested ? stopWord(s) : t(s.supervisor === "awake" ? "chip_awake" : s.supervisor ? "chip_asleep" : "chip_never");
  const next = s.stop_requested ? "" : !s.timer_on ? t("chip_timer_off") : s.next_wake ? t("chip_wakes").replace("{at}", clock(s.next_wake)) : "";
  return {kind, short, long: [refused, holding && !s.stop_requested ? t("chip_holding") : short, next].filter(Boolean).join(" · ")};
}

// The usage bars in the wide header: each usage against its limit, amber at or over it.
function gauge(name, value, limit) {
  const known = value !== undefined && value !== null, over = known && value >= limit;
  return `<span class="gauge${over ? " over" : ""}" title="${esc(`${name} · ${t("limit")} ${pct(limit)}`)}"><span>${esc(name)} <b>${known ? pct(value) : "—"}</b></span>
    <span class="gbar" aria-hidden="true"><i style="width:${known ? Math.min(value, 100) : 0}%"></i><b style="inset-inline-start:${limit}%"></b></span></span>`;
}

function gauges(s) {
  const codex = s.codex ? gauge(t("codex_session"), s.codex.usage?.session, s.codex.limits.session) + gauge(t("codex_week"), s.codex.usage?.week, s.codex.limits.week) : "";
  return gauge(t("session"), s.usage?.session, s.limits.session) + gauge(t("week"), s.usage?.week, s.limits.week) + codex;
}

// Didban in the wide header: one button, marked while its session is open, when it goes to the session. More
// closes it.
function didbanHead(flight) {
  if (flight?.status === "opening") return `<button class="btn busy" disabled>${t("flight_opening")}</button>`;
  if (flight?.status === "open") return `<a class="btn didban open" href="${esc(flight.url)}" target="_blank" rel="noopener">${t("go_didban")} <i class="dot" aria-hidden="true"></i></a>`;
  return `<button class="btn didban" data-fly="didban">${t("open_didban")}</button>`;
}

// The count on Today in the phone's bar: what waits for the user.
function renderWaitCount(waiting) {
  $("waitcount").textContent = num(waiting);
  $("waitcount").hidden = !waiting;
}

// More: the actions Kandu has that the frame does not show. A wide header shows Wake the queen, Calm and Didban
// itself, so there More only closes an open Didban.
function moreItems(open, wide, quiet = false) {
  const item = (label, hint, attrs, href = "") => ({label, hint, attrs, href});
  const session = (kind, opener, go, close, hint) => {
    const flight = open.find(f => f.kind === kind);
    if (flight?.status === "opening") return [item(t("flight_opening"), "", "disabled")];
    if (flight?.status === "open") return [item(t(go), "", "", flight.url), item(t(close), t("hint_land"), `data-land="${esc(flight.key)}"`)];
    return [item(t(opener), t(hint), `data-fly="${kind}"`)];
  };
  const didban = session("didban", "open_didban", "go_didban", "close_didban", "hint_didban").filter(i => !wide || i.attrs.startsWith("data-land"));
  return [
    ...(wide ? [] : [item(t("wake_queen"), "", 'data-menu="wake"')]),
    item(t("read_board"), "", 'data-menu="reload"'),
    item(t("restart_kandu"), t("hint_restart"), 'data-menu="restart"'),
    ...didban,
    ...session("zanbourdar", "open_zanbourdar", "go_zanbourdar", "close_zanbourdar", "hint_zanbourdar"),
    item(t("tab_bazras"), t("hint_bazras"), 'data-tab="bazras"'),
    item(t("by_day"), t("hint_usage"), 'data-tab="days"'),
    item(t("live_stream"), t("hint_live"), 'data-tab="activity"'),
    ...(wide ? [] : [item(t("calm"), t("hint_calm"), `data-menu="calm" aria-pressed="${quiet}"`)]),
    item(t("look"), t("default_look_clean"), 'data-menu="look"'),
    item(t("other_language"), t("hint_language"), 'data-menu="lang"'),
  ];
}

function renderMore() {
  const wide = !matchMedia("(max-width: 760px)").matches;
  $("moreitems").innerHTML = moreItems(flights.open, wide, calm).map(i => (i.attrs === 'data-tab="bazras"' ? '<div class="menu-line"></div>' : "")
    + (i.href ? `<a class="menu-item" href="${esc(i.href)}" target="_blank" rel="noopener"><span>${esc(i.label)} ↗</span></a>`
      : `<button class="menu-item" ${i.attrs}${i.attrs === 'data-menu="lang"' ? ` lang="${lang === "fa" ? "en" : "fa"}"` : ""}><span>${esc(i.label)}</span>${i.hint ? `<small>${esc(i.hint)}</small>` : ""}</button>`)).join("");
}

function openMore() {
  renderMore();
  $("moremenu").showModal();
}

// The look: each browser keeps the one it chose in a cookie, so the dashboard sends that look's page. The Look button
// in the header, and Look in More, open the Look menu.
const LOOK_COOKIE = "kandu-look", LOOK_DAYS = 400;
function chooseLook(chosen) {
  document.cookie = `${LOOK_COOKIE}=${chosen}; path=/; max-age=${LOOK_DAYS * 86400}; samesite=strict`;
  location.reload();
}

// The Look menu lists every look the dashboard has, from the state, and marks the one this page is. A page that has
// not read the state yet knows the two it came with. A choice is kept in this browser's cookie.
const LOOK_NAMES = ["classic", "classic-new", "clean"];
const LOOK_HERE = "clean";  // the look this page is
function lookItems(looks, current) {
  return (looks?.length ? looks : LOOK_NAMES).map(look => `<button class="menu-item" data-choose-look="${esc(look)}" aria-current="${look === current}"><span>${esc(TEXT[lang][`default_look_${look}`] || look)}</span>${look === current ? '<small aria-hidden="true">✓</small>' : ""}</button>`).join("");
}

function openLooks() {
  $("lookitems").innerHTML = lookItems(lastState?.looks, LOOK_HERE);
  $("lookmenu").showModal();
}

function pickLook(button) {
  $("lookmenu").close();
  if (button.dataset.chooseLook !== LOOK_HERE) chooseLook(button.dataset.chooseLook);
}

// An action from More: the menu stays open while it works, then closes. Restart asks first.
async function chooseMore(button) {
  const what = button.dataset.menu;
  if (what === "look") { $("moremenu").close(); openLooks(); return; }
  if (what === "restart") { $("moremenu").close(); $("restartbox").showModal(); return; }
  if (what === "lang") { $("moremenu").close(); setLanguage(lang === "fa" ? "en" : "fa"); return; }
  if (what === "calm") { $("moremenu").close(); setCalm(!calm); return; }
  if (what === "wake") await act(button, "/wake");
  if (what === "reload") await busy(button, () => refreshQueue(lastState, true));
  $("moremenu").close();
}

// What Stop does, said before it is done: how many bees finish their step, that their work stays, and that
// nothing new starts.
function stopText(s) {
  const n = (s.workers || []).length;
  return `${n ? t(n === 1 ? "stop_one" : "stop_many").replace("{n}", num(n)) : t("stop_none")} ${t("stop_kept")}`;
}

function askStop() {
  $("stoptext").textContent = stopText(lastState || {});
  $("stopbox").showModal();
}

// Stop or restart, once the user said yes in its dialog: the dialog stays open while Kandu works, then closes, so
// a refusal's message shows.
async function confirmed(button, path, box) {
  await act(button, path);
  $(box).close();
}

async function refreshState() {
  stateReadAt = Date.now();
  const s = await get("/state");
  lastState = s;
  if (!saved(LANGUAGE_KEY) && TEXT[s.language] && s.language !== lang) setLanguage(s.language);  // The browser's choice wins.
  const chip = stateChip(s);
  $("pulse").className = `chip ${chip.kind}`;
  $("pulse").title = s.last_reason ? tr(s.last_reason) : "";
  $("state").textContent = chip.long;
  $("stateshort").textContent = chip.short;
  $("gauges").innerHTML = gauges(s);
  renderWaitCount(s.waits_for_you || 0);
  $("stop").hidden = s.stop_requested;
  $("resume").hidden = !s.stop_requested;
  $("machines").innerHTML = unreachableMachines(s);
  $("machines").hidden = !(s.unreachable_machines || []).length;
  const marked = Object.keys(s.over_limit || {}).sort().join();
  if (marked !== renderLegend.marked) { renderLegend.marked = marked; renderLegend(); }  // It explains the red while it shows.
  renderStats(s);
  renderBees(s);
  renderQueen(s);
  renderScene(s, lastQueue);
  renderToday();
  renderProjects();
  renderSettings(s);
  if (tab === "tasks") refreshRequests().catch(() => {});
  return s;
}

// The Tasks page: every task, found by its title or its number, in a group per project, those that need attention
// first. A group says its state as its lane on Today does, and folds; with many projects only those that need
// attention start open, until the user folds or opens one.
const FEW_PROJECTS = 4;

// What the user typed: a number when it is one ("#12", "12", "۱۲"), and words to find in a title otherwise.
function taskQuery(text) {
  const plain = String(text || "").replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).trim().toLowerCase();
  if (!plain) return null;
  const number = plain.match(/^#?(\d+)$/);
  return {text: plain, number: number ? Number(number[1]) : null};
}

function taskMatches(item, query) {
  if (!query) return true;
  return query.number === Number(item.task.split("#")[1]) || (item.title || "").toLowerCase().includes(query.text);
}

// The marks a task carries, from the local log, in words.
function taskMarks(item) {
  const {size, door, sent_back: back, slice, questions} = item.mark || {};
  return [size ? tr(size) : null, door && door !== "two-way" ? tr(door) : null, back ? t("mark_sent_back") : null,
          slice ? t("mark_slice") : null, questions ? fillIn(questions === 1 ? "mark_question" : "mark_questions", {n: num(questions)}) : null,
          item.by_hand && !item.yours ? t("by_hand") : null].filter(Boolean);
}

// A task's row: its state with a dot coloured as on Today, its number, its title, and its phase and marks. What
// waits for the user says what it waits for, as in "Waits for you", and comes first; the rest follow by state.
function taskRow(item, waits, workers) {
  const wait = waits.get(item.task), worker = workers.get(item.task);
  const kind = dotKind(item, new Set(workers.keys()), new Set(waits.keys()));
  const dot = kind !== "turn" ? kind : item.column === "Blocked" ? "stuck" : item.column === "Approved" ? "ok" : "turn";
  const tone = wait ? "amber" : ["Stuck", "Blocked"].includes(item.column) ? "red" : item.column === "Approved" ? "green"
    : ["Done", "Backlog", "Technical debt"].includes(item.column) ? "muted" : "ink";
  const label = wait ? wait.kind : item.column === "waiting" ? t("waiting_machine") : stateText(item);
  return {task: item.task, number: numberOf(item.task), title: item.title || repoOf(item.task), label, tone, dot,
          meta: [worker?.phase ? tr(worker.phase) : null, ...taskMarks(item)].join(" · "),
          order: wait ? wait.order - WAIT_ORDER.length : COLUMN_ORDER.indexOf(item.column)};
}

function taskGroups(s, queue, query, folded) {
  const items = waitItems(s, queue);
  const waits = new Map(items.filter(item => !item.stuck).map(item => [item.task, item]));
  const workers = new Map((s.workers || []).map(w => [w.task, w]));
  const patches = new Map(fields(s, queue).map(patch => [patch.name, patch]));
  const lanes = flightPaths(s, queue, items), many = lanes.length > FEW_PROJECTS;
  const number = row => Number(row.task.split("#")[1]);
  return lanes.map(lane => {
    const rows = (patches.get(lane.name)?.tasks || []).filter(item => taskMatches(item, query)).map(item => taskRow(item, waits, workers))
      .sort((a, b) => a.order - b.order || number(a) - number(b));
    const chosen = folded[lane.name];
    const open = query ? true : chosen !== undefined ? !chosen : !many || lane.attention;
    const looks = s.bazras?.last || {};
    return {name: lane.name, line: lane.line, tone: lane.tone, paused: lane.paused, count: rows.length, open, rows,
            limit: overLimit(s, lane.name), watched: lane.name in looks, look: looks[lane.name] || null};
  }).filter(group => !query || group.rows.length);
}

function groupsHtml(groups, query, queue) {
  if (!groups.length) return `<div class="card empty">${t(query ? "no_match" : queue ? "tasks_empty" : "reading_board")}</div>`;
  const row = r => `<button class="task-row" data-review="${esc(r.task)}"><span class="row-state tone-${r.tone}"><i class="pdot ${r.dot}"></i>${esc(r.label)}</span>
    <span class="row-title" dir="auto"><span class="number">${r.number}</span> ${esc(r.title)}</span>${r.meta ? `<span class="row-meta" dir="auto">${esc(r.meta)}</span>` : ""}</button>`;
  return groups.map(g => `<details class="group" data-project="${esc(g.name)}" data-open="${g.open}"${g.open ? " open" : ""}><summary><b>${bdi(g.name)}</b>
    <span class="tone-${g.tone}">${esc(g.line)}</span>${limitBadge(g.limit)}<span class="spacer"></span><span class="group-count">${num(g.count)}</span></summary>${g.watched ? bazrasLine(g.look) : ""}${g.rows.map(row).join("")}</details>`).join("");
}

// How long a bee has flown, in whole minutes.
function soFar(started, now) {
  const minutes = Math.max(0, Math.round((now - new Date(started)) / 60000));
  return minutes < 60 ? fillIn("so_far_min", {n: num(minutes)}) : fillIn("so_far_hours", {h: num(Math.floor(minutes / 60)), m: num(minutes % 60)});
}

// Each running worker with its task, project, phase, machine and time so far; with none, why: stopped, at a usage
// limit (until it resets, when `/usage` said), asleep, or simply none.
function beesAtWork(s, queue, now) {
  const titles = Object.fromEntries(Object.values(queue?.projects || {}).flatMap(columns => Object.values(columns).flat()).map(item => [item.task, item.title]));
  const rows = (s.workers || []).map(w => ({task: w.task, title: titles[w.task] || repoOf(w.task), run: w.run_id || null,
    meta: [w.project || repoOf(w.task), w.phase ? tr(w.phase) : null, w.machine, w.started ? soFar(w.started, now) : null].filter(Boolean).join(" · ")}));
  const most = s.parallel?.total, usage = s.usage || {}, limits = s.limits || {};
  const over = ["session", "week"].filter(name => usage[name] >= limits[name]);
  const resets = over.map(name => usage[`${name}_resets`]).filter(Boolean).sort().pop();
  const none = rows.length ? null : s.stop_requested ? t("bees_none_stopped")
    : over.length ? (resets ? fillIn("bees_none_limit_at", {at: when(resets)}) : t("bees_none_limit"))
    : s.supervisor !== "awake" ? t("bees_none_asleep") : t("bees_none");
  return {count: most ? fillIn("bees_of", {n: num(rows.length), most: num(most)}) : num(rows.length), rows, none};
}

function beesHtml(view) {
  const row = r => `<div class="bee-row"><i class="pdot bee"></i><button class="bee-who" data-review="${esc(r.task)}"><b dir="auto">${numberOf(r.task)} ${esc(r.title)}</b><small dir="auto">${esc(r.meta)}</small></button>
    ${r.run ? `<button class="btn small danger" data-stop="${esc(r.run)}">${t("stop")}</button>` : ""}</div>`;
  return `<div class="today-head"><b>${t("active_workers")}</b><span class="muted">${esc(view.count)}</span></div>${view.rows.map(row).join("") || `<div class="bee-row muted">${esc(view.none)}</div>`}`;
}

// The project's last look, in its group; only for a project Bazras looks at.
function bazrasLine(last) {
  const said = !last ? t("bazras_none_yet") : lookBadge(last);
  return `<div class="bazras-line">${t("bazras_last")}: ${said}${last ? ` <span class="number">${esc(dayName(last.date))}</span>` : ""} <button class="textlink" data-tab="bazras">${t("tab_bazras")} →</button></div>`;
}

function lookBadge(look) {
  if (look.all_well) return `<span class="badge" style="--c:#2f8a4e">${t("bazras_all_well")}</span>`;
  if (look.findings) return `<span class="badge" style="--c:#d9604f">${t("bazras_findings").replace("{count}", num(look.findings))}</span>`;
  return `<span class="badge" style="--c:#f2a65a">${t("bazras_not_checked")}</span>`;
}

// Bazras's tab: each project's switch and hour, then its newest reports. Bazras is off for every project
// until the user turns it on here. A report is written by an agent: it is shown as text, never as markup.
async function refreshBazras(force = false) {
  const box = $("bazrasreports"), data = await get("/bazras");
  const key = JSON.stringify([lang, data]);
  if (!force && (key === refreshBazras.key || box.contains(document.activeElement))) return;  // Keep what is being typed.
  refreshBazras.key = key;
  box.innerHTML = `<div class="card pad muted">${esc(t("bazras_about"))}</div>` + data.projects.map(p => {
    const looks = p.reports.map(look => `<div class="look"><div class="look-head"><b class="number">${esc(dayName(look.date))}</b>${lookBadge(look)}
      ${look.all_well ? "" : `<span class="spacer"></span><button class="btn small" data-fly="didban" data-focus="${esc(p.name)}" title="${esc(t("bazras_take_hint"))}">${t("bazras_take")}</button>`}</div>
      ${look.all_well ? "" : `<pre class="report" dir="ltr">${esc(look.text)}</pre>`}</div>`).join("");
    const said = p.paused_in_config ? t("project_on_pause") : p.enabled ? t("bazras_daily_at").replace("{at}", num(p.at)) : t("bazras_is_off");
    const controls = `<span class="spacer"></span><label class="look-head"><input type="checkbox" data-inspect-on="${esc(p.name)}"${p.enabled ? " checked" : ""}> ${t("bazras_on")}</label>
      <input type="time" step="60" value="${esc(p.at)}" data-inspect-at="${esc(p.name)}" aria-label="${esc(t("bazras_hour"))}" dir="ltr">
      <button class="btn small" data-inspect="${esc(p.name)}">${t("save")}</button>`;
    return `<div class="card pad"><div class="look-head"><h2 class="card-title">${bdi(p.name)}</h2><span class="muted">${esc(said)}</span>${controls}</div>
      ${looks || (p.enabled ? `<div class="empty">${t("bazras_none_yet")}</div>` : "")}</div>`;
  }).join("");
}

async function saveInspect(button) {
  const name = button.dataset.inspect, box = $("bazrasreports");
  const on = box.querySelector(`[data-inspect-on="${CSS.escape(name)}"]`).checked;
  const at = box.querySelector(`[data-inspect-at="${CSS.escape(name)}"]`).value;
  if (await act(button, `/projects/${encodeURIComponent(name)}/inspect?enabled=${on}${at ? `&at=${encodeURIComponent(at)}` : ""}`)) {
    toast(t(on ? "bazras_saved_on" : "bazras_saved_off").replace("{project}", name).replace("{at}", num(at)));
    await refreshBazras(true).catch(() => {});
  }
}

// A number with a minus and a plus; each press sends the new number at once. `path` holds {n} for it. It never goes
// below one, nor above `most`.
function stepper(value, path, label, step = 1, most = Infinity, show = num) {
  const button = (by, sign) => `<button type="button" class="btn small" data-step="${by}" data-step-path="${esc(path)}" data-step-from="${value}"${most < Infinity ? ` data-step-most="${most}"` : ""} aria-label="${esc(`${t(by < 0 ? "less" : "more")}: ${label}`)}"${value + by < 1 || Math.min(most, value + by) === value ? " disabled" : ""}>${sign}</button>`;
  return `<span class="stepper">${button(-step, "−")}<b class="number">${show(value)}</b>${button(step, "+")}</span>`;
}

async function changeStep(button) {
  const value = Math.min(Number(button.dataset.stepMost || Infinity), Number(button.dataset.stepFrom) + Number(button.dataset.step));
  renderSettings.key = null;  // Whatever the answer, the next state draws what the server kept.
  if (!await act(button, button.dataset.stepPath.replace("{n}", value))) refreshState().catch(() => {});
}

// The Settings page: the projects, in the registry's order, each opening its settings in a pop-up; beside them the
// usage limits, the machines, and Kandu's own switches and pace, which change at once as before.
function renderSettings(s) {
  if (tab !== "settings") return;
  const projects = settingsProjects(s, lastQueue);
  const key = JSON.stringify([lang, projects, s.project_settings, s.limits, s.machines, s.clean_merged, s.drop_blockers,
                              s.show_requests, s.default_look, s.backup, s.pace, s.parallel?.total, s.notify, s.codex?.limits]);
  if (key === renderSettings.key) return;
  renderSettings.key = key;
  $("projectsettings").innerHTML = settingsProjectsHtml(projects);
  $("limitsettings").innerHTML = limitsHtml(s);
  $("machinesettings").innerHTML = machinesHtml(s);
  $("kandusettings").innerHTML = kanduHtml(s);
  tgKeep(() => { $("notifysettings").innerHTML = notifyHtml(s.notify); });
}

// Each project with its state line, the same as its lane on Today, and a short summary of its settings.
function settingsProjects(s, queue) {
  const lanes = new Map(flightPaths(s, queue, waitItems(s, queue)).map(lane => [lane.name, lane]));
  return (s.project_settings || []).map(p => {
    const lane = lanes.get(p.name), most = p.max_parallel_workers;
    const [tone, line] = p.paused ? ["muted", t("project_on_pause")] : lane ? [lane.tone, lane.line] : ["muted", ""];
    const summary = [t(p.paused ? "project_on_pause" : "set_running"), fillIn(most === 1 ? "set_bees_one" : "set_bees", {n: num(most)}),
                     t(`mode_${mergeMode(s, p.name)}`)].join(" · ");
    return {name: p.name, tone, line, summary};
  });
}

function settingsProjectsHtml(projects) {
  return projects.map(p => `<div class="set-project"><div class="set-project-who"><div class="set-project-head"><b>${bdi(p.name)}</b>${p.line ? `<span class="tone-${p.tone}">${esc(p.line)}</span>` : ""}</div>
    <div class="set-project-summary">${esc(p.summary)}</div></div>
    <button type="button" class="btn" data-settings-open="${esc(p.name)}" aria-label="${esc(`${p.name} · ${t("set_open")}`)}">${t("set_open")}</button></div>`).join("");
}

// A project's pop-up shows every setting it has, in its groups. Nothing changes until Save, and then each change
// goes through the call it always had, so it is checked and logged as before.
const SETTING_GROUPS = [["set_group_work", ["paused", "max_parallel_workers", "worker_cli", "reviewer_cli", "priority", "daily_token_limit", "multi_user"]], ["set_group_merge", ["auto_merge", "frozen"]], ["set_group_queen", ["split_approval", "queen_answers_one_way"]]];

function settingsDraft(row) {
  return {name: row.name, ...Object.fromEntries(SETTING_GROUPS.flatMap(([, keys]) => keys).map(key => [key, row[key]]))};
}

// One call for each setting that changed, the same call the dashboard always made for it. A new name goes last, so
// every other call still names the project as the server knows it.
function settingsCalls(name, was, now) {
  const project = encodeURIComponent(name);
  const path = (key, value) => key === "paused" ? `/projects/${project}/${value ? "pause" : "resume"}`
    : key === "max_parallel_workers" ? `/parallel?project=${encodeURIComponent(`${name}:${value}`)}`
    : `/projects/${project}/settings?${key}=${encodeURIComponent(value)}`;
  return [...SETTING_GROUPS.flatMap(([, keys]) => keys), "name"].filter(key => now[key] !== was[key]).map(key => ({setting: key, path: path(key, now[key])}));
}

// Turning "merges by itself" on asks first; turning it off asks nothing.
function mergeOnAsked(was, now) {
  return !was.auto_merge && Boolean(now.auto_merge);
}

// What Save does: close when nothing changed, ask before merging by itself, or save.
function saveStep(edit) {
  if (!settingsCalls("", edit.was, edit.now).length) return "close";
  return mergeOnAsked(edit.was, edit.now) && !edit.asking ? "ask" : "save";
}

// Sends each change in turn. One the server takes becomes what the pop-up starts from, so it is not sent again; one
// it refuses is listed with why. `send` answers {ok} or {ok: false, why, stop}. An empty name is refused here, and
// once a new name is taken the pop-up goes on under it.
async function applySettings(name, edit, send) {
  edit.refused = [];
  for (const call of settingsCalls(name, edit.was, edit.now)) {
    if (call.setting === "name" && !edit.now.name) { edit.refused.push({setting: "name", why: tr("give the project a name")}); continue; }
    const answer = await send(call.path);
    if (answer.ok) {
      edit.was = {...edit.was, [call.setting]: edit.now[call.setting]};
      if (call.setting === "name") edit.name = edit.now.name;
      continue;
    }
    edit.refused.push({setting: call.setting, why: answer.why, ...(answer.running && {running: answer.running})});
    if (answer.stop) break;
  }
  return edit.refused;
}

// What runs on a project whose rename was refused: the cycle to wait out, each worker to wait for, and each free
// flight with a button that closes it, after which Save is pressed again.
function runningList(running = []) {
  if (!running.length) return "";
  const since = r => ({task: bdi(r.task), since: bdi(when(r.since))});
  return `<ul class="set-running">${running.map(r => r.kind === "cycle" ? `<li>${esc(t("run_cycle"))}</li>`
    : r.kind === "worker" ? `<li>${fillIn("run_worker", since(r))}</li>`
    : `<li>${fillIn("run_flight", since(r))} <button type="button" class="btn small" data-set-land="${esc(r.key)}" title="${esc(t("run_close_hint"))}">${esc(t("run_close"))}</button></li>`).join("")}</ul>`;
}

// Closes a free flight listed under a refused rename. Its line goes; once nothing is left, the pop-up says to save.
async function landForRename(button) {
  const edit = setEdit, key = button.dataset.setLand;
  if (!await act(button, `/flights/${encodeURIComponent(key)}/close`) && post.failed?.error !== "no such session") return;
  if (edit !== setEdit) return;
  for (const r of edit.refused) {
    if (!r.running?.some(x => x.key === key)) continue;
    r.running = r.running.filter(x => x.key !== key);
    if (!r.running.length) r.why = t("run_closed");
  }
  drawSettings();
}

const SETTING_LABELS = {name: "set_name", paused: "set_run_label", max_parallel_workers: "setting_workers", priority: "setting_priority", daily_token_limit: "setting_tokens", auto_merge: "setting_auto_merge", frozen: "setting_frozen", split_approval: "set_split_by", queen_answers_one_way: "set_one_way_by", worker_cli: "set_run_with", reviewer_cli: "set_review_with", multi_user: "set_multi_user"};
const SETTING_HINTS = {name: "set_name_hint", max_parallel_workers: "setting_workers_hint", priority: "setting_priority_hint", daily_token_limit: "setting_tokens_hint", auto_merge: "mode_auto_hint", frozen: "mode_frozen_hint", worker_cli: "set_run_with_hint", reviewer_cli: "set_review_with_hint", multi_user: "set_multi_user_hint"};

// One setting's control, drawn from the draft. A pause set in the config shows and cannot move. Codex chosen, for the
// workers or the reviewers, on a machine where it cannot run shows the doctor's reason beside that switch (`codex`,
// the machine's answer).
function settingControl(key, row, now, codex = null) {
  const label = t(SETTING_LABELS[key]), value = now[key];
  const hint = row.paused_in_config && key === "paused" ? t("paused_in_config_hint") : SETTING_HINTS[key] ? t(SETTING_HINTS[key]) : "";
  const head = `<div class="set-label"><span>${label}</span>${hint ? `<small>${esc(hint)}</small>` : ""}</div>`;
  const seg = (options, off = false, after = "") => `<div class="set-field stack">${head}<div class="seg" role="group" aria-label="${esc(label)}">${options.map(([v, text]) =>
    `<button type="button" data-draft="${key}" data-value="${v}" aria-pressed="${String(value) === v}"${off ? " disabled" : ""}>${t(text)}</button>`).join("")}</div>${after}</div>`;
  const step = () => `<div class="set-field">${head}<span class="stepper"><button type="button" class="btn small" data-draft="${key}" data-by="-1" aria-label="${esc(`${t("less")}: ${label}`)}"${value <= 1 ? " disabled" : ""}>−</button><b class="number">${num(value)}</b><button type="button" class="btn small" data-draft="${key}" data-by="1" aria-label="${esc(`${t("more")}: ${label}`)}">+</button></span></div>`;
  const flip = () => `<div class="set-field">${head}<button type="button" class="switch" role="switch" aria-checked="${Boolean(value)}" data-draft="${key}" aria-label="${esc(label)}"><i></i></button></div>`;
  if (key === "paused") return seg([["false", "set_running"], ["true", "project_on_pause"]], row.paused_in_config);
  if (key === "split_approval") return seg([["user", "set_me"], ["queen", "set_the_queen"]]);
  if (key === "queen_answers_one_way") return seg([["false", "set_me"], ["true", "set_the_queen"]]);
  if (key === "worker_cli" || key === "reviewer_cli") return seg([["claude", "cli_claude"], ["codex", "cli_codex"]], false, value === "codex" && codex?.why
    ? `<div class="sheet-note tone-amber" role="status" data-codex-why>${esc(fillIn("set_codex_why", {machine: codex.machine, why: tr(codex.why)}))}</div>` : "");
  if (key === "name") return `<div class="set-field stack">${head}<input type="text" class="name-field" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" data-draft="${key}" value="${esc(value)}" aria-label="${esc(label)}"></div>`;
  if (key === "daily_token_limit") return `<div class="set-field">${head}<input type="number" class="tokens-field" min="1" step="100000" dir="ltr" inputmode="numeric" data-draft="${key}" value="${esc(value)}" aria-label="${esc(label)}"></div>`;
  return key === "max_parallel_workers" || key === "priority" ? step() : flip();
}

function settingsBody(row, edit) {
  const groups = SETTING_GROUPS.map(([head, keys]) => `<section class="set-group"><h3>${t(head)}</h3>${keys.map(key => settingControl(key, row, edit.now, edit.codex)).join("")}</section>`).join("");
  const refused = edit.refused.length ? `<div class="set-refused" role="alert"><b>${t("set_refused")}</b><ul>${edit.refused.map(r =>
    `<li>${esc(t(SETTING_LABELS[r.setting]))}: <span dir="auto">${esc(r.why)}</span>${runningList(r.running)}</li>`).join("")}</ul></div>` : "";
  return `<div class="sheet-grip"></div><div class="sheet-head"><div class="sheet-who"><div class="muted">${t("tab_settings")}</div><h2>${bdi(row.name)}</h2></div>
    <button type="button" class="sheet-close" data-set-cancel aria-label="${esc(t("close"))}">✕</button></div>${refused}<section class="set-group">${settingControl("name", row, edit.now)}</section>${groups}
    <section class="set-group"><h3>${t("kanduban")}</h3><p class="muted">${t("kanduban_hint")}</p><div class="actions" id="setkanduban">${kandubanControls(row.name)}</div></section>
    <section class="set-danger"><h3>${t("set_danger")}</h3><p class="muted">${t("remove_project_hint")}</p><div class="actions"><button type="button" class="btn danger" data-remove="${esc(row.name)}">${t("remove_project")}</button></div></section>`;
}

function settingsFoot(edit) {
  if (edit.asking) return `<div class="sheet-note tone-amber">${t("set_merge_ask")}</div>
    <div class="actions"><button type="button" class="btn" data-set-no>${t("set_merge_no")}</button><button type="button" class="btn primary" data-set-yes>${t("set_merge_yes")}</button></div>`;
  return `<div class="actions"><button type="button" class="btn" data-set-cancel>${t("cancel")}</button><button type="button" class="btn primary" data-set-save>${t("save")}</button></div>`;
}

let setEdit = null;  // The open pop-up: its project, what the server had, the draft, what was refused, and whether it asks.

function openSettings(name) {
  const row = (lastState?.project_settings || []).find(p => p.name === name);
  if (!row) return;
  setEdit = {name, was: settingsDraft(row), now: settingsDraft(row), refused: [], asking: false, codex: null};
  drawSettings();
  $("setsheet").showModal();
  $("setbody").scrollTop = 0;
  if (row.worker_cli === "codex" || row.reviewer_cli === "codex") checkCodex(setEdit);
}

// Choosing Codex, for the workers or the reviewers, asks the project's machine, as the doctor does, whether Codex can
// run there. The answer is drawn only while the same pop-up still has Codex chosen for one of them.
async function checkCodex(edit) {
  edit.codex = null;
  const answer = await get(`/projects/${encodeURIComponent(edit.name)}/codex`).catch(() => null);
  if (edit !== setEdit || (edit.now.worker_cli !== "codex" && edit.now.reviewer_cli !== "codex")) return;
  edit.codex = answer;
  drawSettings();
}

function drawSettings() {
  const row = (lastState?.project_settings || []).find(p => p.name === setEdit.name) || {name: setEdit.name};
  $("setbody").innerHTML = settingsBody(row, setEdit);
  $("setfoot").innerHTML = settingsFoot(setEdit);
}

// A change in the pop-up changes only its draft.
function changeDraft(control) {
  const key = control.dataset.draft, now = setEdit.now;
  if (control.dataset.by) now[key] = Math.max(1, now[key] + Number(control.dataset.by));
  else if (control.dataset.value !== undefined) now[key] = {true: true, false: false}[control.dataset.value] ?? control.dataset.value;
  else if (control.getAttribute("role") === "switch") now[key] = !now[key];
  else { now[key] = key === "name" ? control.value.trim() : control.value.trim() === "" ? "" : Number(control.value); setEdit.asking = false; $("setfoot").innerHTML = settingsFoot(setEdit); return; }
  setEdit.asking = false;
  drawSettings();
  if ((key === "worker_cli" || key === "reviewer_cli") && now[key] === "codex") checkCodex(setEdit);
}

async function saveSettings(button) {
  const edit = setEdit, step = saveStep(edit);
  if (step === "close") { $("setsheet").close(); return; }
  if (step === "ask") { edit.asking = true; drawSettings(); return; }
  if (!token && !await askToken()) return;
  const send = async path => {
    post.failed = null;
    if (await act(button, path)) return {ok: true};
    return {ok: false, why: post.failed?.error ? tr(post.failed.error) : t("request_failed"), stop: !token, running: post.failed?.running};
  };
  const refused = await applySettings(edit.name, edit, send);
  renderSettings.key = null;  // Whatever the answers, the next state draws what the server kept.
  if (edit !== setEdit) return;
  edit.asking = false;
  if (refused.length) { drawSettings(); $("setbody").scrollTop = 0; return; }
  $("setsheet").close();
  toast(fillIn("set_saved", {name: edit.name}));
}

// Taking a project out of Kandu: the first click asks on the button itself, the second acts. Nothing is typed.
// When the PR with its memory cannot be made, nothing is removed and the button becomes the choice to go on
// without that PR, asked the same way.
async function removeProject(button) {
  if (button.dataset.sure !== "true") {
    button.dataset.sure = "true";
    button.textContent = t("remove_sure");
    return;
  }
  button.dataset.sure = "false";
  const name = button.dataset.remove, without = button.dataset.withoutPr === "true";
  const removed = await act(button, `/projects/${encodeURIComponent(name)}/remove${without ? "?without_memory_pr=true" : ""}`, t("removing"));
  if (!removed) {
    const offerWithout = Boolean(post.failed?.memory_pr_failed);
    button.dataset.withoutPr = String(offerWithout || without);
    button.textContent = t(offerWithout || without ? "remove_without_pr" : "remove_project");
    return;
  }
  const memory = removed.memory || {};
  toast([fillIn("removed_msg", {name}), memory.why ? fillIn(`memory_${memory.why}`, {pr: memory.pr || ""}) : ""].filter(Boolean).join(" "));
  closeSettings(name);
  renderSettings.key = null;
  refreshState().catch(() => {});
}

// The pop-up of a project that was removed closes.
function closeSettings(name) {
  if (setEdit?.name === name) $("setsheet").close();
}

// A switch for all of Kandu: a press sends the other value at once.
function switchRow(label, on, path, hint = "") {

function defaultLookHtml(look) {

// Telegram: which kinds of news Kandu sends, as `notify.events` in the config; the bot's token and the chat stay in
// local/.env and never reach the page. The kinds go in the order a user meets them; one the page does not know yet
// comes last, by its name.
const NOTIFY_ORDER = ["pr_ready", "task_done", "needs_decision", "failure", "supervisor_stopped", "usage_limit", "claude_login", "machine_unreachable"];
const notifyKinds = n => [...NOTIFY_ORDER.filter(k => n.kinds.includes(k)), ...n.kinds.filter(k => !NOTIFY_ORDER.includes(k))];
const notifyPath = events => `/notify?events=${encodeURIComponent([...events].join(",") || "none")}`;  // none: send nothing
// Telegram's connection: the bot's token and the chat go in a POST's body to local/.env, so they are in no URL and no
// log, and the page only learns whether each is set. A field is never filled back in.
async function sendForm(button, path, fields) {
  if (!token && !await askToken()) return false;
  return busy(button, async () => {
    const r = await fetch("/api/v1" + path, {method: "POST", body: new URLSearchParams(fields),
      headers: {Authorization: "Bearer " + token, "Content-Type": "application/x-www-form-urlencoded"}});
    if (r.status === 403) token = "";
    const answer = await r.json().catch(() => ({}));
    if (!r.ok) { toast(r.status === 403 ? t("token_required") : tr(answer.error) || t("request_failed")); return false; }
    return answer;
  });
}
let tgChats = null;  // the chats that wrote to the bot, once Find my chat asked; a press on one uses it
// A redraw keeps what is typed in the two fields, and the field being typed in.
function tgKeep(draw) {
  const kept = ["tg-token", "tg-chat"].map(id => [id, $(id)?.value || ""]), focused = document.activeElement?.id;
  draw();
  for (const [id, value] of kept) if ($(id)) $(id).value = value;
  if (focused?.startsWith("tg-") && $(focused)) $(focused).focus();
}
function tgConnectHtml(tg) {
  if (!tg) return "";
  const mark = set => `<span class="${set ? "tg-ok" : "tg-bad"}">${set ? "✓ " + esc(t("tg_set")) : esc(t("tg_not_set"))}</span>`;
  const bot = tg.bot ? `<bdi dir="ltr" class="muted">@${esc(tg.bot)}</bdi>` : "";
  const status = tg.error ? `<span class="tg-bad">${esc(tg.error)}</span>` : tg.listening ? `<span class="tg-ok">${esc(t("tg_listening"))}</span>` : "";
  const chats = tgChats === null ? "" : tgChats.length
    ? `<div class="tg-chats">${tgChats.map(c => `<button type="button" class="btn small" data-tg-use="${esc(c.id)}" title="${esc(t("tg_use_hint"))}"><bdi>${esc(c.name)}</bdi> <bdi dir="ltr" class="muted">${esc(c.id)}</bdi></button>`).join("")}</div>`
    : `<div class="muted">${esc(t("tg_no_chats").replace("{bot}", tg.bot ? "@" + tg.bot : t("tg_your_bot")))}</div>`;
  return `<div class="tg-connect">
    <div class="tg-line" title="${esc(t("tg_token_hint"))}"><label for="tg-token">${esc(t("tg_token"))}</label>${mark(tg.token_set)}${bot}<input id="tg-token" type="password" autocomplete="off" spellcheck="false" dir="ltr" placeholder="123456789:AA…" aria-label="${esc(t("tg_token"))}"><button type="button" class="btn small" data-tg-send="token">${esc(t("tg_save_token"))}</button></div>
    <div class="tg-line" title="${esc(t("tg_chat_id_hint"))}"><label for="tg-chat">${esc(t("tg_chat"))}</label>${mark(tg.chat_set)}<input id="tg-chat" inputmode="numeric" autocomplete="off" dir="ltr" placeholder="123456789" aria-label="${esc(t("tg_chat"))}"><button type="button" class="btn small" data-tg-send="chat">${esc(t("tg_save_chat"))}</button><button type="button" class="btn small" data-tg-find title="${esc(t("tg_chat_hint"))}"${tg.token_set ? "" : " disabled"}>${esc(t("tg_find_chat"))}</button></div>
    ${chats}
    <div class="tg-line">${status}<button type="button" class="btn small" data-tg-test title="${esc(t("tg_test_hint"))}"${tg.token_set && tg.chat_set ? "" : " disabled"}>${esc(t("tg_test"))}</button></div>
    <div class="muted tg-note">${esc(t("tg_secret_note"))}</div></div>`;
}
async function tgConnect(button) {
  const d = button.dataset;
  let answer = null;
  if (d.tgSend) {
    const field = $(d.tgSend === "token" ? "tg-token" : "tg-chat"), value = field.value.trim();
    if (!value) { field.focus(); return; }
    answer = await sendForm(button, `/telegram/${d.tgSend}`, d.tgSend === "token" ? {token: value} : {chat_id: value});
    if (answer) { field.value = ""; if (d.tgSend === "token") tgChats = null; toast(t("tg_connect_saved")); }
  } else if (d.tgUse) {
    answer = await sendForm(button, "/telegram/chat", {chat_id: d.tgUse});
    if (answer) { tgChats = null; toast(t("tg_connect_saved")); }
  } else if ("tgFind" in d) {
    const found = await sendForm(button, "/telegram/chats", {});
    if (found) tgChats = found.chats || [];
  } else if ("tgTest" in d) {
    if (await sendForm(button, "/telegram/test", {})) toast(t("tg_test_sent"));
  }
  if (answer?.notify && lastState) lastState.notify = answer.notify;
  tgRedraw();
}
function notifyHtml(n) {
  if (!n) return "";
  const toggled = kind => { const events = new Set(n.events); if (events.has(kind)) events.delete(kind); else events.add(kind); return notifyPath(events); };
  return `<div class="side-head"><b>${t("tg_title")}</b></div><div class="side-note">${esc(t(n.adapter === "none" ? "tg_off" : "tg_about"))}</div>
    ${n.telegram ? `<div class="side-head tg-head"><b>${esc(t("tg_connection"))}</b></div>${tgConnectHtml(n.telegram)}` : ""}
    ${n.telegram ? switchRow(t("tg_buttons"), n.telegram.buttons, `/telegram/buttons?enabled=${!n.telegram.buttons}`, t("tg_buttons_hint")) : ""}
    <div class="side-head tg-head"><b>${esc(t("tg_kinds"))}</b></div>
    ${notifyKinds(n).map(kind => switchRow(t(`notify_${kind}`) || kind, n.events.includes(kind), toggled(kind), t(`notify_${kind}_hint`) || "")).join("")}`;
}
const tgRedraw = () => { renderSettings.key = null; if (lastState) renderSettings(lastState); };

// Kandu's own switches, its default look, its backup and its pace, each working as it always did.
function kanduHtml(s) {
  const pace = s.pace || {}, b = s.backup;
  const flag = (on, label, path, hint) => on === undefined ? "" : switchRow(t(label), Boolean(on), `${path}?enabled=${!on}`, hint ? t(hint) : "");
  const failed = b?.last?.type === "backup_failed";
  const backup = b ? `<div class="side-row"><span class="side-label">${t("backup")}</span><span class="${failed ? "tone-red" : "muted"}">${esc(failed ? t("backup_last_failed") : b.enabled ? fillIn("backup_daily_at", {at: num(b.at)}) : t("backup_off"))}</span>
    <button type="button" class="textbtn" data-backup>${t("change")}</button></div>` : "";
  const paceRow = (label, value, path, step) => value ? `<div class="side-row"><span class="side-label">${t(label)}</span>${stepper(value, path, t(label), step)}</div>` : "";
  return `<div class="side-head"><b>${t("kandu_itself")}</b></div>
    ${flag(s.clean_merged, "clean_merged", "/clean-merged", "clean_merged_hint")}${flag(s.drop_blockers, "switch_drop_blockers", "/drop-blockers")}${flag(s.show_requests, "switch_requests", "/requests")}${s.default_look ? defaultLookHtml(s.default_look) : ""}${backup}
    ${paceRow("pace_workers", s.parallel?.total, "/parallel?total={n}", 1)}${paceRow("pace_wake", pace.wake_every_minutes, "/pace?wake_every_minutes={n}", 5)}${paceRow("pace_cycle", pace.max_cycle_minutes, "/pace?max_cycle_minutes={n}", 5)}
    <div class="side-note">${t("pace_hint")}</div>`;
}

async function flipSwitch(button) {
  renderSettings.key = null;  // Whatever the answer, the next state draws what the server kept.
  if (!await act(button, button.dataset.switch)) refreshState().catch(() => {});
}

// The config's priority, 1 first; a project the config does not name goes last.
function rank(name) {
  const at = (lastState.project_order || []).indexOf(name);
  return at < 0 ? 1e9 : at;
}

function renderProjects() {
  if (!lastState || tab !== "tasks") return;
  const query = taskQuery($("search").value);
  const groups = taskGroups(lastState, lastQueue, query, folded);
  const key = JSON.stringify([lang, query, groups, Boolean(lastQueue)]);
  if (key === listKey) return;
  listKey = key;
  $("projects").innerHTML = groupsHtml(groups, query, lastQueue);
}

async function refreshQueue(state, fresh) {
  try {
    lastQueue = await get(fresh ? "/queue?fresh=1" : "/queue");
    renderStats(state);
    renderProjects();
    renderSettings(state);  // its state lines come from the queue
    renderBees(state);  // its tasks' titles come from the queue
    renderScene(state, lastQueue);
    renderToday();
    if (lastQueue.stale) toast(t("github_unreadable"));
  } catch { toast(t("github_unreadable")); }

function didDuring(actions) {
  const done = ["requests", "tasks", "answers"].filter(kind => actions[kind]).map(kind => `${num(actions[kind])} ${t("did_" + kind)}`);
  return done.join(" · ") || "—";
}

async function refreshDidban() {
  const {sessions} = await get("/didban");
  const rows = sessions.map(s => `<tr><td class="fit number">${esc(s.started ? when(s.started) : "—")}</td><td dir="auto">${esc(s.title || "—")}</td>

    <td class="fit end" title="${esc(num(s.tokens.input + s.tokens.output + s.tokens.cache_read + s.tokens.cache_creation))}">${esc(short(s.tokens.input + s.tokens.output + s.tokens.cache_creation))}</td></tr>`).join("");
  $("didbansessions").innerHTML = `<h3>${t("didban_sessions")}</h3>` + (rows ? `<table class="rows"><thead><tr><th class="fit">${t("when")}</th><th>${t("session_title")}</th><th class="fit hide-narrow">${t("session_did")}</th><th class="fit end">${t("tokens")}</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">${t("no_didban_sessions")}</div>`);

// A task's free flight: open it, or go to it and close it.
function flightControls(flight, target, label, go = t("flight_go"), close = t("flight_close")) {
  if (flight?.status === "opening") return `<button class="btn busy" disabled>${t("flight_opening")}</button>`;
  if (flight?.status === "open") return `<a class="btn primary" href="${esc(flight.url)}" target="_blank" rel="noopener">${go} ↗</a><button class="btn" data-land="${esc(flight.key)}">${close}</button>`;

// A Kanduban is named by its project; Zanbourdar is the free flight with neither a task nor a project.

async function refreshFlights() {
  flights = await get("/flights");
  for (const f of flights.open.filter(f => f.status === "failed" && !flightsWarned.has(f.session))) {
    flightsWarned.add(f.session);

async function openFlight(button) {
  const target = button.dataset.fly;
  const project = target.startsWith("kanduban:") ? target.slice("kanduban:".length) : null;
  const shown = project && kandubanOf(project);

// Tokens by project over a range, each project's tasks under it, then Kandu itself and the sessions, so the rows
// add up to the total. Today also shows what counts against each project's daily limit.
async function refreshUsage() {
  const range = $("usagerange").value, custom = range === "custom";
  $("usagedates").hidden = !custom;
  if (custom && !($("usagefrom").value && $("usageto").value)) return;
  const query = custom ? `from=${$("usagefrom").value}&to=${$("usageto").value}` : `range=${range}`;
  const usage = await get(`/usage?${query}`);
  const most = Math.max(1, ...usage.projects.map(p => p.total), usage.kandu, usage.sessions);
  const bar = value => `<span class="tokenbar" style="width:${(100 * value / most).toFixed(1)}%"></span>`;
  const cell = value => `<td class="fit end" title="${esc(num(value))}">${esc(short(value))}${bar(value)}</td>`;
  const limit = p => p.limit ? `<span class="limit-note${p.counted >= p.limit ? " over" : ""}">${esc(fillIn("of_limit", {counted: short(p.counted), limit: short(p.limit)}))}</span>` : "";
  const rows = usage.projects.map(p => `<tr class="group"><td>${bdi(p.project)}${limit(p)}</td><td class="fit hide-narrow"></td>${cell(p.total)}</tr>`
    + p.tasks.map(task => `<tr class="sub" data-review="${esc(task.task)}"><td class="number">${numberOf(task.task)}</td><td class="fit hide-narrow">${task.outcome ? esc(tr(task.outcome)) : "—"}</td>${cell(task.total)}</tr>`).join("")).join("")
    + (usage.kandu ? `<tr class="group" title="${esc(t("kandu_itself_hint"))}"><td>${t("kandu_itself")}</td><td class="fit hide-narrow"></td>${cell(usage.kandu)}</tr>` : "")
    + (usage.sessions ? `<tr class="group"><td>${t("usage_sessions")}</td><td class="fit hide-narrow"></td>${cell(usage.sessions)}</tr>` : "");
  $("usage").innerHTML = rows ? `<table class="rows"><thead><tr><th>${t("project")}</th><th class="fit hide-narrow">${t("outcome")}</th><th class="fit end">${t("tokens")}</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">${t("no_usage")}</div>`;
  const chips = obj => Object.entries(obj).sort(([, a], [, b]) => b - a).map(([name, used]) => `<span class="chip">${bdi(tr(name))}: ${esc(short(used))}</span>`);
  $("usagetotals").innerHTML = [`<span class="chip"><b>${t("total")}: ${esc(short(usage.total))}</b></span>`, ...chips(usage.roles), ...chips(usage.models)].join("");
}

async function refreshDays() {
  refreshDidban();
  refreshUsage().catch(() => {});
  const {days} = await get("/days");
  const select = $("day"), chosen = select.value;
  select.innerHTML = days.slice().reverse().map(d => `<option value="${esc(d)}">${esc(dayName(d))}</option>`).join("");
  if (days.includes(chosen)) select.value = chosen;
  if (!days.length) { $("byday").innerHTML = `<div class="empty">${t("no_activity")}</div>`; return; }
  const day = await get("/days/" + select.value);
  const finished = Object.fromEntries(day.finished.map(f => [f.task, f.outcome]));
  const spent = Object.entries(day.tasks).sort(([, a], [, b]) => b.total - a.total);
  const most = Math.max(1, ...spent.map(([, used]) => used.total));
  const rows = spent.map(([task, used]) => `<tr data-review="${esc(task)}"><td class="fit number">${numberOf(task)}</td><td>${bdi(repoOf(task))}</td>
    <td class="fit hide-narrow">${finished[task] ? esc(tr(finished[task])) : "—"}</td>
    <td class="fit end" title="${esc(num(used.total))}">${esc(short(used.total))}<span class="tokenbar" style="width:${(100 * used.total / most).toFixed(1)}%"></span></td></tr>`).join("");
  $("byday").innerHTML = rows ? `<table class="rows"><thead><tr><th class="fit">${t("number")}</th><th>${t("project")}</th><th class="fit hide-narrow">${t("outcome")}</th><th class="fit end">${t("tokens")}</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">${t("no_activity")}</div>`;
  const parts = obj => Object.entries(obj).map(([name, used]) => `<span class="chip">${bdi(tr(name))}: ${esc(short(used.total))}</span>`);
  $("daytotals").innerHTML = [`<span class="chip">${t("total")}: ${esc(short(day.total.total))}</span>`, ...parts(day.roles), ...parts(day.models)].join("");
}

function renderLive() {
  const rows = live.map(e => `<tr${e.task ? ` data-review="${esc(e.task)}"` : ""}><td class="fit number">${esc(clock(e.ts))}</td><td class="fit">${esc(tr(e.type))}</td>
    <td class="fit">${e.task ? numberOf(e.task) : ""}</td><td dir="auto">${esc([e.phase, e.decision, e.reason, e.outcome].filter(Boolean).map(tr).join(" · "))}</td></tr>`).join("");
  $("live").innerHTML = rows ? `<table class="rows feed"><tbody>${rows}</tbody></table>` : `<div class="empty">${t("nothing_yet")}</div>`;
}

async function loadLive() {
  const seen = [];
  for (let after = 0; ; ) {
    const page = await get(`/events?after=${after}`);
    seen.push(...page.events);
    if (!page.events.length || page.next === after) break;
    after = page.next;
  }
  live = [...seen.reverse(), ...live].slice(0, LIVE_LINES);
  renderLive();
  renderToday();
}

function openModal(title) {
  $("modaltitle").innerHTML = title;
  if (!$("modal").open) $("modal").showModal();
}

async function showRun(runId) {  // over the task's sheet, when opened from it
  shownRun = runId;
  const {actions} = await get("/runs/" + encodeURIComponent(runId));
  if (shownRun !== runId) return;
  openModal(`${t("run")} ${bdi(runId)}`);
  const box = $("modalbody").querySelector(".log");
