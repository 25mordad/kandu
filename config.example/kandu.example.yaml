language: en                   # optional; what Kandu says to you: messages, briefs, split proposals, the page's first view. Default en. GitHub stays in English

dashboard:
  bind: 127.0.0.1             # stay on this machine; reach it from another through an SSH tunnel
  port: 8790                 # keep this port free for Kandu on the brain's machine
